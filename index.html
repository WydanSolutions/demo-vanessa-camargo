/* ===== js/25-salon-dibujo.js ===== */
/* ============================================================
   BODA · SALÓN · EL DIBUJO
   Todo en metros (1 unidad del SVG = 1 metro).
   · dibujarSalon()    → el plano completo (piso, paredes, reglas,
                          elementos y mesas)
   · dibujarElemento() → pista, DJ, barra, living, árbol…
   · dibujarMesa()     → la mesa con su mantel, camino, centro,
                          platos y sillas (y la gente sentada)
   · svgMesaSola()     → una mesa sola, para vistas previas
   Los colores salen siempre de la paleta de la boda.
   ============================================================ */

const COLOR_MANTEL = (k, b) => {
  const [c1, c2, c3, c4] = Boda.paleta(b);
  return { c1, c2, c3, c4, blanco: '#FFFFFF' }[k] || c4;
};

/* Medidas reales de cada mesa según su forma y cantidad de lugares */
function medidasMesa(m) {
  const f = FORMAS_MESA.find(x => x.id === m.forma) || FORMAS_MESA[0];
  if (m.forma === 'redonda') { const d = Math.max(1.2, Math.min(2.4, 0.95 + m.cap * 0.085)); return { w: d, h: d }; }
  if (m.forma === 'oval') { const w = Math.max(2.2, m.cap * 0.25); return { w, h: 1.5 }; }
  if (m.forma === 'cuadrada') { const l = Math.max(1.2, Math.ceil(m.cap / 4) * 0.62 + 0.2); return { w: l, h: l }; }
  const w = Math.max(f.w * 0.6, Math.ceil(m.cap / 2) * 0.62 + 0.2);
  return { w, h: f.h };
}

/* Dónde va cada silla (y su plato), relativo al centro de la mesa */
function lugaresMesa(m) {
  const { w, h } = medidasMesa(m);
  const L = [];
  if (m.forma === 'redonda' || m.forma === 'oval') {
    for (let i = 0; i < m.cap; i++) {
      const a = (-90 + i * 360 / m.cap) * Math.PI / 180;
      L.push({ x: Math.cos(a) * (w / 2 + 0.3), y: Math.sin(a) * (h / 2 + 0.3), px: Math.cos(a) * (w / 2 - 0.2), py: Math.sin(a) * (h / 2 - 0.2) });
    }
  } else if (m.forma === 'cuadrada') {
    const k = Math.ceil(m.cap / 4);
    for (let i = 0; i < m.cap; i++) {
      const lado = Math.floor(i / k), j = i % k, t = -w / 2 + (j + 0.5) * w / k;
      const pos = [[t, -h / 2 - 0.3, t, -h / 2 + 0.2], [w / 2 + 0.3, t, w / 2 - 0.2, t], [-t, h / 2 + 0.3, -t, h / 2 - 0.2], [-w / 2 - 0.3, -t, -w / 2 + 0.2, -t]][lado];
      L.push({ x: pos[0], y: pos[1], px: pos[2], py: pos[3] });
    }
  } else {
    const arriba = Math.ceil(m.cap / 2), abajo = m.cap - arriba;
    for (let i = 0; i < arriba; i++) { const x = -w / 2 + (i + 0.5) * w / arriba; L.push({ x, y: -h / 2 - 0.3, px: x, py: -h / 2 + 0.2 }); }
    for (let i = 0; i < abajo; i++) { const x = -w / 2 + (i + 0.5) * w / abajo; L.push({ x, y: h / 2 + 0.3, px: x, py: h / 2 - 0.2 }); }
  }
  return L;
}

/* La forma de la tapa de la mesa */
function tapaMesa(m, w, h, extra = 0) {
  const W = w + extra, H = h + extra;
  if (m.forma === 'redonda') return `<circle r="${W / 2}"`;
  if (m.forma === 'oval') return `<ellipse rx="${W / 2}" ry="${H / 2}"`;
  return `<rect x="${-W / 2}" y="${-H / 2}" width="${W}" height="${H}" rx="${m.forma === 'cuadrada' ? 0.06 : 0.08}"`;
}

/* Una silla vista desde arriba */
function silla(tipo, x, y, ang, persona) {
  const s = SILLAS.find(z => z.id === tipo) || SILLAS[0];
  let d = `<g transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${ang.toFixed(0)})">`;
  d += `<rect x="-.19" y="-.17" width=".38" height=".34" rx=".09" fill="${s.relleno}" stroke="${s.borde}" stroke-width=".035"/>`;
  if (tipo === 'crossback') d += `<path d="M-.13 .1 L.13 .1" stroke="${s.borde}" stroke-width=".05"/>`;
  else if (tipo === 'tiffany') d += `<path d="M-.15 .12 L.15 .12" stroke="${s.borde}" stroke-width=".05" stroke-linecap="round"/>`;
  else if (tipo === 'blanca') d += `<circle cx="0" cy=".13" r=".05" fill="${s.borde}"/>`;
  if (persona) d += `<circle r=".12" fill="${persona}" stroke="#fff" stroke-width=".03"/>`;
  return d + '</g>';
}

/* El centro de mesa */
function centroMesa(tipo, b, esc = 1) {
  const [c1, c2, c3] = Boda.paleta(b);
  const k = esc;
  if (tipo === 'bajo') return `<g transform="scale(${k})"><ellipse rx=".26" ry=".14" fill="#8FA67F" opacity=".7"/>
    <circle cx="-.12" cy="-.02" r=".1" fill="${c1}"/><circle cx=".1" cy="-.04" r=".09" fill="${c2}"/><circle cx="0" cy=".07" r=".085" fill="${c3}" stroke="${c2}" stroke-width=".015"/>
    <circle cx=".18" cy=".06" r=".06" fill="#fff"/><circle cx="-.2" cy=".07" r=".05" fill="${c2}"/></g>`;
  if (tipo === 'alto') return `<g transform="scale(${k})"><circle r=".34" fill="${c3}" opacity=".55"/>
    ${[0, 60, 120, 180, 240, 300].map(a => `<circle cx="${(Math.cos(a * Math.PI / 180) * .2).toFixed(2)}" cy="${(Math.sin(a * Math.PI / 180) * .2).toFixed(2)}" r=".11" fill="${a % 120 ? c1 : c2}"/>`).join('')}
    <circle r=".1" fill="#fff" stroke="${c2}" stroke-width=".02"/></g>`;
  if (tipo === 'velas') return `<g transform="scale(${k})">${[[-.16, 0], [0, -.05], [.16, .02]].map(([x, y]) =>
    `<circle cx="${x}" cy="${y}" r=".13" fill="#F6D27A" opacity=".28"/><circle cx="${x}" cy="${y}" r=".055" fill="#FFF4D6" stroke="#E2B65A" stroke-width=".02"/>`).join('')}</g>`;
  if (tipo === 'colgante') return `<g transform="scale(${k})"><circle r=".36" fill="none" stroke="${c2}" stroke-width=".03" stroke-dasharray=".06 .05"/>
    <circle r=".2" fill="none" stroke="#8FA67F" stroke-width=".05"/><circle r=".07" fill="${c1}"/></g>`;
  return '';
}

/* El camino de mesa */
function caminoMesa(tipo, m, w, h, b) {
  const [, c2] = Boda.paleta(b);
  const largo = m.forma === 'redonda' ? w * 0.92 : w * 0.96, ancho = m.forma === 'redonda' ? 0.3 : Math.min(0.36, h * 0.34);
  if (tipo === 'lino') return `<rect x="${-largo / 2}" y="${-ancho / 2}" width="${largo}" height="${ancho}" fill="#E8DCC4" opacity=".9"/>`;
  if (tipo === 'gasa') return `<rect x="${-largo / 2}" y="${-ancho / 2}" width="${largo}" height="${ancho}" fill="${c2}" opacity=".38"/>`;
  if (tipo === 'verde') {
    let s = '';
    const n = Math.max(6, Math.round(largo / 0.16));
    for (let i = 0; i < n; i++) {
      const x = -largo / 2 + (i + 0.5) * largo / n, y = (i % 2 ? 1 : -1) * 0.05;
      s += `<ellipse cx="${x.toFixed(2)}" cy="${y}" rx=".1" ry=".05" fill="${i % 3 ? '#7E9A6C' : '#A3B98F'}" transform="rotate(${i % 2 ? 30 : -30} ${x.toFixed(2)} ${y})"/>`;
    }
    return s;
  }
  return '';
}

/* ---------- Una mesa completa ---------- */
function dibujarMesa(m, b, colores, conGente = true, estatico = false) {
  const est = Object.assign({}, b.salon.estilo, m.estilo || {});
  const { w, h } = medidasMesa(m);
  const mantel = COLOR_MANTEL(est.mantel, b);
  const borde = mezclar(mantel === '#FFFFFF' ? '#E4D9C6' : mantel, '#000000', 0.2);
  const lug = lugaresMesa(m);
  /* Una persona por silla, con el color de su grupo */
  const personas = [];
  if (conGente && m.id) Store.listar('invitados', i => i.mesaId === m.id).forEach(i => {
    for (let k = 0; k < i.adultos + i.ninos; k++) personas.push(colores?.[i.grupo] || '#8E857A');
  });
  const occ = personas.length;
  const pasada = occ > m.cap;
  let s = `<g class="mesa-cuerpo" transform="rotate(${m.rot || 0})">`;
  lug.forEach((l, i) => { s += silla(est.silla, l.x, l.y, Math.atan2(l.y, l.x) * 180 / Math.PI + 90, personas[i]); });
  s += `${tapaMesa(m, w, h, 0.14)} fill="${mantel}" opacity=".45"/>`;
  s += `${tapaMesa(m, w, h)} class="mesa-top" fill="${mantel}" stroke="${pasada ? '#B5583F' : borde}" stroke-width="${pasada ? 0.1 : 0.035}"/>`;
  s += caminoMesa(est.camino, m, w, h, b);
  lug.forEach(l => { s += `<circle cx="${l.px.toFixed(2)}" cy="${l.py.toFixed(2)}" r=".12" fill="#fff" stroke="#D8D0C2" stroke-width=".02"/><circle cx="${l.px.toFixed(2)}" cy="${l.py.toFixed(2)}" r=".07" fill="none" stroke="#E6DFD2" stroke-width=".015"/>`; });
  if (m.forma === 'redonda' || m.forma === 'cuadrada' || m.forma === 'oval') s += centroMesa(est.centro, b, m.forma === 'oval' ? 1.1 : 1);
  else { const n = Math.max(1, Math.round(w / 1.6)); for (let i = 0; i < n; i++) s += `<g transform="translate(${(-w / 2 + (i + 0.5) * w / n).toFixed(2)} 0)">${centroMesa(est.centro, b, 0.8)}</g>`; }
  s += '</g>';
  /* Etiqueta (sin girar, siempre legible) */
  const r = Math.max(w, h) / 2;
  const ancho = Math.max(1.3, etiquetaCorta(m, b).length * 0.17 + 0.5);
  const ly = (m.forma === 'redonda' || m.forma === 'oval') ? h / 2 + 0.72 : Math.abs(Math.cos((m.rot || 0) * Math.PI / 180)) * (h / 2) + Math.abs(Math.sin((m.rot || 0) * Math.PI / 180)) * (w / 2) + 0.72;
  s += `<g class="mesa-et" transform="translate(0 ${ly.toFixed(2)})"><rect x="${-ancho / 2}" y="-.24" width="${ancho}" height=".48" rx=".24" fill="#fff" stroke="${pasada ? '#B5583F' : '#E4D9C6'}" stroke-width=".03"/>
    <text text-anchor="middle" y=".1" font-size=".27" font-family="Jost,sans-serif" fill="#2E2A26">${esc(etiquetaCorta(m, b))}${conGente && m.id ? ` · <tspan fill="${pasada ? '#B5583F' : occ === m.cap ? '#4F6B40' : '#8E857A'}">${occ}/${m.cap}</tspan>` : ''}</text></g>`;
  if (!estatico && _sel?.tipo === 'mesa' && _sel.id === m.id) s = `<circle r="${r + 0.75}" class="sel-aro" fill="none"/>` + s;
  return s;
}

/* ---------- Un elemento del salón ---------- */
function dibujarElemento(e, b, suelto = false) {
  const [c1, c2, c3, c4] = Boda.paleta(b);
  const { w, h } = e;
  const R = (fill, extra = '') => `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${Math.min(w, h) * 0.08}" fill="${fill}" ${extra}/>`;
  const fs = Math.max(0.24, Math.min(0.46, Math.min(w, h) * 0.32, w / Math.max(4, (e.nombre || '').length) * 1.6));
  const T = (col = '#2E2A26', y = 0, t = e.nombre) => t ? `<text text-anchor="middle" y="${(y + fs * 0.35).toFixed(2)}" font-size="${fs.toFixed(2)}" font-family="Jost,sans-serif" letter-spacing=".02" fill="${col}">${esc(t)}</text>` : '';
  let s = '';
  switch (e.tipo) {
    case 'pista':
      s = R(suelto ? c3 : 'url(#pat-parquet)', `stroke="${c2}" stroke-width=".06"`) + `<rect x="${-w / 2 + .25}" y="${-h / 2 + .25}" width="${w - .5}" height="${h - .5}" fill="none" stroke="${c2}" stroke-width=".03" stroke-dasharray=".2 .12" rx=".1"/>` + T(mezclar(c1, '#000', .25)); break;
    case 'escenario':
      s = R(c1) + `<rect x="${-w / 2 + .2}" y="${-h / 2 + .2}" width=".4" height=".4" rx=".05" fill="#00000040"/><rect x="${w / 2 - .6}" y="${-h / 2 + .2}" width=".4" height=".4" rx=".05" fill="#00000040"/>` + T('#fff'); break;
    case 'principal': {
      s = R(c4, `stroke="${c2}" stroke-width=".05"`);
      const n = Math.max(2, Math.floor(w / 0.62));
      for (let i = 0; i < n; i++) s += silla(b.salon.estilo.silla, -w / 2 + (i + .5) * w / n, -h / 2 - .3, 0, i === Math.floor(n / 2) - 1 || i === Math.floor(n / 2) ? c1 : null);
      s += `<rect x="${-w / 2 + .1}" y="-.09" width="${w - .2}" height=".18" fill="${c2}" opacity=".35"/>` + T(mezclar(c1, '#000', .2), .02); break;
    }
    case 'dulce':
      s = R(mezclar(c3, '#fff', .3), `stroke="${c2}" stroke-width=".04"`) + `<circle r="${Math.min(.32, h * .32)}" fill="#fff" stroke="${c2}" stroke-width=".03"/><circle r="${Math.min(.2, h * .2)}" fill="${c3}"/><circle r=".07" fill="${c1}"/>`
        + `<circle cx="${-w / 3}" r=".12" fill="${c2}" opacity=".6"/><circle cx="${w / 3}" r=".12" fill="${c2}" opacity=".6"/>`
        + (h > .8 ? T(mezclar(c1, '#000', .2), h / 2 + .32) : ''); break;
    case 'barra':
      s = R('#8B6B4A') + `<rect x="${-w / 2 + .12}" y="${-h / 2 + .12}" width="${w - .24}" height="${h * .35}" rx=".05" fill="#A88866"/>` + T('#fff', .12); break;
    case 'living':
      s = R(mezclar(c3, '#fff', .2), `stroke="${c2}" stroke-width=".03"`) + `<rect x="${-w / 2 + .15}" y="${-h / 2 + .15}" width="${w - .3}" height=".5" rx=".2" fill="${c2}" opacity=".55"/>`
        + `<rect x="${-w / 2 + .15}" y="${h / 2 - .65}" width="${w - .3}" height=".5" rx=".2" fill="${c2}" opacity=".55"/><circle r=".3" fill="#fff" stroke="${c2}" stroke-width=".03"/>` + T(mezclar(c1, '#000', .25), 0, ''); break;
    case 'cabina':
      s = R('#4A4540') + `<circle r="${Math.min(w, h) * .18}" fill="none" stroke="#fff" stroke-width=".05"/><circle r="${Math.min(w, h) * .07}" fill="#fff"/>` + T('#fff', Math.min(w, h) * .33); break;
    case 'regalos':
      s = R(c4, `stroke="${c2}" stroke-width=".04"`) + [-.5, 0, .5].map(x => `<rect x="${x * w / 2.6 - .12}" y="-.12" width=".24" height=".24" fill="${c1}" opacity=".8"/>`).join(''); break;
    case 'entrada':
      s = R(c1) + `<path d="M0 ${-h * 1.6} L-.35 ${-h * .9} L.35 ${-h * .9} Z" fill="${c1}"/>` + `<text text-anchor="middle" y="${(h * .85).toFixed(2)}" font-size=".34" font-family="Jost,sans-serif" letter-spacing=".08" fill="${c1}">ENTRADA</text>`; break;
    case 'banos': case 'cocina':
      s = R('#ECE8E2', `stroke="#BDB6AA" stroke-width=".04"`) + T('#5C554D'); break;
    case 'columna':
      s = R('#6B645C'); break;
    case 'arbol':
      s = `<circle r="${w / 2}" fill="#9DB58A" opacity=".75"/>` + [0, 72, 144, 216, 288].map(a => `<circle cx="${(Math.cos(a * Math.PI / 180) * w * .22).toFixed(2)}" cy="${(Math.sin(a * Math.PI / 180) * w * .22).toFixed(2)}" r="${w * .2}" fill="#7E9A6C" opacity=".8"/>`).join('')
        + `<circle r="${w * .08}" fill="#6B5B45"/>`; break;
    default: s = R(c3) + T();
  }
  return s;
}

/* ---------- El plano completo ---------- */
function dibujarSalon(b, estatico = false) {
  const s = b.salon, W = s.ancho, L = s.largo, M = 1.5;
  const [c1, c2, c3, c4] = Boda.paleta(b);
  const piso = mezclar(c4, '#FFFFFF', 0.35);
  const colores = coloresGrupos(b);
  let forma = '';
  const pared = 'stroke="#4E4842" stroke-width=".2" stroke-linejoin="round"';
  if (s.forma === 'L') {
    const d = `M0 0 H${W} V${L * .55} H${W * .6} V${L} H0 Z`;
    forma = `<path d="${d}" fill="${piso}"/><path d="${d}" fill="url(#pat-grilla)"/><path d="${d}" fill="none" ${pared}/>`;
  } else if (s.forma === 'galeria') {
    const g = Math.min(3, L * .18);
    forma = `<rect width="${W}" height="${L}" fill="${piso}"/><rect y="${L - g}" width="${W}" height="${g}" fill="${mezclar(c3, '#fff', .3)}"/>
      <rect y="${L - g}" width="${W}" height="${g}" fill="url(#pat-rayas)"/><rect width="${W}" height="${L}" fill="url(#pat-grilla)"/>
      <path d="M0 ${L - g} H${W}" stroke="#4E4842" stroke-width=".08" stroke-dasharray=".5 .3"/>
      <rect width="${W}" height="${L}" fill="none" ${pared}/>
      <text x="${W - .4}" y="${L - .35}" text-anchor="end" font-size=".55" font-style="italic" font-family="Cormorant Garamond,serif" fill="#8E857A">Galería</text>`;
  } else if (s.forma === 'jardin') {
    const j = L * .38;
    forma = `<rect y="${L - j}" width="${W}" height="${j}" fill="#E3ECDB"/><rect y="${L - j}" width="${W}" height="${j}" fill="url(#pat-pasto)"/>
      <rect width="${W}" height="${L - j}" fill="${piso}"/><rect width="${W}" height="${L - j}" fill="url(#pat-grilla)"/>
      <rect width="${W}" height="${L - j}" fill="none" ${pared}/>
      <rect y="${L - j}" width="${W}" height="${j}" fill="none" stroke="#9DB58A" stroke-width=".08" stroke-dasharray=".4 .25"/>
      <text x="${W - .4}" y="${L - .4}" text-anchor="end" font-size=".6" font-style="italic" font-family="Cormorant Garamond,serif" fill="#6F8B5E">Jardín</text>`;
  } else {
    forma = `<rect width="${W}" height="${L}" fill="${piso}"/><rect width="${W}" height="${L}" fill="url(#pat-grilla)"/><rect width="${W}" height="${L}" fill="none" ${pared}/>`;
  }
  /* Reglas en metros */
  let reglas = '';
  for (let x = 0; x <= W; x += 2) reglas += `<text x="${x}" y="${-.55}" text-anchor="middle" font-size=".36" fill="#A39A8E" font-family="Jost,sans-serif">${x}</text><path d="M${x} -.3 V-.12" stroke="#C9C0B2" stroke-width=".04"/>`;
  for (let y = 0; y <= L; y += 2) reglas += `<text x="${-.5}" y="${y + .12}" text-anchor="end" font-size=".36" fill="#A39A8E" font-family="Jost,sans-serif">${y}</text><path d="M-.3 ${y} H-.12" stroke="#C9C0B2" stroke-width=".04"/>`;
  reglas += `<text x="${W + .35}" y="${-.55}" font-size=".36" fill="#A39A8E" font-family="Jost,sans-serif">m</text>`;

  const elems = ordenar(Store.deBoda('elementos', b.id), e => e.tipo === 'pista' ? 0 : e.tipo === 'arbol' ? 2 : 1);
  const mesas = Store.deBoda('mesas', b.id);
  const cls = estatico ? '' : 'arrastrable';
  const contenido =
    elems.map(e => `<g class="${cls} obj-elem ${!estatico && _sel?.id === e.id ? 'sel' : ''}" data-obj="elem:${e.id}" transform="translate(${e.x} ${e.y})">
      <g transform="rotate(${e.rot || 0})">${!estatico && _sel?.id === e.id ? `<rect x="${-e.w / 2 - .2}" y="${-e.h / 2 - .2}" width="${e.w + .4}" height="${e.h + .4}" rx=".15" class="sel-aro" fill="none"/>` : ''}
      ${dibujarElemento(e, b)}</g></g>`).join('') +
    mesas.map(m => `<g class="${cls} obj-mesa" data-obj="mesa:${m.id}" transform="translate(${m.x} ${m.y})">${dibujarMesa(m, b, colores, true, estatico)}</g>`).join('');

  return `<svg id="${estatico ? 'sl-svg-imp' : 'sl-svg'}" class="salon-svg" viewBox="${-M} ${-M} ${W + 2 * M} ${L + 2 * M}" style="width:${estatico ? 100 : _zoom * 100}%" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="pat-grilla" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0 H0 V1" fill="none" stroke="#2E2A26" stroke-opacity=".06" stroke-width=".03"/></pattern>
      <pattern id="pat-parquet" width="1" height="1" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="${mezclar(c3, '#fff', .15)}"/>
        <rect width=".5" height=".5" fill="${mezclar(c3, c2, .25)}" opacity=".55"/><rect x=".5" y=".5" width=".5" height=".5" fill="${mezclar(c3, c2, .25)}" opacity=".55"/></pattern>
      <pattern id="pat-rayas" width=".5" height=".5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V.5" stroke="${c2}" stroke-opacity=".25" stroke-width=".05"/></pattern>
      <pattern id="pat-pasto" width=".8" height=".8" patternUnits="userSpaceOnUse"><circle cx=".2" cy=".2" r=".04" fill="#9DB58A"/><circle cx=".6" cy=".55" r=".035" fill="#8FA67F"/></pattern>
    </defs>
    ${forma}${reglas}${contenido}
    <g transform="translate(0 ${L + .9})"><path d="M0 0 H2" stroke="#8E857A" stroke-width=".06"/><path d="M0 -.15 V.15 M1 -.1 V.1 M2 -.15 V.15" stroke="#8E857A" stroke-width=".05"/>
      <text x="2.3" y=".14" font-size=".36" fill="#8E857A" font-family="Jost,sans-serif">2 metros</text></g>
  </svg>`;
}

/* ---------- Una mesa sola (vistas previas) ---------- */
function svgMesaSola(m, b, tam = 140, sinGente = false) {
  const { w, h } = medidasMesa(m);
  const r = Math.max(w, h) / 2 + 0.6;
  const mm = Object.assign({ rot: 0, num: m.num || 1 }, m);
  const cuerpo = dibujarMesa(mm, b, coloresGrupos(b), !sinGente, true).replace(/<g class="mesa-et"[\s\S]*<\/g>$/, '');
  return `<svg class="mesa-sola" width="${tam}" height="${tam * (h + 1.3) / (Math.max(w, h) + 1.3)}" viewBox="${-r} ${-(h / 2 + .65)} ${2 * r} ${h + 1.3}">${cuerpo}</svg>`;
}


/* ===== js/26-boda-tareas.js ===== */
/* ============================================================
   BODA · TAREAS
   La lista de tareas por etapas (12 meses antes → el día), con
   responsable (Vanessa o los novios) y fecha. Cada boda nueva arranca
   con la lista modelo de 01-config.js.
   ============================================================ */

let _tarFiltro = 'todas';

PANTALLAS['b-tareas'] = {
  t: 'Tareas',
  pintar(hoja) {
    const b = bodaAbierta();
    const todas = Store.deBoda('tareas', b.id);
    let lista = todas;
    if (_tarFiltro === 'pendientes') lista = lista.filter(t => !t.hecho);
    if (_tarFiltro === 'Vanessa' || _tarFiltro === 'Novios') lista = lista.filter(t => t.resp === _tarFiltro);
    const hechas = todas.filter(t => t.hecho).length;
    const atrasadas = todas.filter(t => !t.hecho && t.fecha && diasHasta(t.fecha) < 0);
    const etapas = [...ETAPAS_TAREA, ...unicos(todas.map(t => t.etapa)).filter(e => !ETAPAS_TAREA.includes(e))];

    hoja.innerHTML = encabezado('Tareas', `${hechas} de ${todas.length} hechas${atrasadas.length ? ` · <span class="mal-t">${atrasadas.length} atrasada${atrasadas.length > 1 ? 's' : ''}</span>` : ''}`,
      `<button class="btn p" id="ta-nueva">＋ Tarea</button>`) + `
      <div class="ta-progreso">${barra(pct(hechas, todas.length))}<b>${pct(hechas, todas.length)} %</b></div>
      <div class="filtros"><div class="solapas" id="ta-f">${[['todas', 'Todas'], ['pendientes', 'Pendientes'], ['Vanessa', 'De Vanessa'], ['Novios', 'De los novios']]
        .map(([v, t]) => `<button data-f="${v}" class="${_tarFiltro === v ? 'on' : ''}">${t}</button>`).join('')}</div></div>
      <div class="etapas">${etapas.map(et => {
        const l = ordenar(lista.filter(t => t.etapa === et), t => (t.hecho ? '1' : '0') + (t.fecha || ''));
        const tot = todas.filter(t => t.etapa === et), h = tot.filter(t => t.hecho).length;
        if (!tot.length) return '';
        return `<section class="etapa ${h === tot.length ? 'completa' : ''}">
          <header><span class="et-punto">${h === tot.length ? '✓' : ''}</span><div><b>${esc(et)}</b><small>${h}/${tot.length}</small></div></header>
          ${l.map(t => {
            const d = t.fecha ? diasHasta(t.fecha) : null;
            return `<div class="tarea ${t.hecho ? 'hecha' : ''} ${!t.hecho && d !== null && d < 0 ? 'atrasada' : ''}" data-t="${t.id}">
              <button class="ta-check" data-check="${t.id}" aria-label="Marcar">${t.hecho ? '✓' : ''}</button>
              <div class="ta-t"><b>${esc(t.texto)}</b><small><span class="ta-resp ${t.resp === 'Novios' ? 'nov' : ''}">${t.resp === 'Novios' ? esc(b.novia + ' y ' + b.novio) : 'Vanessa'}</span>
                ${t.fecha ? ` · ${t.hecho ? fechaDia(t.fecha) : d < 0 ? `atrasada ${-d} días` : conMayuscula(enPalabras(t.fecha))}` : ''}</small></div></div>`;
          }).join('') || '<p class="suave chico" style="padding:6px 10px">Nada con este filtro.</p>'}
        </section>`;
      }).join('')}</div>`;

    $$('#ta-f button', hoja).forEach(x => x.onclick = () => { _tarFiltro = x.dataset.f; repintar(); });
    $$('[data-check]', hoja).forEach(x => x.onclick = e => {
      e.stopPropagation();
      const t = Store.obtener('tareas', x.dataset.check);
      Store.editar('tareas', t.id, { hecho: !t.hecho });
      if (!t.hecho) aviso('¡Hecho! ✓');
      repintar();
    });
    $$('[data-t]', hoja).forEach(x => x.onclick = () => editarTarea(Store.obtener('tareas', x.dataset.t), b));
    $('#ta-nueva', hoja).onclick = () => editarTarea(null, b);
  },

function editarTarea(t, b) {
  const nueva = !t;
  t = t || { etapa: '1 mes antes', texto: '', resp: 'Vanessa', fecha: sumarDias(iso(HOY()), 7), hecho: false };
  const campos = [
    { n: 'texto', e: 'Tarea', valor: t.texto, req: true, ancho: 'ancho' },
    { n: 'etapa', e: 'Etapa', tipo: 'select', ops: ETAPAS_TAREA, valor: t.etapa },
    { n: 'resp', e: 'Responsable', tipo: 'select', ops: [{ v: 'Vanessa', t: 'Vanessa' }, { v: 'Novios', t: 'Los novios' }], valor: t.resp },
    { n: 'fecha', e: 'Para cuándo', tipo: 'date', valor: t.fecha },
    { n: 'hecho', e: 'Ya está hecha', tipo: 'checkbox', valor: t.hecho },

  modal({
    titulo: nueva ? 'Nueva tarea' : 'Editar tarea',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>`,
    acciones: [

        if (!v.texto) return false;
        nueva ? Store.crear('tareas', Object.assign({ bodaId: b.id }, v)) : Store.editar('tareas', t.id, v);
        repintar();
      } },

  });
}

/* Las horas de la madrugada van después de las de la noche */

  t: 'Cronograma del día',
  pintar(hoja) {
    const b = bodaAbierta();
    const mom = ordenar(Store.deBoda('momentos', b.id), m => ordenHora(m.hora));
    const llegadas = Store.deBoda('bprov', b.id).filter(x => x.llegada).map(x => ({ h: x.llegada, p: Store.obtener('proveedores', x.provId) })).filter(x => x.p);
    const equipo = Store.listar('asignaciones', a => a.bodaId === b.id).map(a => Store.obtener('equipo', a.personaId)).filter(Boolean);

    hoja.innerHTML = encabezado('Cronograma del día', `${conMayuscula(fechaLarga(b.fecha))} · ${esc(b.lugar)}`,
      `${!vistaNovios() ? '<button class="btn" id="cr-pdf">⎙ Hoja del día (PDF)</button>' : ''}<button class="btn p" id="cr-nuevo">＋ Momento</button>`) + `
    <div class="cols c21">
      <div class="crono">${mom.map((m, i) => {
        const sig = mom[i + 1];
        const llegan = llegadas.filter(l => ordenHora(l.h) >= ordenHora(m.hora) && (!sig || ordenHora(l.h) < ordenHora(sig.hora)));
        return `<div class="cr-mom" data-m="${m.id}">
          <div class="cr-hora">${esc(m.hora)}</div>
          <div class="cr-punto"></div>
          <div class="cr-cuerpo"><b>${esc(m.titulo)}</b>${m.detalle ? `<p>${esc(m.detalle)}</p>` : ''}
            <div class="cr-pie">${m.resp ? `<span class="chip">👤 ${esc(m.resp)}</span>` : ''}
              ${llegan.map(l => `<span class="chip cr-llega">${iconoRubro(l.p.rubro)} Llega ${esc(l.p.nombre)} · ${esc(l.h)}</span>`).join('')}</div></div>
        </div>`;
      }).join('') || vacio('◷', 'Todavía no hay momentos', 'Empezá por la ceremonia.')}</div>
      <div>
        ${tarjeta('Llegada de proveedores', llegadas.length ? `<div class="renglones">${ordenar(llegadas, l => ordenHora(l.h)).map(l => `
          <div class="renglon"><b class="cr-h">${esc(l.h)}</b><div class="r-t"><b>${esc(l.p.nombre)}</b><small>${esc(l.p.rubro)} · ${esc(l.p.contacto || '')}</small></div></div>`).join('')}</div>`
          : vacio('✦', 'Sin horarios', 'Cargalos en Proveedores.'))}
        ${!vistaNovios() ? `<div style="height:18px"></div>${tarjeta('Equipo de Vanessa ese día', equipo.length ? `<div class="renglones">${equipo.map(p => `
          <div class="renglon"><span class="avatar" style="background:${p.color}">${iniciales(p.nombre)}</span><div class="r-t"><b>${esc(p.nombre)}</b><small>${esc(p.rol)}</small></div></div>`).join('')}</div>`
          : vacio('✿', 'Nadie asignado', 'Se asigna desde Equipo.'))}` : ''}
      </div>
    </div>`;

    $('#cr-nuevo', hoja).onclick = () => editarMomento(null, b);
    $('#cr-pdf', hoja)?.addEventListener('click', () => imprimirHojaDelDia(b));
    $$('[data-m]', hoja).forEach(x => x.onclick = () => editarMomento(Store.obtener('momentos', x.dataset.m), b));
  },
};

function editarMomento(m, b) {

/* ===== js/28-boda-inspiracion.js ===== */
/* ============================================================
   BODA · INSPIRACIÓN
   Un tablero tipo Pinterest, por carpetas (ceremonia, mesas, flores…).
   ⚠ NO SE SUBE NINGUNA IMAGEN: se guarda solo el LINK (unas pocas
   letras). La vista previa se ve directo desde donde está publicada:
     · link directo a una foto      → se ve la foto
     · pin de Pinterest              → la vista oficial de Pinterest
     · publicación de Instagram      → la vista oficial de Instagram
       (solo cuentas públicas: es una regla de Instagram)
     · video de YouTube              → la miniatura del video
     · cualquier otro link           → tarjeta con el ícono del sitio
   Si la publicación se borra, la tarjeta no se rompe: queda el link.
   ============================================================ */

let _carpeta = '';

/* ¿Qué clase de link es? */
function tipoLink(url) {
  let u;
  try { u = new URL(url); } catch (e) { return { tipo: 'malo' }; }
  const host = u.hostname.replace(/^www\./, '');
  if (/\.(jpe?g|png|webp|gif|avif)$/i.test(u.pathname) || host === 'images.unsplash.com' || host === 'i.pinimg.com' || host.endsWith('.cdninstagram.com'))
    return { tipo: 'foto', src: url, host };
  const pin = u.pathname.match(/\/pin\/(\d+)/);
  if (host.endsWith('pinterest.com') && pin) return { tipo: 'pinterest', id: pin[1], host };
  const ig = u.pathname.match(/\/(p|reel)\/([\w-]+)/);
  if (host.endsWith('instagram.com') && ig) return { tipo: 'instagram', id: ig[2], clase: ig[1], host };
  const yt = host === 'youtu.be' ? u.pathname.slice(1) : (host.endsWith('youtube.com') ? u.searchParams.get('v') : null);
  if (yt) return { tipo: 'youtube', id: yt, host };
  return { tipo: 'web', host };
}

/* La vista previa de un link (sin descargar ni guardar nada) */
function vistaLink(url, titulo = '') {
  const t = tipoLink(url);
  const tarjetaWeb = `<a class="ins-web" href="${esc(url)}" target="_blank" rel="noopener">
    <img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(t.host || '')}&sz=64" alt="" loading="lazy">
    <b>${esc(titulo || t.host || 'Link')}</b><small>${esc(t.host || url)}</small><span>Abrir ↗</span></a>`;
  if (t.tipo === 'foto') return `<a class="ins-foto" href="${esc(url)}" target="_blank" rel="noopener">
    <img src="${esc(t.src)}" alt="${esc(titulo)}" loading="lazy" referrerpolicy="no-referrer"
      onerror="this.parentNode.outerHTML=this.parentNode.dataset.plan" ></a>`.replace('class="ins-foto"', `class="ins-foto" data-plan="${esc(tarjetaWeb)}"`);
  if (t.tipo === 'pinterest') return `<iframe class="ins-emb pin" src="https://assets.pinterest.com/ext/embed.html?id=${t.id}" loading="lazy" title="Pinterest" frameborder="0" scrolling="no"></iframe>`;
  if (t.tipo === 'instagram') return `<iframe class="ins-emb ig" src="https://www.instagram.com/${t.clase}/${t.id}/embed" loading="lazy" title="Instagram" frameborder="0" scrolling="no"></iframe>`;
  if (t.tipo === 'youtube') return `<a class="ins-foto yt" href="${esc(url)}" target="_blank" rel="noopener"><img src="https://img.youtube.com/vi/${esc(t.id)}/hqdefault.jpg" alt="" loading="lazy"><span class="yt-play">▶</span></a>`;
  if (t.tipo === 'malo') return `<div class="ins-web"><b>Link no válido</b><small>${esc(url)}</small></div>`;
  return tarjetaWeb;
}

function editarIdea(i, b) {
  const nueva = !i;
  i = i || { url: '', titulo: '', carpeta: _carpeta || 'General', nota: '' };
  const carpetas = unicos(['Ceremonia', 'Mesas', 'Flores', 'Vestido', 'Mesa dulce', 'Luces', 'Música', ...Store.deBoda('ideas', b.id).map(x => x.carpeta)]);
  const campos = [
    { n: 'url', e: 'Link (Pinterest, Instagram, una foto, una página…)', valor: i.url, req: true, ancho: 'ancho', ph: 'https://…' },
    { n: 'titulo', e: 'Título', valor: i.titulo },
    { n: 'carpeta', e: 'Carpeta', tipo: 'sugerido', ops: carpetas, valor: i.carpeta },
    { n: 'nota', e: 'Nota', valor: i.nota, ancho: 'ancho' },
  ];
  const m = modal({
    titulo: nueva ? 'Nueva idea' : 'Editar idea', ancho: 'ancho',
    cuerpo: `<div class="ins-form"><div class="rejilla">${formulario(campos)}</div><div class="ins-prev" id="ins-prev"></div></div>`,
    acciones: [
      ...(!nueva ? [{ texto: 'Borrar', clase: 's peligro', hacer: () => { Store.borrar('ideas', i.id); repintar(); } }] : []),
      { texto: 'Cancelar', clase: 's' },
      { texto: 'Guardar', clase: 'p', hacer: f => {
        const v = leerFormulario(campos, f);
        if (tipoLink(v.url).tipo === 'malo') { aviso('Ese link no es válido', 'mal'); return false; }
        v.carpeta = v.carpeta || 'General';
        nueva ? Store.crear('ideas', Object.assign({ bodaId: b.id }, v)) : Store.editar('ideas', i.id, v);
        _carpeta = v.carpeta; repintar();
      } },
    ],
  });
  const prev = () => {
    const url = $('#f-url', m.fondo).value.trim();
    const t = url ? tipoLink(url) : null;
    const nombres = { foto: 'Foto: se ve directo desde el link', pinterest: 'Pin de Pinterest', instagram: 'Publicación de Instagram', youtube: 'Video de YouTube', web: 'Página web: se muestra como tarjeta', malo: 'Todavía no es un link válido' };
    $('#ins-prev', m.fondo).innerHTML = url ? `<small class="ins-tipo">${nombres[t.tipo]}</small>${vistaLink(url, $('#f-titulo', m.fondo).value)}` : '<div class="vacio">La vista previa aparece acá</div>';
  };
  $('#f-url', m.fondo).addEventListener('input', prev);
  prev();
}

/* ===== js/30-impresos.js ===== */
/* ============================================================
   LO QUE SE GUARDA EN PDF (o se imprime)
   Se arma en #impreso y se abre la ventana de impresión del
   navegador: ahí se elige «Guardar como PDF».
   · imprimirPresupuesto()     → la carta con las opciones para una pareja
                                  (con el formato que usa Vanessa, mejorado)
   · imprimirCatalogo()        → todos sus servicios
   · imprimirPresupuestoBoda() → el presupuesto de una boda
   · imprimirPlano()           → el plano del salón (apaisado)
   · imprimirCartel()          → «Encontrá tu mesa» para la entrada
   · imprimirListado()         → confirmados con su número de mesa
   · imprimirHojaDelDia()      → cronograma, proveedores y equipo
   Las hojas fijas usan .pg (A4 exacta). La carta del presupuesto
   «corre» sola de una hoja a la otra (.carta), sin cortar una opción.
   ============================================================ */

function imprimir(html, titulo, apaisado = false, corrido = false) {
  const tituloViejo = document.title;
  document.title = titulo;
  let estilo = $('#pagina-imp');
  if (!estilo) { estilo = document.createElement('style'); estilo.id = 'pagina-imp'; document.head.appendChild(estilo); }
  estilo.textContent = `@page{size:A4 ${apaisado ? 'landscape' : 'portrait'};margin:${corrido ? '15mm 0 8mm' : '0'}}`;
  /* «Desarrollado por Wydan» con su logo, en TODAS las hojas de todos los PDF:
     en las hojas fijas va al pie de cada una; en la carta que corre, un pie fijo que se repite en cada hoja. */
  const marca = `<div class="imp-wydan"><span>Desarrollado por</span><img src="${LOGO_WYDAN}" alt="Wydan Solutions"></div>`;
  /* En la carta que corre, el pie va en el <tfoot> de una tabla: el navegador lo repite al pie de cada hoja
     y le guarda su lugar (con position:fixed se iba arriba de la hoja 2). */
  $('#impreso').innerHTML = corrido
    ? `<table class="imp-corrido"><tfoot><tr><td>${marca}</td></tr></tfoot><tbody><tr><td>${html}</td></tr></tbody></table>`
    : html;
  if (!corrido) $$('#impreso .pg').forEach(pg => pg.insertAdjacentHTML('beforeend', marca));
  $('#impreso').classList.toggle('apaisado', apaisado);
  $('#impreso').classList.toggle('corrido', corrido);
  aviso('En la ventana que se abre, elegí «Guardar como PDF»');
  const listo = document.fonts?.ready || Promise.resolve();
  listo.then(() => setTimeout(() => {
    window.print();
    document.title = tituloViejo;
  }, 350));
}

/* Adornos comunes */
const ramaEsquina = (color = '#B79653', rot = 0) => `<svg class="imp-rama" viewBox="150 100 260 300" style="transform:rotate(${rot}deg)">${ramaSVG(200, 380, 250, 250, 380, 130, 8, 30, 1)}</svg>`;
const pieImp = (n, total) => { const c = Store.cfg(); return `<div class="imp-pie"><span>${esc(c.firma)}</span><span>${esc(c.instagram)} · ${esc(c.telefono)}</span>${total ? `<span>${n} / ${total}</span>` : ''}</div>`; };

/* «Laura & Ignacio» → «Laura e Ignacio» (y delante de i / hi se dice «e») */
function parejaCarta(pareja) {
  const [a, b] = String(pareja).split('&').map(s => s.trim());
  if (!b) return a;
  return `${a} ${/^h?i(?![aeou])/i.test(sinTildes(b)) ? 'e' : 'y'} ${b}`;
}

/* Una opción (un servicio) tal como sale en la carta.
   «texto» = el texto propio de esa opción para esa pareja (si Vanessa lo cambió). */
function opcionCarta(pl, precio, n, recomendada, texto) {
  return `<section class="op ${recomendada ? 'rec' : ''}">
    <header><div><small>Opción ${n}</small><h3>${esc(pl.nombre)}</h3></div>
      <div class="op-precio"><small>Valor</small><b>${pesos(precio)}</b></div></header>
    ${recomendada ? '<span class="op-cinta">♡ Nuestra recomendación para ustedes</span>' : ''}
    <p class="op-texto">${esc(texto || pl.descripcion || pl.sub || '')}</p>
    ${(pl.incluye || []).length ? `<ul class="op-incluye">${pl.incluye.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${pl.alcance ? `<p class="op-alcance"><b>Tengan en cuenta</b>${esc(pl.alcance)}</p>` : ''}
    <footer><span>👥 ${pl.personas || 1} ${pl.personas === 1 ? 'persona' : 'personas'} el día del evento</span></footer>
  </section>`;
}

/* Textos libres que Vanessa agrega a una carta (título + texto) */
const seccionesCarta = l => (l || []).filter(s => s.titulo || s.texto).map(s => `<section class="carta-bloque">
  ${s.titulo ? `<h4>${esc(s.titulo)}</h4>` : ''}<p class="carta-libre">${esc(s.texto)}</p></section>`).join('');

/* La cabecera de la carta: logo, lugar y fecha */

/* ---------- La carta del presupuesto para una pareja ---------- */
function imprimirPresupuesto(p) {
  const c = Store.cfg();
  const opciones = (p.opciones || []).map(o => ({ o, pl: Store.obtener('planes', o.planId) })).filter(z => z.pl)
    .sort((a, b) => (b.o.planId === p.recomendada) - (a.o.planId === p.recomendada));
  const emin = suma(p.estimacion || [], l => l.min), emax = suma(p.estimacion || [], l => l.max);
  const intro = plantilla(p.intro ?? c.intro, {
    novios: parejaCarta(p.pareja),
    fecha: p.fechaBoda ? fechaLarga(p.fechaBoda) : 'fecha a definir',
    invitados: invitadosTexto(p),
  });
  const html = `<div class="carta">
    ${cabezaCarta(p.fecha)}
    <div class="carta-sres">Sres. ${esc(parejaCarta(p.pareja))}</div>
    <p class="carta-intro">${esc(intro)}</p>
    ${p.nota ? `<p class="carta-nota">“${esc(p.nota)}”</p>` : ''}
    <div class="carta-datos"><div><small>Fecha</small><b>${p.fechaBoda ? conMayuscula(fechaMedia(p.fechaBoda)) : 'A definir'}</b></div>
      <div><small>Invitados</small><b>${invitadosTexto(p)}</b></div><div><small>Lugar</small><b>${esc(p.lugar || 'A definir')}</b></div>
      <div><small>${opciones.length === 1 ? 'Propuesta' : 'Opciones'}</small><b>${opciones.length}</b></div></div>
    ${opciones.map((z, i) => opcionCarta(z.pl, z.o.precio, i + 1, z.o.planId === p.recomendada, z.o.texto)).join('')}
    ${(p.extras || []).length ? `<section class="carta-bloque"><h4>Para sumar, si quieren</h4>
      <div class="imp-extras">${p.extras.map(x => `<span>${esc(x.t)} <b>${pesos(x.monto)}</b></span>`).join('')}</div></section>` : ''}
    ${p.estimacion?.length ? `<section class="carta-bloque"><h4>Una idea de lo que cuesta su boda</h4>
      <table class="imp-t chica"><thead><tr><th>Rubro</th><th>Proveedor sugerido</th><th class="n">Aproximado</th></tr></thead><tbody>
      ${p.estimacion.map(l => `<tr><td>${iconoRubro(l.rubro)} ${esc(l.rubro)}</td><td>${esc(Store.obtener('proveedores', l.provId)?.nombre || '—')}</td><td class="n">${dolares(l.min)} – ${dolares(l.max)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td colspan="2">Total aproximado de proveedores</td><td class="n">${dolares(emin)} – ${dolares(emax)}</td></tr></tfoot></table></section>` : ''}
    ${seccionesCarta(p.secciones)}
    ${(p.formaPago ?? Sena.texto()).trim() ? `<section class="carta-pago"><h4>Forma de pago</h4><p class="carta-libre">${esc(p.formaPago ?? Sena.texto())}</p></section>` : ''}
    <p class="imp-cond">${esc(c.condiciones)} Este presupuesto es válido por ${c.validez} días.</p>
    ${firmaCarta()}
  </div>`;
  imprimir(html, `Presupuesto ${p.pareja} · Vanessa Camargo`, false, true);
}

/* ---------- Todos sus servicios (para mandar a quien consulta) ---------- */

/* ---------- Cabecera con la paleta de una boda ---------- */
function cabBoda(b, titulo) {
  const [c1, c2, c3, c4] = Boda.paleta(b);
  return `<div class="imp-boda" style="--c1:${c1};--c2:${c2};--c3:${c3};--c4:${c4}">
    <div><small>${esc(titulo)}</small><b class="script">${esc(b.novia)} &amp; ${esc(b.novio)}</b><span>${conMayuscula(fechaLarga(b.fecha))} · ${esc(b.lugar)}</span></div>
    ${LOGO_VC.mini(70)}</div>`;
}

function imprimirPresupuestoBoda(b) {
  const cu = Boda.cuentas(b.id);
  const html = `<section class="pg">${cabBoda(b, 'Presupuesto de la boda')}
    <div class="imp-nums"><div><small>Total</small><b>${pesos(cu.total)}</b></div><div><small>Pagado</small><b>${pesos(cu.pagado)}</b></div><div><small>Falta pagar</small><b>${pesos(cu.falta)}</b></div></div>
    <table class="imp-t chica"><thead><tr><th>Ítem</th><th class="n">Real</th><th class="n">Pagado</th><th class="n">Falta</th><th>Vence</th><th>Paga</th></tr></thead><tbody>
    ${cu.items.map(i => { const r = i.real || i.estimado; return `<tr><td><b>${esc(nombreItem(i))}</b><small>${esc(i.rubro)}</small></td><td class="n">${plata(r, i.moneda)}</td><td class="n">${plata(i.pagado || 0, i.moneda)}</td>
      <td class="n">${r - (i.pagado || 0) > 0 ? plata(r - (i.pagado || 0), i.moneda) : '✓'}</td><td>${i.vence ? fecha(i.vence) : '—'}</td><td>${esc(i.paga || 'Novios')}</td></tr>`; }).join('')}
    </tbody></table>
    <p class="imp-cond">Totales en pesos, con el dólar a ${pesos(Store.cfg().tipoCambio)}.</p>
    ${pieImp()}</section>`;
  imprimir(html, `Presupuesto ${Boda.pareja(b)}`);
}

function imprimirPlano(b) {
  const mesas = ordenar(Store.deBoda('mesas', b.id), m => m.num);
  const html = `<section class="pg apaisada">${cabBoda(b, 'Plano del salón')}
    <div class="imp-plano">${dibujarSalon(b, true)}</div>
    ${pieImp()}</section>
  <section class="pg apaisada">${cabBoda(b, 'Mesa por mesa')}
    <div class="imp-mesas">${mesas.map(m => `<div class="im"><b>${esc(etiquetaMesa(m, b))}</b><small>${ocupados(m)} de ${m.cap}</small>
      <ul>${Store.listar('invitados', i => i.mesaId === m.id).map(i => `<li>${esc(i.nombre)} <i>${i.adultos + i.ninos}</i>${i.restr?.length ? ` <em>${esc(i.restr.join(', '))}</em>` : ''}</li>`).join('')}</ul></div>`).join('')}</div>
    ${pieImp()}</section>`;
  imprimir(html, `Plano ${Boda.pareja(b)}`, true);

function imprimirCartel(b) {
  const [c1, c2, c3, c4] = Boda.paleta(b);
  const apellido = n => n.replace(/^Familia /, '').split(' ').slice(-1)[0];
  const inv = Store.deBoda('invitados', b.id).filter(i => i.mesaId && i.estado !== 'No viene')
    .sort((x, y) => apellido(x.nombre).localeCompare(apellido(y.nombre), 'es') || x.nombre.localeCompare(y.nombre, 'es'));
  /* Hasta 84 nombres por hoja (3 columnas de 28); si son más, sigue en otra hoja con el mismo diseño */
  const POR_HOJA = 84;
  const hojas = [];
  for (let i = 0; i < inv.length; i += POR_HOJA) hojas.push(inv.slice(i, i + POR_HOJA));
  const html = (hojas.length ? hojas : [[]]).map((l, n) => `<section class="pg cartel" style="--c1:${c1};--c2:${c2};--c3:${c3};--c4:${c4}">
    <div class="ca-marco"></div>
    <div class="ca-cab"><small>Bienvenidos a la boda de</small><b class="script">${esc(b.novia)} &amp; ${esc(b.novio)}</b>
      <div class="pt-adorno"><i></i>♡<i></i></div><h2>Encontrá tu mesa${hojas.length > 1 ? ` <small>· ${apellido(l[0].nombre)[0]} a ${apellido(l[l.length - 1].nombre)[0]}</small>` : ''}</h2></div>
    <div class="ca-lista">${l.map(i => `<div><span>${esc(i.nombre)}</span><i></i><b>Mesa ${Store.obtener('mesas', i.mesaId).num}</b></div>`).join('')}</div>
    <div class="ca-pie">${conMayuscula(fechaMedia(b.fecha))} · ${esc(b.lugar)}</div></section>`).join('');
  imprimir(html, `Cartel de ubicación ${Boda.pareja(b)}`);
}

function imprimirHojaDelDia(b) {
  const mom = ordenar(Store.deBoda('momentos', b.id), m => ordenHora(m.hora));
  const prov = ordenar(Store.deBoda('bprov', b.id).map(x => ({ x, p: Store.obtener('proveedores', x.provId) })).filter(z => z.p), z => ordenHora(z.x.llegada || '23:59'));
  const eq = Store.listar('asignaciones', a => a.bodaId === b.id).map(a => ({ a, p: Store.obtener('equipo', a.personaId) })).filter(z => z.p);
  const per = Boda.personas(b.id);
  const restr = {};
  per.restricciones.forEach(i => i.restr.forEach(r => { restr[r] = (restr[r] || 0) + i.adultos + i.ninos; }));
  const html = `<section class="pg">${cabBoda(b, 'Hoja del día')}
    <div class="imp-nums"><div><small>Invitados</small><b>${per.total}</b></div><div><small>Adultos / niños</small><b>${per.adultos} / ${per.ninos}</b></div>
      <div><small>Ceremonia</small><b>${esc(b.hora)} h</b></div><div><small>Menús especiales</small><b>${Object.entries(restr).map(([r, n]) => `${n} ${r.toLowerCase()}`).join(' · ') || '—'}</b></div></div>
    <div class="hd-cols">
      <div><h4 class="imp-h4">Cronograma</h4><div class="hd-crono">${mom.map(m => `<div><b>${esc(m.hora)}</b><span><strong>${esc(m.titulo)}</strong>${m.detalle ? `<small>${esc(m.detalle)}</small>` : ''}${m.resp ? `<em>${esc(m.resp)}</em>` : ''}</span></div>`).join('')}</div></div>
      <div><h4 class="imp-h4">Proveedores</h4><table class="imp-t chica"><tbody>${prov.map(({ x, p }) => `<tr><td><b>${esc(p.nombre)}</b><small>${esc(p.rubro)} · ${esc(p.contacto || '')}</small></td><td>${esc(p.wa)}</td><td class="n">${x.llegada ? esc(x.llegada) + ' h' : '—'}</td></tr>`).join('')}</tbody></table>
        <h4 class="imp-h4">Equipo</h4><table class="imp-t chica"><tbody>${eq.map(({ a, p }) => `<tr><td><b>${esc(p.nombre)}</b><small>${esc(a.rol)}</small></td><td>${esc(p.wa)}</td></tr>`).join('')}</tbody></table></div>
    </div>
    ${pieImp()}</section>`;
  imprimir(html, `Hoja del día ${Boda.pareja(b)}`);
}

/* ---------- Listado de invitados con su número de mesa ----------
   Por orden alfabético (por apellido). Sale en PDF o en planilla
   (un archivo .csv que se abre con Excel). Por defecto, solo los
   confirmados: es el que se le pasa al salón y a las recepcionistas. */
const apellidoInv = n => n.replace(/^Familia /, '').split(' ').slice(-1)[0];
function filasListado(b, soloConfirmados = true) {
  return Store.deBoda('invitados', b.id)
    .filter(i => soloConfirmados ? i.estado === 'Confirmado' : i.estado !== 'No viene')
    .sort((x, y) => apellidoInv(x.nombre).localeCompare(apellidoInv(y.nombre), 'es') || x.nombre.localeCompare(y.nombre, 'es'))
    .map(i => { const m = i.mesaId ? Store.obtener('mesas', i.mesaId) : null; return { i, m, n: m ? nombreMesa(m, b) : '' }; });
}

function imprimirListado(b, soloConfirmados = true) {
  const filas = filasListado(b, soloConfirmados);
  const sinMesa = filas.filter(f => !f.m).length;
  const html = `<div class="carta listado">
    ${cabBoda(b, soloConfirmados ? 'Invitados confirmados y su mesa' : 'Invitados y su mesa')}
    <div class="imp-nums"><div><small>Invitaciones</small><b>${filas.length}</b></div><div><small>Personas</small><b>${suma(filas, f => f.i.adultos + f.i.ninos)}</b></div>
      <div><small>Mesas</small><b>${Store.deBoda('mesas', b.id).length}</b></div><div><small>Sin mesa</small><b>${sinMesa}</b></div></div>
    <table class="imp-t chica lst"><thead><tr><th>Invitado</th><th>Grupo</th><th class="n">Personas</th><th class="n">Mesa N°</th><th>Nombre de la mesa</th></tr></thead>
    <tbody>${filas.map(({ i, m, n }) => `<tr><td><b>${esc(i.nombre)}</b>${i.restr?.length ? `<small>${esc(i.restr.join(', '))}</small>` : ''}</td><td>${esc(i.grupo)}</td>
      <td class="n">${i.adultos + i.ninos}</td><td class="n lst-num">${m ? m.num : '—'}</td><td>${m && n !== 'Mesa ' + m.num ? esc(n) : ''}</td></tr>`).join('')}</tbody></table>
  </div>`;
  imprimir(html, `Invitados y mesas · ${Boda.pareja(b)}`, false, true);
}

function descargarListado(b, soloConfirmados = true) {
  const celda = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const filas = filasListado(b, soloConfirmados).map(({ i, m, n }) =>
    [i.nombre, i.grupo, i.adultos, i.ninos, i.adultos + i.ninos, m ? m.num : '', m && n !== 'Mesa ' + m.num ? n : '', i.estado, (i.restr || []).join(', ')].map(celda).join(';'));
  const csv = '\uFEFF' + ['Invitado', 'Grupo', 'Adultos', 'Niños', 'Personas', 'Mesa N°', 'Nombre de la mesa', 'Confirmación', 'Comida especial'].map(celda).join(';') + '\n' + filas.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `Invitados y mesas - ${Boda.pareja(b)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  aviso('Planilla descargada: se abre con Excel');
}

/* La ventanita para elegir cómo sacar el listado */
function listadoMesas(b) {
  const conf = Store.deBoda('invitados', b.id).filter(i => i.estado === 'Confirmado');
  const sinMesa = conf.filter(i => !i.mesaId).length;
  const m = modal({
    titulo: 'Listado de invitados con su mesa',
    cuerpo: `<p class="suave">Ordenado por apellido, con el número de mesa de cada uno. Es el que se le pasa al salón y a las recepcionistas.</p>
      <label class="campo campo-si"><input type="checkbox" id="lm-conf" checked><span>Solo los confirmados (${conf.length})</span></label>
      ${sinMesa ? `<p class="aviso-banda">⚠ Hay ${sinMesa} confirmado${sinMesa > 1 ? 's' : ''} sin mesa: en el listado salen con «—».</p>` : ''}`,
    acciones: [
      { texto: '⬇ Planilla (Excel)', clase: 's', hacer: f => descargarListado(b, $('#lm-conf', f).checked) },
      { texto: '⎙ PDF', clase: 'p', hacer: f => { const s = $('#lm-conf', f).checked; setTimeout(() => imprimirListado(b, s), 60); } },
    ],
  });
  return m;
}


/* ===== js/98-celular.js ===== */
/* ============================================================
   CELULAR · las tablas se arreglan solas
   Se llama después de pintar cada sección. Mira cuántas columnas
   tiene cada tabla y decide:
   · hasta 7 columnas → se convierte en FICHAS (etiqueta + dato)
   · más de 7        → se desliza de costado con la primera columna fija
   Al agregar una sección nueva no hay que tocar nada de esto.
   ============================================================ */

const COLUMNAS_FICHA = 7;

function prepararTablas(ctx = document) {
  $$('table.t', ctx).forEach(tabla => {
    if (tabla.closest('#impreso')) return;
    const cab = $$('thead th', tabla).map(th => th.textContent.trim());
    if (!cab.length) return;

    const modo = cab.length <= COLUMNAS_FICHA ? 'cel-fichas' : 'cel-ancho';
    tabla.classList.remove('cel-fichas', 'cel-ancho');
    tabla.classList.add(modo);

    /* La etiqueta de cada dato, para cuando la fila se ve como ficha */
    $$('tbody tr', tabla).forEach(tr => {
      $$('td', tr).forEach((td, i) => {
        const et = cab[i] || '';
        if (et) td.setAttribute('data-et', et);
        else if (!td.classList.contains('titulo')) td.classList.add('esconder-cel');
      });
    });

    /* Las tablas largas se desplazan dentro de su tarjeta, con el
       encabezado siempre visible (solo en computadora). */
    const marcoAlto = tabla.closest('.tabla-marco');
    if (marcoAlto) marcoAlto.classList.toggle('alta',
      window.innerWidth > 760 && $$('tbody tr', tabla).length > 22);

    /* Aviso de que se desliza (solo en las anchas y solo una vez) */
    if (modo === 'cel-ancho') {
      const marco = tabla.closest('.tabla-marco');
      if (marco && !marco.previousElementSibling?.classList?.contains('cel-ancho-aviso')) {
        const a = document.createElement('div');
        a.className = 'cel-ancho-aviso';
        a.innerHTML = '↔ Esta tabla se desliza de costado';
        marco.parentNode.insertBefore(a, marco);
      }
    }
  });
}

/* Si cambia el tamaño de la ventana, se vuelven a clasificar las tablas */
let _tamanio;
window.addEventListener('resize', () => {
  clearTimeout(_tamanio);
  _tamanio = setTimeout(() => prepararTablas(document.querySelector('.seccion.on') || document), 200);
});


/* ===== js/99-app.js ===== */
/* ============================================================
   ARRANQUE
   Abre los datos y muestra la primera pantalla.
   Con ?web=1 entra directo al bloqueo (para la web de Wydan).
   Con ?v=2 o cualquier otro valor, solo sirve para que el navegador
   no muestre una versión guardada vieja.
   ============================================================ */

(function arrancar() {
  Store.abrir();

  /* Enganches de las primeras pantallas */
  $('#bv-entrar').onclick = mostrarBloqueo;
  $('#bq-volver').onclick = mostrarBienvenida;
  $('#bq-form').onsubmit = probarClave;
  $$('.bq-solapas button').forEach(b => b.onclick = () => elegirQuien(b.dataset.quien));
  $('#btn-bloquear').onclick = bloquear;
  $('#menu-btn').onclick = abrirMenuCel;
  $('#tapa').onclick = cerrarMenuCel;

  const directo = new URLSearchParams(location.search).has('web');
  if (directo) mostrarBloqueo(); else mostrarBienvenida();

  /* Cuenta regresiva de la demostración: se actualiza cada segundo y,
     si vence con la página abierta, se cierra sola */
  pintarVence();
  setInterval(() => {
    if (demoVencida()) { if (!$('.bv-fin')) mostrarVencida(); return; }
    pintarVence();
  }, 1000);

  /* Que la fecha no quede vieja si alguien deja la página abierta toda la noche */
  let diaMostrado = iso(HOY());
  setInterval(() => {
    if (iso(HOY()) !== diaMostrado && !$('#app').classList.contains('hidden')) { diaMostrado = iso(HOY()); repintar(); }
  }, 60000);
})();
