    <div class="filtros"><input type="search" class="crece" id="pv-busca" placeholder="Buscar por nombre, Instagram, nota…" value="${esc(_provBusca)}">
      <select id="pv-ciudad"><option value="">Todas las ciudades</option>${unicos(todos.map(p => p.ciudad)).map(c => `<option ${_provCiudad === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <span class="cuenta">${l.length} proveedores</span></div>
    <div class="pv-grilla">${ordenar(l, p => p.rubro + (9 - p.estrellas) + p.nombre).map(p => {
      const bodas = bprov.filter(x => x.provId === p.id).map(x => Store.obtener('bodas', x.bodaId)).filter(Boolean);
      return `<article class="pv-t" data-p="${p.id}">
        <header><span class="pt-ic">${iconoRubro(p.rubro)}</span><div><small>${esc(p.rubro)}</small><b>${esc(p.nombre)}</b></div></header>
        <div class="pv-l">📍 ${esc(p.ciudad)} ${estrellas(p.estrellas)}</div>
        <div class="pv-precio">${dolares(p.min)} – ${dolares(p.max)}<small>${esc(p.unidad)}</small></div>
        ${p.notas ? `<p class="pt-nota">${esc(p.notas)}</p>` : ''}
        <div class="pv-bodas">${bodas.length ? `<span class="paleta">${bodas.slice(0, 6).map(b => `<i style="background:${Boda.paleta(b)[0]}" title="${esc(Boda.pareja(b))}"></i>`).join('')}</span> Trabajó en ${bodas.length} boda${bodas.length > 1 ? 's' : ''} con vos` : '<span class="suave">Todavía no trabajaron juntos</span>'}</div>
        <footer><button class="btn mini" data-wa="${esc(p.wa)}" data-n="${esc(p.contacto || '')}">WhatsApp</button>
          <a class="btn mini" href="https://instagram.com/${esc(p.ig.replace('@', ''))}" target="_blank" rel="noopener">${esc(p.ig)}</a></footer>
      </article>`;
    }).join('') || vacio('✦', 'No hay proveedores con ese filtro')}</div>`;
  $$('[data-r]', cuerpo).forEach(x => x.onclick = () => { _provRubro = x.dataset.r; repintar(); });
  $('#pv-ciudad', cuerpo).onchange = e => { _provCiudad = e.target.value; repintar(); };
  const bus = $('#pv-busca', cuerpo);
  bus.oninput = () => { _provBusca = bus.value; const p = bus.selectionStart; repintar(); const n = $('#pv-busca'); n.focus(); n.setSelectionRange(p, p); };
  $$('[data-p]', cuerpo).forEach(x => x.onclick = e => { if (e.target.closest('[data-wa],a')) return; fichaProveedor(Store.obtener('proveedores', x.dataset.p)); });
  $$('[data-wa]', cuerpo).forEach(x => x.onclick = () => whatsapp(x.dataset.wa, `¡Hola ${x.dataset.n}! Soy Vanessa Camargo, te escribo por una boda 😊`));
}

/* ---------- Estimador ---------- */
const RUBROS_ESTIMADOR = ['Salón o estancia', 'Catering', 'Fotografía', 'Video', 'DJ y sonido', 'Flores y ambientación', 'Torta y mesa dulce', 'Barra de tragos', 'Maquillaje y peinado', 'Papelería e invitaciones'];

function estimacionActual() {
  const lineas = [];
  Object.entries(_est.elegidos).forEach(([rubro, id]) => {
    const p = id && Store.obtener('proveedores', id);
    if (!p) return;
    const [min, max] = rangoProveedor(p, _est.personas);
    lineas.push({ rubro, provId: p.id, min, max });
  });
  return lineas;
}

function pintarEstimador(cuerpo) {
  if (!_est) {
    _est = { personas: 150, elegidos: {} };
    RUBROS_ESTIMADOR.forEach(r => { const p = ordenar(Store.listar('proveedores', x => x.rubro === r), x => -x.estrellas)[0]; _est.elegidos[r] = p?.id || ''; });
    _est.elegidos.Video = ''; _est.elegidos['Barra de tragos'] = '';
  }
  const lineas = estimacionActual();
  const tmin = suma(lineas, l => l.min), tmax = suma(lineas, l => l.max);
  cuerpo.innerHTML = `<div class="cols c21">
    ${tarjeta('Armá la boda que quieren', `
      <label class="campo est-pers"><span>Cantidad de invitados</span>
        <input type="range" min="30" max="300" step="10" id="es-pers" value="${_est.personas}"><b id="es-pers-n">${_est.personas} personas</b></label>
      <div class="est-filas">${RUBROS_ESTIMADOR.map(r => {
        const ops = ordenar(Store.listar('proveedores', p => p.rubro === r), p => -p.estrellas);
        const sel = _est.elegidos[r] ? Store.obtener('proveedores', _est.elegidos[r]) : null;
        const [mi, ma] = sel ? rangoProveedor(sel, _est.personas) : [0, 0];
        return `<div class="est-fila ${sel ? '' : 'apagada'}"><span class="pt-ic">${iconoRubro(r)}</span><div class="ef-t"><small>${esc(r)}</small>
          <select data-er="${esc(r)}"><option value="">No incluir</option>${ops.map(p => `<option value="${p.id}" ${sel?.id === p.id ? 'selected' : ''}>${esc(p.nombre)} · ${'★'.repeat(p.estrellas)}</option>`).join('')}</select></div>
          <b class="ef-p">${sel ? `${dolares(mi)} – ${dolares(ma)}` : '—'}</b></div>`;
      }).join('')}</div>`)}
    <div class="est-res">
      <div class="er-sobre">Una boda de ${_est.personas} personas ronda entre</div>
      <div class="er-n">${dolares(tmin)} <span>y</span> ${dolares(tmax)}</div>
      <div class="er-pp">≈ ${dolares(tmin / _est.personas)} a ${dolares(tmax / _est.personas)} por invitado · ${pesos(tmin * Store.cfg().tipoCambio)} a ${pesos(tmax * Store.cfg().tipoCambio)}</div>
      <div class="er-barras">${lineas.map(l => `<div class="erb"><span>${iconoRubro(l.rubro)} ${esc(l.rubro)}</span><div class="erb-b"><i style="width:${(l.max / (tmax || 1) * 100).toFixed(1)}%"></i></div></div>`).join('')}</div>
      <div class="botones">
        <button class="btn p" id="es-pres">◈ Sumarlo a un presupuesto</button>
        <button class="btn" id="es-wa">Mandar por WhatsApp</button>
      </div>
      <p class="er-nota">Valores aproximados de tu base de datos, sin tus honorarios. Se confirman con cada proveedor.</p>
    </div></div>`;
  const rango = $('#es-pers', cuerpo);
  rango.oninput = () => { $('#es-pers-n').textContent = rango.value + ' personas'; };
  rango.onchange = () => { _est.personas = +rango.value; repintar(); };
  $$('[data-er]', cuerpo).forEach(x => x.onchange = () => { _est.elegidos[x.dataset.er] = x.value; repintar(); });
  $('#es-pres', cuerpo).onclick = () => nuevoPresupuesto(null, { estimacion: lineas, invitados: _est.personas });
  $('#es-wa', cuerpo).onclick = () => {
    const t = `Hola! Te paso una idea de costos para una boda de ${_est.personas} personas ♡\n\n` +
      lineas.map(l => `• ${l.rubro}: ${dolares(l.min)} a ${dolares(l.max)}`).join('\n') +
      `\n\nTotal aproximado: ${dolares(tmin)} a ${dolares(tmax)}\n(valores orientativos, se confirman con cada proveedor)\n\nVanessa Camargo · Organizadora de eventos`;
    window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
  };
}

function fichaProveedor(p) {
  const nuevo = !p;
  p = p || { nombre: '', rubro: 'Fotografía', ciudad: 'Rivera', ig: '', wa: '', min: 0, max: 0, unidad: 'por evento', estrellas: 4, notas: '', contacto: '' };
  const campos = [
    { n: 'nombre', e: 'Nombre', valor: p.nombre, req: true },
    { n: 'rubro', e: 'Rubro', tipo: 'select', ops: RUBROS.map(r => r.n), valor: p.rubro },
    { n: 'contacto', e: 'Persona de contacto', valor: p.contacto },
    { n: 'ciudad', e: 'Ubicación', valor: p.ciudad },
    { n: 'ig', e: 'Instagram', valor: p.ig, ph: '@usuario' },
    { n: 'wa', e: 'WhatsApp', valor: p.wa },
    { n: 'min', e: 'Precio desde (US$)', tipo: 'number', valor: p.min },
    { n: 'max', e: 'Precio hasta (US$)', tipo: 'number', valor: p.max },
    { n: 'unidad', e: 'El precio es', tipo: 'select', ops: ['por evento', 'por persona'], valor: p.unidad },
    { n: 'estrellas', e: 'Tu valoración', tipo: 'select', ops: [5, 4, 3, 2, 1].map(n => ({ v: n, t: '★'.repeat(n) })), valor: p.estrellas },
    { n: 'notas', e: 'Notas (solo para vos)', tipo: 'textarea', valor: p.notas, ancho: 'ancho' },
  ];
  modal({
    titulo: nuevo ? 'Nuevo proveedor' : p.nombre, ancho: 'ancho',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>`,
    acciones: [
      ...(!nuevo ? [{ texto: 'Borrar', clase: 's peligro', hacer: () => { if (!confirm('¿Borrar este proveedor?')) return false; Store.borrar('proveedores', p.id); repintar(); } }] : []),
      { texto: 'Cancelar', clase: 's' },
      { texto: 'Guardar', clase: 'p', hacer: f => {
        const v = leerFormulario(campos, f);
        if (!v.nombre) return false;
        v.estrellas = +v.estrellas; v.min = v.min || 0; v.max = Math.max(v.max || 0, v.min);
        nuevo ? Store.crear('proveedores', v) : Store.editar('proveedores', p.id, v);
        aviso('Proveedor guardado'); repintar();
      } },
    ],
  });
}


/* ===== js/15-planes.js ===== */
/* ============================================================
   PANEL · PLANES Y PRESUPUESTOS
   · Sus servicios (los mismos que ofrece hoy en su propuesta, con sus
     textos) y los extras que se pueden sumar.
   · Presupuestos para cada pareja, como los arma Vanessa: una carta con
     varias opciones para elegir (y una recomendada), la cantidad de
     invitados, la seña para reservar la fecha y el saldo.
     El PDF sale de 30-impresos.js.
   · Cuando la pareja acepta, elige su opción y pasa a ser una boda.
   ============================================================ */

const ESTADOS_PRES = ['Borrador', 'Enviado', 'Aceptado', 'No avanzó'];

/* Precio más bajo y más alto de las opciones de un presupuesto */
const rangoPres = p => { const v = (p.opciones || []).map(o => o.precio); return v.length ? [Math.min(...v), Math.max(...v)] : [0, 0]; };
const invitadosTexto = p => p.invitadosHasta && p.invitadosHasta > p.invitados ? `de ${p.invitados} hasta ${p.invitadosHasta} personas` : `${p.invitados} personas`;

PANTALLAS.planes = {
  t: 'Planes y presupuestos',
  pintar(hoja) {
    const planes = ordenar(Store.listar('planes'), p => p.orden);
    const pres = ordenar(Store.listar('presupuestos'), p => p.fecha, true);
    const extras = Store.cfg().extras || [];
    hoja.innerHTML = encabezado('Planes y presupuestos', 'Tus servicios y los presupuestos que mandás, con una carta en PDF que da gusto recibir.',
      `<button class="btn" id="pl-pdf">⎙ Mis servicios (PDF)</button><button class="btn p" id="pl-pres">＋ Nuevo presupuesto</button>`) + `
    <div class="sena-banda"><span class="sb-ic">♡</span><div><b>Seña del ${Sena.pct()} % para reservar la fecha</b>
      <span>El ${100 - Sena.pct()} % restante se abona hasta ${Sena.dias()} días antes del evento. Sale sola en cada presupuesto y en las cuotas de cada boda.</span></div>
      <button class="btn mini" id="pl-sena">Cambiar</button></div>
    <div class="planes">${planes.map((p, i) => `<article class="plan ${p.destacado ? 'destacado' : ''}">
        ${p.destacado ? '<span class="plan-cinta">El más completo</span>' : ''}
        <small class="plan-num">Opción ${i + 1}</small>
        <h3>${esc(p.nombre)}</h3><p class="plan-sub">${esc(p.sub || '')}</p>
        <div class="plan-precio"><small>$</small>${numero(p.precio)}</div>
        <div class="plan-meta"><span>👥 ${p.personas || 1} ${p.personas === 1 ? 'persona' : 'personas'} el día del evento</span><span>Seña ${pesos(Sena.monto(p.precio))}</span></div>
        <ul>${(p.incluye || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        ${p.alcance ? `<p class="plan-alcance">${esc(p.alcance)}</p>` : ''}
        <div class="botones"><button class="btn mini" data-texto="${p.id}">Ver el texto completo</button><button class="btn-txt" data-plan="${p.id}">Editar</button></div></article>`).join('')}
      <button class="plan plan-nuevo" id="pl-nuevo"><span>＋</span>Nuevo servicio</button></div>

    ${tarjeta('Extras que podés sumar', `<div class="extras">${extras.map((x, i) => `<button class="extra" data-ex="${i}"><span>${esc(x.t)}</span><b>${pesos(x.monto)}</b></button>`).join('')}
      <button class="extra nuevo" id="ex-nuevo">＋ Extra</button></div>`)}

    <div style="height:18px"></div>
    ${tarjeta('Presupuestos', pres.length ? `<div class="tabla-marco"><table class="t">
      <thead><tr><th>Pareja</th><th>Fecha de la boda</th><th>Opciones</th><th class="n">Valores</th><th>Enviado</th><th>Estado</th><th></th></tr></thead>
      <tbody>${pres.map(p => { const [mi, ma] = rangoPres(p); const rec = Store.obtener('planes', p.recomendada); return `<tr class="clic" data-pres="${p.id}">
        <td class="titulo"><b>${esc(p.pareja)}</b><small class="d-b suave">${invitadosTexto(p)} · ${esc(p.lugar || 'lugar a definir')}</small></td>
        <td>${p.fechaBoda ? fecha(p.fechaBoda) : '—'}</td>
        <td>${(p.opciones || []).length} ${(p.opciones || []).length === 1 ? 'opción' : 'opciones'}${rec ? `<small class="d-b suave">★ ${esc(rec.nombre)}</small>` : ''}</td>
        <td class="n"><b>${mi === ma ? pesos(mi) : `${pesos(mi)} a ${pesos(ma)}`}</b></td><td>${fecha(p.fecha)}</td><td>${chip(p.estado)}</td>
        <td class="acc">${p.estado === 'Enviado' ? `<button class="btn mini p" data-acepta="${p.id}">♡ Aceptó</button> ` : ''}<button class="btn mini" data-ver="${p.id}">⎙ PDF</button></td></tr>`; }).join('')}</tbody></table></div>`
      : vacio('◈', 'Todavía no mandaste presupuestos'))}`;

    $('#pl-pres', hoja).onclick = () => nuevoPresupuesto(null);
    $('#pl-pdf', hoja).onclick = () => imprimirCatalogo();
    $('#pl-sena', hoja).onclick = () => irA('ajustes');
    $('#pl-nuevo', hoja).onclick = () => editarPlan(null);
    $$('[data-plan]', hoja).forEach(x => x.onclick = () => editarPlan(Store.obtener('planes', x.dataset.plan)));
    $$('[data-texto]', hoja).forEach(x => x.onclick = () => verTextoPlan(Store.obtener('planes', x.dataset.texto)));
    $$('[data-ex]', hoja).forEach(x => x.onclick = () => editarExtra(+x.dataset.ex));
    $('#ex-nuevo', hoja).onclick = () => editarExtra(-1);
    $$('[data-pres]', hoja).forEach(x => x.onclick = e => { if (e.target.closest('[data-ver],[data-acepta]')) return; nuevoPresupuesto(null, Store.obtener('presupuestos', x.dataset.pres)); });
    $$('[data-ver]', hoja).forEach(x => x.onclick = () => imprimirPresupuesto(Store.obtener('presupuestos', x.dataset.ver)));
    $$('[data-acepta]', hoja).forEach(x => x.onclick = () => aceptarPresupuesto(Store.obtener('presupuestos', x.dataset.acepta)));
  },
};

function verTextoPlan(p) {
  modal({
    titulo: p.nombre,
    cuerpo: `<p class="plan-texto">${esc(p.descripcion || p.sub || '')}</p>
      ${p.alcance ? `<p class="plan-alcance">${esc(p.alcance)}</p>` : ''}
      <p class="suave chico">Este es el texto que sale en el PDF del presupuesto. Se cambia desde «Editar».</p>`,
  });
}

function editarPlan(p) {
  const nuevo = !p;
  p = p || { nombre: '', sub: '', descripcion: '', precio: 0, personas: 1, incluye: [], alcance: '', destacado: false, orden: 99 };
  const campos = [
    { n: 'nombre', e: 'Nombre del servicio', valor: p.nombre, req: true },
    { n: 'precio', e: 'Valor ($)', tipo: 'number', valor: p.precio },
    { n: 'personas', e: 'Personas del equipo el día del evento', tipo: 'number', valor: p.personas },
    { n: 'sub', e: 'Frase corta', valor: p.sub },
    { n: 'descripcion', e: 'Texto completo (sale en el PDF)', tipo: 'textarea', filas: 7, valor: p.descripcion, ancho: 'ancho' },
    { n: 'incluye', e: 'En pocas palabras, qué incluye (una cosa por renglón)', tipo: 'textarea', filas: 5, valor: (p.incluye || []).join('\n'), ancho: 'ancho' },
    { n: 'alcance', e: 'Aclaración: lo que no incluye o hasta dónde llega', tipo: 'textarea', filas: 3, valor: p.alcance, ancho: 'ancho' },
    { n: 'destacado', e: 'Destacarlo como «el más completo»', tipo: 'checkbox', valor: p.destacado, ancho: 'ancho' },
  ];
  modal({
    titulo: nuevo ? 'Nuevo servicio' : 'Editar servicio', ancho: 'ancho',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>`,
    acciones: [
      ...(!nuevo ? [{ texto: 'Borrar', clase: 's peligro', hacer: () => { if (!confirm('¿Borrar este servicio?')) return false; Store.borrar('planes', p.id); repintar(); } }] : []),
      { texto: 'Cancelar', clase: 's' },
      { texto: 'Guardar', clase: 'p', hacer: f => {
        const v = leerFormulario(campos, f);
        v.incluye = v.incluye.split('\n').map(s => s.trim()).filter(Boolean);
        v.precio = v.precio || 0; v.personas = v.personas || 1;
        if (v.destacado) Store.listar('planes').forEach(x => { x.destacado = false; });
        nuevo ? Store.crear('planes', Object.assign({ orden: Store.listar('planes').length + 1 }, v)) : Store.editar('planes', p.id, v);
        repintar();
      } },
    ],
  });
}

function editarExtra(i) {
  const extras = Store.cfg().extras || [];
  const x = extras[i] || { t: '', monto: 0 };
  const campos = [{ n: 't', e: 'Extra', valor: x.t, req: true, ancho: 'ancho' }, { n: 'monto', e: 'Valor ($)', tipo: 'number', valor: x.monto }];
  modal({
    titulo: i < 0 ? 'Nuevo extra' : 'Editar extra',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>`,
    acciones: [
      ...(i >= 0 ? [{ texto: 'Borrar', clase: 's peligro', hacer: () => { extras.splice(i, 1); Store.guardarCfg({ extras }); repintar(); } }] : []),
      { texto: 'Guardar', clase: 'p', hacer: f => {
        const v = leerFormulario(campos, f); if (!v.t) return false;
        if (i < 0) extras.push({ t: v.t, monto: v.monto || 0 }); else extras[i] = { t: v.t, monto: v.monto || 0 };
        Store.guardarCfg({ extras }); repintar();
      } },
    ],
  });
}

/* ---------- La pareja aceptó: elige su opción y se crea la boda ---------- */
function aceptarPresupuesto(p) {
  const m = modal({
    titulo: `¡${p.pareja} aceptaron! ♡`,
    cuerpo: `<p>¿Qué opción eligieron? Se crea su boda con ese valor, la seña de hoy y el saldo ${Sena.dias()} días antes.</p>
      <div class="elegir-lista">${(p.opciones || []).map(o => { const pl = Store.obtener('planes', o.planId); return pl ? `
        <button class="elegir-prov" data-op="${o.planId}"><span class="pt-ic">${o.planId === p.recomendada ? '★' : '♡'}</span>
          <span class="ep-t"><b>${esc(pl.nombre)}</b><small>Seña ${pesos(Sena.monto(o.precio))} · saldo ${pesos(Sena.saldo(o.precio))}</small></span>
          <span class="ep-p">${pesos(o.precio)}</span></button>` : ''; }).join('')}</div>`,
  });
  $$('[data-op]', m.fondo).forEach(x => x.onclick = () => {
    const o = p.opciones.find(z => z.planId === x.dataset.op);
    Store.editar('presupuestos', p.id, { estado: 'Aceptado', elegida: o.planId });
    const c = p.clienteId ? Store.obtener('clientes', p.clienteId) : { nombre: p.pareja };
    m.cerrar();
    nuevaBoda(Object.assign({}, c, { fechaTent: p.fechaBoda || c.fechaTent, invitados: p.invitadosHasta || p.invitados, planId: o.planId,
      honorario: o.precio + suma(p.extras || [], e => e.monto) }));
  });
}

/* ---------- Armar (o editar) un presupuesto ---------- */
function nuevoPresupuesto(cliente, base) {
  const existente = base?.id ? base : null;
  const planes = ordenar(Store.listar('planes'), x => x.orden);
  const p = Object.assign({
    clienteId: cliente?.id || null, pareja: cliente?.nombre || '', fechaBoda: cliente?.fechaTent || '',
    invitados: cliente?.invitados || base?.invitados || 120, invitadosHasta: 0, lugar: '',
    opciones: planes.map(x => ({ planId: x.id, precio: x.precio })), recomendada: planes.find(x => x.destacado)?.id || null,
    extras: [], estimacion: [], estado: 'Borrador', fecha: iso(HOY()), nota: '¡Gracias por pensar en nosotros para su gran día!',
  }, base || {});
  p.estimacion = (p.estimacion || []).map(l => ({ ...l }));
  p.secciones = (p.secciones || []).map(s => ({ ...s }));
  /* Texto propio de cada opción para esta pareja (si se cambió) */
  const opTextos = {};
  (p.opciones || []).forEach(o => { if (o.texto) opTextos[o.planId] = o.texto; });
  const extras = Store.cfg().extras || [];
  const clientes = Store.listar('clientes', c => !['Se casaron', 'No avanzó'].includes(c.etapa));
  const m = modal({
    titulo: existente ? 'Presupuesto · ' + p.pareja : 'Nuevo presupuesto', ancho: 'muy-ancho',
    cuerpo: `<div class="np">
      <div class="np-izq">
        <div class="rejilla">
          <label class="campo"><span>Pareja</span><input id="np-pareja" value="${esc(p.pareja)}" data-sugerido="${esc(clientes.map(c => c.nombre).join('|'))}" placeholder="Ej.: Laura & Ignacio"></label>
          <label class="campo"><span>Fecha de la boda</span><input type="date" id="np-fecha" value="${esc(p.fechaBoda)}"></label>
          <label class="campo"><span>Invitados desde</span><input type="number" id="np-inv" value="${p.invitados}"></label>
          <label class="campo"><span>Hasta (opcional)</span><input type="number" id="np-inv2" value="${p.invitadosHasta || ''}" placeholder="—"></label>
          <label class="campo"><span>Lugar</span><input id="np-lugar" value="${esc(p.lugar)}" placeholder="A definir"></label>
          <label class="campo"><span>Estado</span><select id="np-estado">${ESTADOS_PRES.map(e => `<option ${p.estado === e ? 'selected' : ''}>${e}</option>`).join('')}</select></label>
        </div>
        <h4 class="f-sep">Opciones que les ofrecés <small class="suave">(marcá las que van y ajustá el valor si hace falta; ★ = la que recomendás)</small></h4>
        <div class="np-ops">${planes.map(x => { const o = p.opciones.find(z => z.planId === x.id); return `
          <div class="np-op ${o ? '' : 'apagada'}"><label><input type="checkbox" data-np-op="${x.id}" ${o ? 'checked' : ''}><span><b>${esc(x.nombre)}</b><small>${x.personas || 1} pers. · ${esc(x.sub || '')}</small></span></label>
            <input type="number" class="inp" data-np-precio="${x.id}" value="${o ? o.precio : x.precio}">
            <button type="button" class="np-txt ${opTextos[x.id] ? 'on' : ''}" data-np-txt="${x.id}" title="Cambiar el texto de esta opción solo para esta pareja">✎</button>
            <button type="button" class="np-rec ${p.recomendada === x.id ? 'on' : ''}" data-np-rec="${x.id}" title="Recomendar esta opción">★</button></div>`; }).join('')}</div>
        <h4 class="f-sep">Para sumar <small class="suave">(extras opcionales)</small></h4>
        <div class="np-extras">${extras.map((x, i) => `<label class="ac-s"><input type="checkbox" data-np-ex="${i}" ${p.extras.some(e => e.t === x.t) ? 'checked' : ''}><span>${esc(x.t)}</span><small>${pesos(x.monto)}</small></label>`).join('')}</div>
        <h4 class="f-sep">Textos de la carta <small class="suave">(cambialos como quieras: valen solo para esta pareja)</small></h4>
        <label class="campo"><span>Presentación</span><textarea id="np-intro" rows="3">${esc(p.intro ?? Store.cfg().intro)}</textarea>
          <i class="ayuda">{novios}, {fecha} e {invitados} se completan solos.</i></label>
        <label class="campo"><span>Unas palabras para la pareja (opcional)</span><textarea id="np-nota" rows="2">${esc(p.nota || '')}</textarea></label>
        <label class="campo"><span>Forma de pago (si lo dejás vacío, no sale)</span><textarea id="np-pago" rows="3">${esc(p.formaPago ?? Sena.texto())}</textarea></label>
        <div id="np-secs"></div>
        <button class="btn mini" id="np-add-sec" type="button">＋ Agregar un texto a la carta</button>
        <h4 class="f-sep">Idea de costos de proveedores <small class="suave">(opcional, sale en el PDF)</small></h4>
        <div id="np-est"></div>
        <button class="btn mini" id="np-add-est">＋ Sumar un rubro</button>
      </div>
      <aside class="np-der" id="np-total"></aside></div>`,
    acciones: [
      ...(existente ? [{ texto: 'Borrar', clase: 's peligro', hacer: () => { if (!confirm('¿Borrar este presupuesto?')) return false; Store.borrar('presupuestos', p.id); repintar(); } }] : []),
      { texto: 'Guardar', clase: 's', hacer: () => { if (!guardarPres()) return false; } },
      { texto: 'Guardar y ver el PDF', clase: 'p', hacer: () => { const x = guardarPres(); if (!x) return false; setTimeout(() => imprimirPresupuesto(x), 80); } },
    ],
  });
  const f = m.fondo;
  const leer = () => ({
    pareja: $('#np-pareja', f).value.trim(), fechaBoda: $('#np-fecha', f).value, invitados: +$('#np-inv', f).value || 0,
    invitadosHasta: +$('#np-inv2', f).value || 0, lugar: $('#np-lugar', f).value.trim(), estado: $('#np-estado', f).value,
    opciones: $$('[data-np-op]', f).filter(x => x.checked).map(x => Object.assign({ planId: x.dataset.npOp, precio: +$(`[data-np-precio="${x.dataset.npOp}"]`, f).value || 0 },
      opTextos[x.dataset.npOp] ? { texto: opTextos[x.dataset.npOp] } : {})),
    recomendada: p.recomendada, extras: $$('[data-np-ex]', f).filter(x => x.checked).map(x => extras[+x.dataset.npEx]),
    nota: $('#np-nota', f).value.trim(), estimacion: p.estimacion,
    intro: $('#np-intro', f).value.trim(), formaPago: $('#np-pago', f).value.trim(),
    secciones: $$('.np-sec', f).map(d => ({ titulo: $('[data-sec-t]', d).value.trim(), texto: $('[data-sec-x]', d).value.trim() })).filter(s => s.titulo || s.texto),
  });
  /* Los textos libres que se agregan a la carta */
  const secsDelForm = () => $$('.np-sec', f).map(d => ({ titulo: $('[data-sec-t]', d).value, texto: $('[data-sec-x]', d).value }));
  const pintarSecs = () => {
    $('#np-secs', f).innerHTML = p.secciones.map((s, i) => `<div class="np-sec">
      <input class="inp" data-sec-t value="${esc(s.titulo)}" placeholder="Título (ej.: Lo que nos diferencia)">
      <textarea class="inp" data-sec-x rows="3" placeholder="Escribí lo que quieras que lea la pareja">${esc(s.texto)}</textarea>
      <button type="button" class="m-x mini" data-sec-quitar="${i}" title="Quitar">×</button></div>`).join('');
    $$('[data-sec-quitar]', f).forEach(x => x.onclick = () => { p.secciones = secsDelForm(); p.secciones.splice(+x.dataset.secQuitar, 1); pintarSecs(); resumen(); });
  };
  $('#np-add-sec', f).onclick = () => { p.secciones = secsDelForm(); p.secciones.push({ titulo: '', texto: '' }); pintarSecs(); $$('[data-sec-t]', f).pop()?.focus(); };
  /* Cambiar el texto de una opción solo para esta pareja */
  $$('[data-np-txt]', f).forEach(b => b.onclick = async () => {
    const pl = Store.obtener('planes', b.dataset.npTxt);
    const t = await pedirTexto({ titulo: pl.nombre, etiqueta: 'Texto de esta opción para esta pareja (vacío = vuelve al texto original)', valor: opTextos[pl.id] || pl.descripcion || '', largo: true });
    if (t === null) return;
    if (!t || t === pl.descripcion) delete opTextos[pl.id]; else opTextos[pl.id] = t;
    b.classList.toggle('on', !!opTextos[pl.id]);
    const cb = $(`[data-np-op="${pl.id}"]`, f); if (opTextos[pl.id] && !cb.checked) cb.checked = true;
    resumen();
  });
  const pintarEst = () => {
    const pers = Math.max(+$('#np-inv', f).value || 0, +$('#np-inv2', f).value || 0);
    p.estimacion = p.estimacion.map(l => { const pr = Store.obtener('proveedores', l.provId); if (!pr) return l; const [min, max] = rangoProveedor(pr, pers); return { ...l, min, max }; });
    $('#np-est', f).innerHTML = p.estimacion.length ? `<div class="np-lineas">${p.estimacion.map((l, i) => `<div class="np-linea"><span>${iconoRubro(l.rubro)} ${esc(l.rubro)}</span>
      <select data-np-prov="${i}">${Store.listar('proveedores', x => x.rubro === l.rubro).map(x => `<option value="${x.id}" ${x.id === l.provId ? 'selected' : ''}>${esc(x.nombre)}</option>`).join('')}</select>
      <b>${dolares(l.min)} – ${dolares(l.max)}</b><button class="m-x mini" data-np-quitar="${i}">×</button></div>`).join('')}</div>` : '<p class="suave chico">Sin estimación. Podés sumar rubros o armarla en Proveedores → Estimador.</p>';
    $$('[data-np-prov]', f).forEach(x => x.onchange = () => { p.estimacion[+x.dataset.npProv].provId = x.value; pintarEst(); resumen(); });
    $$('[data-np-quitar]', f).forEach(x => x.onclick = () => { p.estimacion.splice(+x.dataset.npQuitar, 1); pintarEst(); resumen(); });
  };
  const resumen = () => {
    const v = leer();
    $$('.np-op', f).forEach(d => d.classList.toggle('apagada', !$('[data-np-op]', d).checked));
    $$('[data-np-rec]', f).forEach(b => b.classList.toggle('on', b.dataset.npRec === p.recomendada));
    $('#np-total', f).innerHTML = `<div class="np-res">
      <small>Propuesta para</small><div class="script np-n">${esc(v.pareja || 'la pareja')}</div>
      <div class="np-sub">${v.fechaBoda ? conMayuscula(fechaLarga(v.fechaBoda)) : 'Fecha a definir'} · ${invitadosTexto(v)}</div>
      ${v.opciones.map(o => { const pl = Store.obtener('planes', o.planId); return `<div class="np-r ${o.planId === p.recomendada ? 'rec' : ''}">
        <span>${o.planId === p.recomendada ? '★ ' : ''}${esc(pl?.nombre || '')}${o.texto ? '<small>✎ con texto propio</small>' : ''}</span><b>${pesos(o.precio)}</b></div>`; }).join('') || '<p class="suave">Marcá al menos una opción.</p>'}
      ${v.secciones.length ? `<div class="np-est-t">Textos agregados<b>${v.secciones.length}</b></div>` : ''}
      ${v.extras.length ? `<div class="np-est-t">Para sumar<b>${v.extras.map(x => esc(x.t)).join(', ')}</b></div>` : ''}
      ${p.estimacion.length ? `<div class="np-est-t">Proveedores (aprox.)<b>${dolares(suma(p.estimacion, l => l.min))} – ${dolares(suma(p.estimacion, l => l.max))}</b></div>` : ''}
      ${v.formaPago ? `<p class="np-sena">${esc(v.formaPago)}</p>` : ""}</div>`;
  };
  $$('[data-np-rec]', f).forEach(b => b.onclick = () => {
    p.recomendada = p.recomendada === b.dataset.npRec ? null : b.dataset.npRec;
    const cb = $(`[data-np-op="${b.dataset.npRec}"]`, f); if (p.recomendada && !cb.checked) cb.checked = true;
    resumen();
  });
  $('#np-add-est', f).onclick = () => {
    const usados = p.estimacion.map(l => l.rubro);
    const r = RUBROS_ESTIMADOR.find(x => !usados.includes(x)) || 'Catering';
    const pr = ordenar(Store.listar('proveedores', x => x.rubro === r), x => -x.estrellas)[0];
    if (pr) p.estimacion.push({ rubro: r, provId: pr.id, min: 0, max: 0 });
    pintarEst(); resumen();
  };
  $('#np-pareja', f).addEventListener('change', () => {
    const c = Store.listar('clientes', x => x.nombre === $('#np-pareja', f).value)[0];
    if (c) { p.clienteId = c.id; if (c.fechaTent) $('#np-fecha', f).value = c.fechaTent; if (c.invitados) $('#np-inv', f).value = c.invitados; pintarEst(); }
    resumen();
  });
  f.addEventListener('input', resumen); f.addEventListener('change', resumen);
  ['#np-inv', '#np-inv2'].forEach(s => $(s, f).addEventListener('change', pintarEst));
  const guardarPres = () => {
    const v = leer();
    if (!v.pareja) { aviso('Falta el nombre de la pareja', 'mal'); return null; }
    if (!v.opciones.length) { aviso('Marcá al menos una opción', 'mal'); return null; }
    if (v.recomendada && !v.opciones.some(o => o.planId === v.recomendada)) v.recomendada = null;
    v.clienteId = p.clienteId || Store.listar('clientes', c => c.nombre === v.pareja)[0]?.id || null;
    const x = existente ? Store.editar('presupuestos', p.id, v) : Store.crear('presupuestos', Object.assign({ fecha: iso(HOY()) }, v));
    if (v.clienteId && v.estado === 'Enviado') { const c = Store.obtener('clientes', v.clienteId); if (c?.etapa === 'Consulta') Store.editar('clientes', c.id, { etapa: 'Presupuesto enviado' }); }
    aviso('Presupuesto guardado'); repintar();
    return x;
  };
  pintarSecs(); pintarEst(); resumen();
}


/* ===== js/16-finanzas.js ===== */
/* ============================================================
   PANEL · FINANZAS (lo de Vanessa, no lo de los novios)
   · Resumen: cobrado, gastos y resultado del mes y del año, en pesos.
   · Movimientos: cada ingreso y cada gasto (en pesos o dólares).
   · Por boda: cuánto le dejó cada boda (honorarios − equipo − gastos).
   Lo pendiente no suma al resultado hasta que se marca cobrado o pagado.
   ============================================================ */

let _finVista = 'resumen', _finMes = '';
const CATS_INGRESO = ['Honorarios', 'Extras', 'Otros eventos', 'Otros ingresos'];
const CATS_GASTO = ['Equipo', 'Materiales', 'Traslados', 'Publicidad', 'Teléfono e internet', 'Aportes y contador', 'Capacitación', 'Herramientas', 'Otros gastos'];

PANTALLAS.finanzas = {
  t: 'Finanzas',
  pintar(hoja) {
    hoja.innerHTML = encabezado('Finanzas', `Tus honorarios y tus gastos, en pesos (lo que entre en dólares se pasa a ${pesos(Store.cfg().tipoCambio)} por dólar).`,
      `<button class="btn" id="fi-gasto">− Gasto</button><button class="btn p" id="fi-ingreso">＋ Ingreso</button>`) + `
      <div class="filtros"><div class="solapas" id="fi-v">${[['resumen', 'Resumen'], ['movimientos', 'Movimientos'], ['bodas', 'Por boda']]
        .map(([v, t]) => `<button data-v="${v}" class="${_finVista === v ? 'on' : ''}">${t}</button>`).join('')}</div></div>
      <div id="fi-cuerpo"></div>`;
    const c = $('#fi-cuerpo', hoja);
    if (_finVista === 'resumen') c.innerHTML = finResumen();
    else if (_finVista === 'movimientos') c.innerHTML = finMovimientos();
    else c.innerHTML = finPorBoda();
    $$('#fi-v button', hoja).forEach(x => x.onclick = () => { _finVista = x.dataset.v; repintar(); });
    $('#fi-ingreso', hoja).onclick = () => editarMovimiento(null, 'ingreso');
    $('#fi-gasto', hoja).onclick = () => editarMovimiento(null, 'egreso');
    $('#fi-mes', hoja)?.addEventListener('change', e => { _finMes = e.target.value; repintar(); });
    $$('[data-mov]', hoja).forEach(x => x.onclick = e => { if (e.target.closest('[data-cobrar]')) return; editarMovimiento(Store.obtener('movimientos', x.dataset.mov)); });
    $$('[data-cobrar]', hoja).forEach(x => x.onclick = () => {
      const m = Store.obtener('movimientos', x.dataset.cobrar);
      Store.editar('movimientos', m.id, { estado: m.tipo === 'ingreso' ? 'cobrado' : 'pagado', fecha: diasHasta(m.fecha) > 0 ? iso(HOY()) : m.fecha });
      aviso(m.tipo === 'ingreso' ? '¡Cobrado! ✓' : 'Pagado ✓'); repintar();
    });
    $$('[data-bo]', hoja).forEach(x => x.onclick = () => abrirBoda(x.dataset.bo));
  },
};

function finResumen() {
  const meses = Finanzas.ultimosMeses(12);
  const mes = meses[meses.length - 1];
  const anio = suma(meses, m => m.resultado);
  const movAnio = meses.flatMap(m => m.mov);
  const ing = agrupar(movAnio.filter(m => m.tipo === 'ingreso' && m.estado === 'cobrado'), m => m.cat);
  const gas = agrupar(movAnio.filter(m => m.tipo === 'egreso' && m.estado !== 'pendiente'), m => m.cat);
  const tIng = suma(Object.values(ing).flat(), m => aPesos(m.monto, m.moneda));
  const tGas = suma(Object.values(gas).flat(), m => aPesos(m.monto, m.moneda));
  const tonosI = ['#A8833A', '#C9A962', '#6F8B78', '#B3787D'];
  const pend = ordenar(Store.listar('movimientos', m => m.estado === 'pendiente'), m => m.fecha).slice(0, 10);
  const max = Math.max(1, ...meses.map(m => Math.max(m.cobrado, m.pagado)));
  return `<div class="nums">
      <div class="num acento"><i>Resultado de ${MESES[+mes.k.slice(5) - 1]}</i><b>${pesos(mes.resultado)}</b><small>Cobrado ${pesos(mes.cobrado)} · gastos ${pesos(mes.pagado)}</small></div>
      <div class="num ok"><i>Últimos 12 meses</i><b>${pesos(anio)}</b><small>${pct(anio, tIng)} % de lo cobrado te quedó</small></div>
      <div class="num"><i>Por cobrar</i><b>${pesos(suma(Finanzas.porCobrar(), m => aPesos(m.monto, m.moneda)))}</b><small>${Finanzas.porCobrar().filter(m => diasHasta(m.fecha) < 0).length} cuota(s) atrasada(s)</small></div>
      <div class="num"><i>Promedio por boda</i><b>${pesos(promedioPorBoda())}</b><small>lo que te deja cada boda</small></div>
    </div>
    <div class="cols c21">
      ${tarjeta('Mes a mes', `<div class="graf-anual">${meses.map(m => `<div class="ga-col" title="${conMayuscula(mesNombre(m.k))}: cobrado ${pesos(m.cobrado)}, gastos ${pesos(m.pagado)}">
          <b class="ga-res ${m.resultado < 0 ? 'mal-t' : ''}">${m.resultado ? (m.resultado / 1000).toFixed(1) + 'k' : ''}</b>
          <div class="ga-barras"><i style="height:${(m.cobrado / max * 100).toFixed(1)}%"></i><i class="g" style="height:${(m.pagado / max * 100).toFixed(1)}%"></i></div>
          <span>${MESES_C[+m.k.slice(5) - 1]}</span></div>`).join('')}</div>
        <div class="mg-pie"><span><i class="mg-c"></i>Cobrado</span><span><i class="mg-c g"></i>Gastos</span><span class="suave">Arriba de cada mes: lo que te quedó (en miles de pesos)</span></div>`)}
      ${tarjeta('De dónde viene la plata', `<div class="dona-caja">${dona(Object.entries(ing).map(([k, l], i) => ({ v: suma(l, m => aPesos(m.monto, m.moneda)), c: tonosI[i % 4] })), 150, pesos(tIng))}
        <div class="dona-ley">${Object.entries(ing).map(([k, l], i) => `<div><i style="background:${tonosI[i % 4]}"></i><span>${esc(k)}</span><b>${pct(suma(l, m => aPesos(m.monto, m.moneda)), tIng)} %</b></div>`).join('')}</div></div>`)}
    </div>
    <div class="cols c2">
      ${tarjeta('Cobros y pagos que vienen', pend.length ? `<div class="renglones">${pend.map(m => { const b = m.bodaId && Store.obtener('bodas', m.bodaId); const atr = diasHasta(m.fecha) < 0; return `
        <div class="renglon clic" data-mov="${m.id}">${b ? `<span class="punto" style="background:${Boda.paleta(b)[0]}"></span>` : '<span class="punto" style="background:var(--borde)"></span>'}
          <div class="r-t"><b>${esc(m.detalle)}</b><small class="${atr ? 'mal-t' : ''}">${atr ? 'Atrasado · ' : ''}${conMayuscula(enPalabras(m.fecha))} · ${fechaDia(m.fecha)}</small></div>
          <b class="n ${m.tipo === 'ingreso' ? 'ok-t' : ''}">${m.tipo === 'ingreso' ? '+' : '−'} ${plata(m.monto, m.moneda)}</b>
          <button class="btn mini" data-cobrar="${m.id}">${m.tipo === 'ingreso' ? 'Cobrado' : 'Pagado'}</button></div>`; }).join('')}</div>` : vacio('✓', 'Nada pendiente'))}
      ${tarjeta('En qué gastás', `${ordenar(Object.entries(gas), ([, l]) => -suma(l, m => aPesos(m.monto, m.moneda))).map(([k, l]) => { const v = suma(l, m => aPesos(m.monto, m.moneda)); return `
        <div class="quien"><span>${esc(k)}</span>${barra(pct(v, tGas), 'var(--oro-claro)')}<b>${pesos(v)}</b></div>`; }).join('')}
        <p class="suave chico" style="margin-top:10px">Total de gastos en 12 meses: ${pesos(tGas)}</p>`)}
    </div>`;
}

function promedioPorBoda() {
  const hechas = Store.listar('bodas', b => diasHasta(b.fecha) < 0);
  return hechas.length ? suma(hechas, b => Boda.honorarios(b).ganancia) / hechas.length : 0;
}

function finMovimientos() {
  const meses = unicos(Store.listar('movimientos').map(m => clave(m.fecha))).reverse();
  if (!_finMes) _finMes = clave(iso(HOY()));
  const l = ordenar(Store.listar('movimientos', m => clave(m.fecha) === _finMes), m => m.fecha, true);
  const r = Finanzas.delMes(_finMes);
  return `<div class="filtros"><select id="fi-mes">${meses.map(k => `<option value="${k}" ${k === _finMes ? 'selected' : ''}>${conMayuscula(mesNombre(k))}</option>`).join('')}</select>
    <span class="cuenta">Cobrado ${pesos(r.cobrado)} · gastos ${pesos(r.pagado)} · <b>resultado ${pesos(r.resultado)}</b></span></div>
    <div class="tarjeta"><div class="tabla-marco"><table class="t">
      <thead><tr><th>Fecha</th><th>Detalle</th><th>Categoría</th><th class="n">Monto</th><th>Estado</th></tr></thead>
      <tbody>${l.map(m => `<tr class="clic" data-mov="${m.id}"><td>${fechaDia(m.fecha)}</td>
        <td class="titulo">${m.bodaId && Store.obtener('bodas', m.bodaId) ? `<span class="punto" style="background:${Boda.paleta(Store.obtener('bodas', m.bodaId))[0]};margin-right:6px"></span>` : ''}${esc(m.detalle)}</td>
        <td>${esc(m.cat)}</td><td class="n ${m.tipo === 'ingreso' ? 'ok-t' : ''}"><b>${m.tipo === 'ingreso' ? '+' : '−'} ${plata(m.monto, m.moneda)}</b></td>
        <td>${m.estado === 'pendiente' ? `<button class="btn mini" data-cobrar="${m.id}">${m.tipo === 'ingreso' ? 'Marcar cobrado' : 'Marcar pagado'}</button>` : chip(m.estado === 'cobrado' ? 'Cobrado' : 'Pagado')}</td></tr>`).join('')
      || `<tr><td colspan="5">${vacio('$', 'Sin movimientos este mes')}</td></tr>`}</tbody></table></div></div>`;
}

function finPorBoda() {
  const bodas = ordenar(Store.listar('bodas'), b => b.fecha, true);
  const filas = bodas.map(b => ({ b, h: Boda.honorarios(b), plan: Store.obtener('planes', b.plan) }));
  return `<div class="tarjeta"><div class="tabla-marco"><table class="t">
    <thead><tr><th>Boda</th><th>Plan</th><th class="n">Honorarios</th><th class="n">Cobrado</th><th class="n">Pendiente</th><th class="n">Equipo</th><th class="n">Gastos</th><th class="n">Te deja</th></tr></thead>
    <tbody>${filas.map(({ b, h, plan }) => `<tr class="clic" data-bo="${b.id}">
      <td class="titulo"><span class="punto" style="background:${Boda.paleta(b)[0]};margin-right:8px"></span><b>${esc(Boda.pareja(b))}</b><small class="d-b suave">${fecha(b.fecha)}</small></td>
      <td>${esc(plan?.nombre || '—')}</td><td class="n">${pesos(h.total)}</td><td class="n ok-t">${pesos(h.cobrado)}</td>
      <td class="n ${h.atrasado ? 'mal-t' : ''}">${h.pendiente ? pesos(h.pendiente) : '—'}</td>
      <td class="n">${h.equipo ? '− ' + pesos(h.equipo) : '—'}</td><td class="n">${h.gastos ? '− ' + pesos(h.gastos) : '—'}</td>
      <td class="n"><b>${pesos(h.ganancia)}</b> <small class="suave">${pct(h.ganancia, h.total)} %</small></td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td></td><td class="n">${pesos(suma(filas, f => f.h.total))}</td><td class="n">${pesos(suma(filas, f => f.h.cobrado))}</td>
      <td class="n">${pesos(suma(filas, f => f.h.pendiente))}</td><td class="n">− ${pesos(suma(filas, f => f.h.equipo))}</td><td class="n">− ${pesos(suma(filas, f => f.h.gastos))}</td>
      <td class="n">${pesos(suma(filas, f => f.h.ganancia))}</td></tr></tfoot></table></div></div>
    <p class="suave chico" style="margin-top:10px">«Te deja» = honorarios − lo que le pagás a tu equipo en esa boda − los gastos que cargaste a esa boda.</p>`;
}

function editarMovimiento(m, tipo) {
  const nuevo = !m;
  m = m || { fecha: iso(HOY()), tipo, cat: tipo === 'ingreso' ? 'Honorarios' : 'Materiales', detalle: '', bodaId: '', monto: 0, moneda: '$', estado: tipo === 'ingreso' ? 'cobrado' : 'pagado' };
  const bodas = ordenar(Store.listar('bodas'), b => b.fecha, true);
  const campos = [
    { n: 'detalle', e: 'Detalle', valor: m.detalle, req: true, ancho: 'ancho' },
    { n: 'cat', e: 'Categoría', tipo: 'select', ops: m.tipo === 'ingreso' ? CATS_INGRESO : CATS_GASTO, valor: m.cat },
    { n: 'bodaId', e: 'Boda', tipo: 'select', ops: [{ v: '', t: '— Ninguna —' }, ...bodas.map(b => ({ v: b.id, t: Boda.pareja(b) }))], valor: m.bodaId || '' },
    { n: 'monto', e: 'Monto', tipo: 'number', valor: m.monto },
    { n: 'moneda', e: 'Moneda', tipo: 'select', ops: [{ v: '$', t: 'Pesos' }, { v: 'USD', t: 'Dólares' }], valor: m.moneda },
    { n: 'fecha', e: 'Fecha', tipo: 'date', valor: m.fecha },
    { n: 'estado', e: 'Estado', tipo: 'select', ops: m.tipo === 'ingreso' ? [{ v: 'cobrado', t: 'Cobrado' }, { v: 'pendiente', t: 'Por cobrar' }] : [{ v: 'pagado', t: 'Pagado' }, { v: 'pendiente', t: 'Por pagar' }], valor: m.estado },
  ];
  modal({
    titulo: nuevo ? (m.tipo === 'ingreso' ? 'Nuevo ingreso' : 'Nuevo gasto') : 'Editar movimiento', ancho: 'ancho',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>`,
    acciones: [
      ...(!nuevo ? [{ texto: 'Borrar', clase: 's peligro', hacer: () => { if (!confirm('¿Borrar este movimiento?')) return false; Store.borrar('movimientos', m.id); repintar(); } }] : []),
      { texto: 'Cancelar', clase: 's' },
      { texto: 'Guardar', clase: 'p', hacer: f => {
        const v = leerFormulario(campos, f);
        if (!v.detalle || !v.monto) { aviso('Faltan el detalle o el monto', 'mal'); return false; }
        v.bodaId = v.bodaId || null;
        nuevo ? Store.crear('movimientos', Object.assign({ tipo: m.tipo }, v)) : Store.editar('movimientos', m.id, v);
        aviso('Guardado'); repintar();
      } },
    ],
  });
}


/* ===== js/17-equipo.js ===== */
/* ============================================================
   PANEL · EQUIPO
   La gente que trabaja con Vanessa (asistentes, coordinadoras,
   montaje…): a qué fiestas fue cada uno, cuánto se le pagó y cuánto
   se le debe. Al tocar «Pagar» queda anotado también en Finanzas.
   ============================================================ */

PANTALLAS.equipo = {
  t: 'Equipo',
  pintar(hoja) {
    const gente = Store.listar('equipo');
    const bodas = ordenar(Store.listar('bodas', b => diasHasta(b.fecha) > -200), b => b.fecha, true);
    const deuda = suma(gente, p => Equipo.dePersona(p.id).debe);
    hoja.innerHTML = encabezado('Equipo', 'Quién trabajó en cada fiesta, cuánto se le pagó y cuánto se le debe.',
      `<button class="btn" id="eq-nueva">＋ Persona</button><button class="btn p" id="eq-asig">＋ Asignar a una boda</button>`) + `
    ${deuda ? `<div class="aviso-banda">💛 Le debés ${pesos(deuda)} a tu equipo por fiestas que ya pasaron.</div>` : ''}
    <div class="equipo">${gente.map(p => {
      const e = Equipo.dePersona(p.id);
      return `<article class="eq-t" data-per="${p.id}" style="--c:${p.color}">
        <header><span class="avatar" style="background:${p.color}">${iniciales(p.nombre)}</span><div><b>${esc(p.nombre)}</b><small>${esc(p.rol)}</small></div></header>
        <div class="eq-nums"><div><b>${e.fiestas}</b><span>fiestas</span></div><div><b>${e.proximas}</b><span>próximas</span></div><div><b>${pesos(p.tarifa)}</b><span>por fiesta</span></div></div>
        <div class="eq-pie"><span>Pagado <b>${pesos(e.pagado)}</b></span>${e.debe ? `<span class="mal-t">Se le debe <b>${pesos(e.debe)}</b></span>` : '<span class="ok-t">Al día ✓</span>'}</div>
        ${p.notas ? `<p class="pt-nota">${esc(p.notas)}</p>` : ''}
        <footer><button class="btn mini" data-wa="${esc(p.wa)}" data-n="${esc(p.nombre.split(' ')[0])}">WhatsApp</button><button class="btn-txt" data-edit="${p.id}">Editar</button></footer>
      </article>`;
    }).join('')}</div>
    <div style="height:18px"></div>
    ${tarjeta('Fiesta por fiesta', `<div class="eq-bodas">${bodas.map(b => {
      const a = Store.listar('asignaciones', x => x.bodaId === b.id);
      const [c1] = Boda.paleta(b);
      return `<div class="eqb"><div class="eqb-b" data-bo="${b.id}"><span class="punto" style="background:${c1}"></span><div><b>${esc(Boda.pareja(b))}</b><small>${fecha(b.fecha)} · ${diasHasta(b.fecha) < 0 ? 'ya pasó' : enPalabras(b.fecha)}</small></div></div>
        <div class="eqb-gente">${a.map(x => { const p = Store.obtener('equipo', x.personaId); if (!p) return ''; const pasada = diasHasta(b.fecha) < 0; return `
          <div class="eqb-p ${x.pagado ? 'pagado' : pasada ? 'debe' : ''}"><span class="avatar" style="background:${p.color}">${iniciales(p.nombre)}</span>
            <span><b>${esc(p.nombre.split(' ')[0])}</b><small>${esc(x.rol)} · ${pesos(x.monto)}</small></span>
            ${x.pagado ? '<span class="chip ok">Pagado</span>' : pasada ? `<button class="btn mini" data-pagar="${x.id}">Pagar</button>` : '<span class="chip">Agendada</span>'}
            <button class="m-x mini" data-quitar="${x.id}" title="Quitar">×</button></div>`; }).join('') || '<span class="suave chico">Sin equipo asignado</span>'}
          <button class="btn mini s" data-asig="${b.id}">＋</button></div></div>`;
    }).join('')}</div>`)}`;

    $('#eq-nueva', hoja).onclick = () => fichaPersona(null);
    $('#eq-asig', hoja).onclick = () => asignar(null);
    $$('[data-edit]', hoja).forEach(x => x.onclick = () => fichaPersona(Store.obtener('equipo', x.dataset.edit)));
    $$('[data-wa]', hoja).forEach(x => x.onclick = () => whatsapp(x.dataset.wa, `¡Hola ${x.dataset.n}! Te escribo por una fiesta 😊`));
    $$('[data-asig]', hoja).forEach(x => x.onclick = () => asignar(x.dataset.asig));
    $$('[data-bo]', hoja).forEach(x => x.onclick = () => abrirBoda(x.dataset.bo));
    $$('[data-quitar]', hoja).forEach(x => x.onclick = () => { if (confirm('¿Quitar a esta persona de la fiesta?')) { Store.borrar('asignaciones', x.dataset.quitar); repintar(); } });
    $$('[data-pagar]', hoja).forEach(x => x.onclick = () => {
      const a = Store.obtener('asignaciones', x.dataset.pagar), p = Store.obtener('equipo', a.personaId), b = Store.obtener('bodas', a.bodaId);
      Store.editar('asignaciones', a.id, { pagado: true, pagadoEl: iso(HOY()) });
      Store.crear('movimientos', { fecha: iso(HOY()), tipo: 'egreso', cat: 'Equipo', detalle: `${p.nombre} · ${Boda.pareja(b)}`, bodaId: b.id, personaId: p.id, monto: a.monto, moneda: '$', estado: 'pagado' });
      aviso(`Pago a ${p.nombre.split(' ')[0]} registrado (también en Finanzas)`); repintar();
    });
  },
};

function fichaPersona(p) {
  const nueva = !p;
  p = p || { nombre: '', rol: 'Asistente', wa: '', tarifa: 3000, color: '#A8833A', notas: '' };
  const campos = [
    { n: 'nombre', e: 'Nombre', valor: p.nombre, req: true }, { n: 'rol', e: 'Qué hace', valor: p.rol },
    { n: 'wa', e: 'WhatsApp', valor: p.wa }, { n: 'tarifa', e: 'Paga por fiesta ($)', tipo: 'number', valor: p.tarifa },
    { n: 'color', e: 'Color', tipo: 'color', valor: p.color }, { n: 'notas', e: 'Notas', tipo: 'textarea', valor: p.notas, ancho: 'ancho' },
  ];
  modal({
    titulo: nueva ? 'Nueva persona' : p.nombre, ancho: 'ancho',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>`,
    acciones: [
      ...(!nueva ? [{ texto: 'Borrar', clase: 's peligro', hacer: () => { if (!confirm('¿Borrar a esta persona?')) return false; Store.borrar('equipo', p.id); repintar(); } }] : []),
      { texto: 'Cancelar', clase: 's' },
      { texto: 'Guardar', clase: 'p', hacer: f => { const v = leerFormulario(campos, f); if (!v.nombre) return false; nueva ? Store.crear('equipo', v) : Store.editar('equipo', p.id, v); repintar(); } },
    ],
  });
}

function asignar(bodaId) {
  const bodas = ordenar(Store.listar('bodas', b => diasHasta(b.fecha) > -60), b => b.fecha);
  const gente = Store.listar('equipo');
  const campos = [
    { n: 'bodaId', e: 'Boda', tipo: 'select', ops: bodas.map(b => ({ v: b.id, t: `${Boda.pareja(b)} · ${fechaDia(b.fecha)}` })), valor: bodaId || bodas.find(b => diasHasta(b.fecha) >= 0)?.id },
    { n: 'personaId', e: 'Persona', tipo: 'select', ops: gente.map(p => ({ v: p.id, t: `${p.nombre} · ${p.rol}` })), valor: gente[0]?.id },
    { n: 'rol', e: 'Qué va a hacer', valor: '', ph: 'Ej.: Recepción de invitados' },
    { n: 'monto', e: 'Se le paga ($)', tipo: 'number', valor: gente[0]?.tarifa },
  ];
  const m = modal({
    titulo: 'Asignar a una boda', cuerpo: `<div class="rejilla">${formulario(campos)}</div>`,
    acciones: [{ texto: 'Cancelar', clase: 's' }, { texto: 'Asignar', clase: 'p', hacer: f => {
      const v = leerFormulario(campos, f);
      if (Store.listar('asignaciones', a => a.bodaId === v.bodaId && a.personaId === v.personaId).length) { aviso('Esa persona ya está en esa boda', 'mal'); return false; }
      Store.crear('asignaciones', { ...v, rol: v.rol || Store.obtener('equipo', v.personaId).rol, horas: 10, pagado: false, pagadoEl: null });
      aviso('Asignado ✓'); repintar();
    } }],
  });
  $('#f-personaId', m.fondo).onchange = e => { $('#f-monto', m.fondo).value = Store.obtener('equipo', e.target.value)?.tarifa || 0; };
}

    $('#pr-nuevo', hoja).onclick = () => editarItem(null, b);
    $('#pr-pdf', hoja).onclick = () => imprimirPresupuestoBoda(b);
    $$('[data-item]', hoja).forEach(tr => tr.onclick = e => { if (e.target.closest('[data-pagar]')) return; editarItem(Store.obtener('items', tr.dataset.item), b); });
    $$('[data-pagar]', hoja).forEach(x => x.onclick = () => pagarItem(Store.obtener('items', x.dataset.pagar)));
  },
};

/* Gráfico de dona en SVG */
function dona(partes, tam = 160, centro = '') {
  const total = suma(partes, p => p.v) || 1, r = tam / 2 - 14, C = 2 * Math.PI * r;
  let ac = 0;
  return `<svg class="dona" width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}">
    ${partes.map(p => { const l = p.v / total * C; const s = `<circle cx="${tam / 2}" cy="${tam / 2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="22"
      stroke-dasharray="${Math.max(0, l - 1.5).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-ac).toFixed(1)}" transform="rotate(-90 ${tam / 2} ${tam / 2})"/>`; ac += l; return s; }).join('')}
    <text x="50%" y="47%" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="${tam / 9}" font-weight="600" fill="#2E2A26">${centro}</text>
    <text x="50%" y="60%" text-anchor="middle" font-family="Jost,sans-serif" font-size="10" letter-spacing="1.5" fill="#8E857A">TOTAL</text></svg>`;
}

function editarItem(i, b) {
  const nuevo = !i;
  i = i || { rubro: 'Catering', moneda: 'USD', estimado: 0, real: null, pagado: 0, paga: 'Novios' };
  const pr = i.provId ? Store.obtener('proveedores', i.provId) : null;
  const campos = [
    { n: 'rubro', e: 'Rubro', tipo: 'select', ops: [...RUBROS.map(r => r.n), 'Recuerdos', 'Otros'], valor: i.rubro },
    { n: 'prov', e: 'Proveedor', tipo: 'sugerido', valor: pr?.nombre || '', ops: Store.listar('proveedores').map(p => p.nombre), ph: 'Elegí de tu lista o escribí' },
    { n: 'detalle', e: 'Detalle', valor: i.detalle, ancho: 'ancho', ph: 'Ej.: menú de 4 pasos para 170 personas' },
    { n: 'moneda', e: 'Moneda', tipo: 'select', ops: [{ v: 'USD', t: 'Dólares (US$)' }, { v: '$', t: 'Pesos ($)' }], valor: i.moneda },
    { n: 'paga', e: '¿Quién lo paga?', tipo: 'select', ops: ['Novios', 'Familia de la novia', 'Familia del novio', 'Regalo'], valor: i.paga },
    { n: 'estimado', e: 'Estimado', tipo: 'number', valor: i.estimado },
    { n: 'real', e: 'Precio real (cuando se confirma)', tipo: 'number', valor: i.real },
    { n: 'pagado', e: 'Pagado hasta ahora', tipo: 'number', valor: i.pagado },
    { n: 'vence', e: 'Próximo vencimiento', tipo: 'date', valor: i.vence },
  ];
  modal({
    titulo: nuevo ? 'Nuevo ítem del presupuesto' : 'Editar ítem', ancho: 'ancho',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>`,
    acciones: [
      ...(!nuevo ? [{ texto: 'Borrar', clase: 's peligro', hacer: () => { if (!confirm('¿Borrar este ítem?')) return false; Store.borrar('items', i.id); repintar(); } }] : []),
      { texto: 'Cancelar', clase: 's' },
      { texto: 'Guardar', clase: 'p', hacer: f => {
        const v = leerFormulario(campos, f);
        const p = Store.listar('proveedores', x => x.nombre === v.prov)[0];
        const datos = { rubro: p?.rubro || v.rubro, provId: p?.id || null, detalle: v.detalle || (!p ? v.prov : ''), moneda: v.moneda, paga: v.paga,
          estimado: v.estimado || 0, real: v.real || null, pagado: v.pagado || 0, vence: v.vence || null };
        nuevo ? Store.crear('items', Object.assign({ bodaId: b.id }, datos)) : Store.editar('items', i.id, datos);
        aviso('Presupuesto actualizado'); repintar();
      } },
    ],
  });
}

function pagarItem(i) {
  const falta = (i.real || i.estimado) - (i.pagado || 0);
  const campos = [
    { n: 'monto', e: `Monto (${i.moneda === 'USD' ? 'US$' : '$'})`, tipo: 'number', valor: falta },
    { n: 'vence', e: 'Si queda saldo, próximo vencimiento', tipo: 'date', valor: i.vence },
  ];
  modal({
    titulo: 'Registrar un pago · ' + nombreItem(i),
    cuerpo: `<p class="suave">Falta pagar ${plata(falta, i.moneda)}.</p><div class="rejilla">${formulario(campos)}</div>`,
    acciones: [{ texto: 'Cancelar', clase: 's' }, { texto: 'Registrar', clase: 'p', hacer: f => {
      const v = leerFormulario(campos, f);
      const pagado = (i.pagado || 0) + (v.monto || 0);
      Store.editar('items', i.id, { pagado, vence: pagado >= (i.real || i.estimado) ? null : v.vence });
      aviso('Pago registrado ✓'); repintar();
    } }],
  });
}


/* ===== js/22-boda-proveedores.js ===== */
/* ============================================================
   BODA · PROVEEDORES
   Los proveedores de ESTA boda, tomados de la base de datos de
   Vanessa. Cada uno con su estado (a cotizar → reservado →
   contratado → pagado), su hora de llegada el día de la boda y
   lo que cuesta según el presupuesto.
   ============================================================ */

const ESTADOS_BPROV = ['A cotizar', 'Reservado', 'Contratado', 'Pagado'];
const RUBROS_CLAVE = ['Salón o estancia', 'Catering', 'Fotografía', 'DJ y sonido', 'Flores y ambientación', 'Torta y mesa dulce', 'Maquillaje y peinado'];

PANTALLAS['b-bprov'] = {
  t: 'Proveedores',
  pintar(hoja) {
    const b = bodaAbierta();
    const lista = Store.deBoda('bprov', b.id).map(x => ({ x, p: Store.obtener('proveedores', x.provId) })).filter(z => z.p);
    const faltan = RUBROS_CLAVE.filter(r => !lista.some(z => z.p.rubro === r));
    const items = Store.deBoda('items', b.id);
    const cuenta = e => lista.filter(z => z.x.estado === e).length;

    hoja.innerHTML = encabezado('Proveedores de la boda', 'Quién hace cada cosa, en qué estado está y a qué hora llega el día de la boda.',
      `<button class="btn p" id="bpv-nuevo">＋ Sumar proveedor</button>`) + `
    <div class="pipeline-mini">${ESTADOS_BPROV.map((e, i) => `<div class="pm-paso ${claseEstado(e)}"><b>${cuenta(e)}</b><span>${e}</span>${i < 3 ? '<i>›</i>' : ''}</div>`).join('')}</div>
    ${faltan.length ? `<div class="sugerencia">✦ Todavía falta: ${faltan.map(r => `<button class="chip" data-rubro="${esc(r)}">${iconoRubro(r)} ${esc(r)}</button>`).join(' ')}</div>` : ''}
    <div class="prov-grilla">${ordenar(lista, z => RUBROS.findIndex(r => r.n === z.p.rubro)).map(({ x, p }) => {
      const it = items.filter(i => i.provId === p.id);
      const costo = suma(it, i => i.real || i.estimado), pag = suma(it, i => i.pagado || 0), mon = it[0]?.moneda || 'USD';
      return `<article class="prov-t">
        <header><span class="pt-ic">${iconoRubro(p.rubro)}</span><div><small>${esc(p.rubro)}</small><b>${esc(p.nombre)}</b></div></header>
        <div class="pt-estados">${ESTADOS_BPROV.map(e => `<button class="${x.estado === e ? 'on ' + claseEstado(e) : ''}" data-bp="${x.id}" data-est="${e}">${e}</button>`).join('')}</div>
        <div class="pt-datos">
          ${costo ? `<div><span>Costo</span><b>${plata(costo, mon)}</b></div><div><span>Pagado</span><b class="ok-t">${plata(pag, mon)}</b></div>` : '<div><span>Costo</span><b class="suave">sin cargar</b></div>'}
          <div><span>Llega</span><b>${x.llegada ? esc(x.llegada) + ' h' : '—'}</b></div>
          <div><span>Contacto</span><b>${esc(p.contacto || '—')}</b></div>
        </div>
        ${p.notas && !vistaNovios() ? `<p class="pt-nota" title="Nota tuya: los novios no la ven">🔒 ${esc(p.notas)}</p>` : ''}
        <footer><button class="btn mini" data-wa="${esc(p.wa)}" data-n="${esc(p.contacto || '')}">WhatsApp</button>
          <a class="btn mini" href="https://instagram.com/${esc(p.ig.replace('@', ''))}" target="_blank" rel="noopener">Instagram</a>
          <button class="btn-txt" data-edit="${x.id}">Editar</button></footer>
      </article>`;
    }).join('') || vacio('✦', 'Todavía no hay proveedores', 'Sumalos desde tu base de datos.')}</div>`;

    $('#bpv-nuevo', hoja).onclick = () => sumarProveedorBoda(b);
    $$('[data-rubro]', hoja).forEach(x => x.onclick = () => sumarProveedorBoda(b, x.dataset.rubro));
    $$('[data-est]', hoja).forEach(x => x.onclick = () => { Store.editar('bprov', x.dataset.bp, { estado: x.dataset.est }); repintar(); });
    $$('[data-wa]', hoja).forEach(x => x.onclick = () => whatsapp(x.dataset.wa, `¡Hola ${x.dataset.n}! Te escribo por la boda de ${Boda.pareja(b)} (${fechaMedia(b.fecha)}).`));
    $$('[data-edit]', hoja).forEach(x => x.onclick = () => editarBprov(Store.obtener('bprov', x.dataset.edit)));
  },
};

function sumarProveedorBoda(b, rubro) {
  const ya = Store.deBoda('bprov', b.id).map(x => x.provId);
  const pers = Boda.personas(b.id).total || b.invitadosEst;
  const pintarLista = (r) => {
    const l = Store.listar('proveedores', p => !ya.includes(p.id) && (!r || p.rubro === r));
    return ordenar(l, p => -p.estrellas).map(p => { const [mi, ma] = rangoProveedor(p, pers); return `
      <button class="elegir-prov" data-p="${p.id}"><span class="pt-ic">${iconoRubro(p.rubro)}</span>
        <span class="ep-t"><b>${esc(p.nombre)}</b><small>${esc(p.rubro)} · ${esc(p.ciudad)} · ${estrellas(p.estrellas)}</small></span>
        <span class="ep-p">${dolares(mi)} – ${dolares(ma)}<small>${p.unidad === 'por persona' ? `para ${pers} personas` : 'por evento'}</small></span></button>`; }).join('') || vacio('✦', 'No hay más proveedores de ese rubro');
  };
  const m = modal({
    titulo: 'Sumar un proveedor a la boda', ancho: 'ancho',
    cuerpo: `<div class="filtros"><select id="sp-r"><option value="">Todos los rubros</option>${RUBROS.map(r => `<option ${r.n === rubro ? 'selected' : ''}>${r.n}</option>`).join('')}</select>
      <span class="cuenta">Precios aproximados de tu base de datos</span></div><div id="sp-l" class="elegir-lista">${pintarLista(rubro)}</div>`,
  });
  const enganchar = () => $$('[data-p]', m.fondo).forEach(x => x.onclick = () => {
    const p = Store.obtener('proveedores', x.dataset.p);
    Store.crear('bprov', { bodaId: b.id, provId: p.id, rubro: p.rubro, estado: 'A cotizar', llegada: '' });
    const [mi, ma] = rangoProveedor(p, pers);
    Store.crear('items', { bodaId: b.id, rubro: p.rubro, provId: p.id, detalle: '', estimado: Math.round((mi + ma) / 2), real: null, pagado: 0, moneda: 'USD', vence: null, paga: 'Novios' });
    m.cerrar(); aviso(`${p.nombre} se sumó a la boda (y al presupuesto, con un estimado)`); repintar();
  });
  $('#sp-r', m.fondo).onchange = e => { $('#sp-l', m.fondo).innerHTML = pintarLista(e.target.value); enganchar(); };
  enganchar();
}

function editarBprov(x) {
  const p = Store.obtener('proveedores', x.provId);
  const campos = [
    { n: 'estado', e: 'Estado', tipo: 'select', ops: ESTADOS_BPROV, valor: x.estado },
    { n: 'llegada', e: 'Hora de llegada el día de la boda', tipo: 'time', valor: x.llegada },
  ];
  modal({
    titulo: p.nombre, cuerpo: `<div class="rejilla">${formulario(campos)}</div>`,
    acciones: [
      { texto: 'Quitar de la boda', clase: 's peligro', hacer: () => { if (!confirm('¿Quitar este proveedor de la boda?')) return false; Store.borrar('bprov', x.id); repintar(); } },
      { texto: 'Guardar', clase: 'p', hacer: f => { Store.editar('bprov', x.id, leerFormulario(campos, f)); repintar(); } },
    ],
  });
}


/* ===== js/23-boda-invitados.js ===== */
/* ============================================================
   BODA · INVITADOS
   Por familia o pareja: grupo, lado (novia / novio / ambos),
   adultos y niños, restricciones de comida, mesa y confirmación.
   Incluye el formulario de confirmación que llenarían los invitados
   (en la demostración se simula acá mismo) y los recordatorios por
   WhatsApp para los que no respondieron.
   ============================================================ */

let _invFiltro = { txt: '', grupo: '', estado: '' };

PANTALLAS['b-invitados'] = {
  t: 'Invitados',
  pintar(hoja) {
    const b = bodaAbierta();
    const todos = Store.deBoda('invitados', b.id);
    const p = Boda.personas(b.id);
    const grupos = unicos(todos.map(i => i.grupo));
    let lista = todos;
    if (_invFiltro.txt) lista = lista.filter(i => contiene(i.nombre + ' ' + i.grupo, _invFiltro.txt));
    if (_invFiltro.grupo) lista = lista.filter(i => i.grupo === _invFiltro.grupo);
    if (_invFiltro.estado) lista = lista.filter(i => i.estado === _invFiltro.estado);
    const porGrupo = agrupar(ordenar(lista, i => i.nombre), i => i.grupo);
    const mesas = Store.deBoda('mesas', b.id);
    const nomMesa = id => { const m = mesas.find(x => x.id === id); return m ? etiquetaMesa(m, b) : ''; };
    const restr = {};
    p.restricciones.forEach(i => i.restr.forEach(r => { restr[r] = (restr[r] || 0) + i.adultos + i.ninos; }));
    const limite = b.limiteRSVP || sumarDias(b.fecha, -30);

    hoja.innerHTML = encabezado('Invitados', `Fecha límite para confirmar: <b>${conMayuscula(fechaMedia(limite))}</b>
      ${diasHasta(limite) >= 0 ? `(${enPalabras(limite)})` : '<span class="mal-t">(ya pasó)</span>'} · <button class="btn-txt" id="inv-limite">cambiar</button>`,
      `<button class="btn" id="inv-listado">☰ Listado con mesas</button><button class="btn" id="inv-rsvp">✉ Formulario de confirmación</button><button class="btn" id="inv-rec">🔔 Recordar a los pendientes</button><button class="btn p" id="inv-nuevo">＋ Invitado</button>`) + `
    <div class="nums">
      <div class="num acento"><i>Personas</i><b>${p.total}</b><small>${p.adultos} adultos · ${p.ninos} niños · ${p.familias} invitaciones</small></div>
      <div class="num ok"><i>Confirmados</i><b>${p.confirmados}</b><small>${pct(p.confirmados, p.total)} % de los invitados</small>${barra(pct(p.confirmados, p.total), 'var(--ok)')}</div>
      <div class="num"><i>Sin responder</i><b>${p.pendientes}</b><small>${todos.filter(i => i.estado === 'Pendiente').length} invitaciones</small></div>
      <div class="num"><i>No vienen</i><b>${p.noVienen}</b><small>ya avisaron</small></div>
    </div>
    <div class="cols c21">
      <div>
        <div class="filtros">
          <input type="search" class="crece" id="inv-txt" placeholder="Buscar invitado…" value="${esc(_invFiltro.txt)}">
          <select id="inv-grupo"><option value="">Todos los grupos</option>${grupos.map(g => `<option ${_invFiltro.grupo === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>
          <div class="solapas" id="inv-est">${['', 'Confirmado', 'Pendiente', 'No viene'].map(e => `<button data-e="${e}" class="${_invFiltro.estado === e ? 'on' : ''}">${e || 'Todos'}</button>`).join('')}</div>
        </div>
        ${Object.entries(porGrupo).map(([g, l]) => `
          <section class="inv-grupo">
            <header><b>${esc(g)}</b><span>${l.length} invitaciones · ${suma(l, i => i.adultos)} adultos · ${suma(l, i => i.ninos)} niños</span><span class="chip">${esc(l[0].lado === 'Ambos' ? 'De los dos' : 'Lado de ' + (l[0].lado === 'Novia' ? b.novia : b.novio))}</span></header>
            ${l.map(i => `<div class="inv-fila" data-inv="${i.id}">
              <span class="avatar" style="background:${i.lado === 'Novia' ? 'var(--b1)' : i.lado === 'Novio' ? 'var(--b2)' : 'var(--tinta3)'}">${iniciales(i.nombre.replace(/^Familia /, ''))}</span>
              <div class="if-t"><b>${esc(i.nombre)}</b><small>${i.adultos} ad.${i.ninos ? ` · ${i.ninos} niño${i.ninos > 1 ? 's' : ''}` : ''}${i.mesaId ? ` · ◎ ${esc(nomMesa(i.mesaId))}` : ''}
                ${i.restr?.map(r => `<span class="chip pronto">${esc(r)}</span>`).join('') || ''}</small></div>
              <div class="seg">${['Confirmado', 'Pendiente', 'No viene'].map(e => `<button data-est="${e}" class="${i.estado === e ? 'on ' + claseEstado(e) : ''}" title="${e}">${e === 'Confirmado' ? '✓' : e === 'Pendiente' ? '?' : '✕'}<span>${e}</span></button>`).join('')}</div>
            </div>`).join('')}
          </section>`).join('') || vacio('✉', 'No hay invitados con ese filtro')}
      </div>
      <div>
        ${tarjeta('Para el catering', `<div class="renglones">
          <div class="renglon"><div class="r-t"><b>Menú adulto</b></div><b>${p.adultos - suma(p.restricciones, i => i.adultos)}</b></div>
          <div class="renglon"><div class="r-t"><b>Menú infantil</b></div><b>${p.ninos}</b></div>
          ${Object.entries(restr).map(([r, n]) => `<div class="renglon"><div class="r-t"><b>${esc(r)}</b></div><b>${n}</b></div>`).join('')}</div>
          <button class="btn mini" id="inv-copiar" style="margin-top:10px">Copiar para mandar</button>`)}
        <div style="height:18px"></div>
        ${tarjeta('Por lado', ['Novia', 'Novio', 'Ambos'].map(l => { const x = todos.filter(i => i.lado === l && i.estado !== 'No viene'); const n = suma(x, i => i.adultos + i.ninos); return `
          <div class="quien"><span>${l === 'Ambos' ? 'De los dos' : 'De ' + (l === 'Novia' ? b.novia : b.novio)}</span>${barra(pct(n, p.total), l === 'Novio' ? 'var(--b2)' : 'var(--b1)')}<b>${n}</b></div>`; }).join(''))}
      </div>
    </div>`;

    const txt = $('#inv-txt', hoja);
    txt.oninput = () => { _invFiltro.txt = txt.value; const pos = txt.selectionStart; repintar(); const n = $('#inv-txt'); n.focus(); n.setSelectionRange(pos, pos); };
    $('#inv-grupo', hoja).onchange = e => { _invFiltro.grupo = e.target.value; repintar(); };
    $$('#inv-est button', hoja).forEach(x => x.onclick = () => { _invFiltro.estado = x.dataset.e; repintar(); });
    $$('.inv-fila', hoja).forEach(f => f.onclick = e => {
      const est = e.target.closest('[data-est]');
      if (est) { Store.editar('invitados', f.dataset.inv, { estado: est.dataset.est }); return repintar(); }
      editarInvitado(Store.obtener('invitados', f.dataset.inv), b);
    });
    $('#inv-nuevo', hoja).onclick = () => editarInvitado(null, b);
    $('#inv-rsvp', hoja).onclick = () => formularioRSVP(b);
    $('#inv-listado', hoja).onclick = () => listadoMesas(b);
    $('#inv-rec', hoja).onclick = () => recordarPendientes(b);
    $('#inv-limite', hoja).onclick = async () => {
      const v = await pedirTexto({ titulo: 'Fecha límite para confirmar', tipo: 'date', valor: limite });
      if (v) { Store.editar('bodas', b.id, { limiteRSVP: v }); repintar(); }
    };
    $('#inv-copiar', hoja).onclick = () => {
      const t = `Boda ${Boda.pareja(b)} · ${fechaMedia(b.fecha)}\nMenú adulto: ${p.adultos - suma(p.restricciones, i => i.adultos)}\nMenú infantil: ${p.ninos}\n`
        + Object.entries(restr).map(([r, n]) => `${r}: ${n}`).join('\n');
      navigator.clipboard?.writeText(t).then(() => aviso('Copiado: pegalo en el WhatsApp del catering'), () => aviso('No se pudo copiar', 'mal'));
    };
  },
};

function editarInvitado(i, b) {
  const nuevo = !i;
  i = i || { nombre: '', grupo: '', lado: 'Novia', adultos: 2, ninos: 0, estado: 'Pendiente', restr: [], tel: '' };
  const grupos = unicos(Store.deBoda('invitados', b.id).map(x => x.grupo));
  const campos = [
    { n: 'nombre', e: 'Nombre (familia, pareja o persona)', valor: i.nombre, req: true, ancho: 'ancho', ph: 'Ej.: Familia Pereira · Ana y Luis' },
    { n: 'grupo', e: 'Grupo', tipo: 'sugerido', ops: grupos, valor: i.grupo },
    { n: 'lado', e: 'Lado', tipo: 'select', ops: [{ v: 'Novia', t: 'De ' + b.novia }, { v: 'Novio', t: 'De ' + b.novio }, { v: 'Ambos', t: 'De los dos' }], valor: i.lado },
    { n: 'adultos', e: 'Adultos', tipo: 'number', valor: i.adultos },
    { n: 'ninos', e: 'Niños', tipo: 'number', valor: i.ninos },
    { n: 'estado', e: 'Confirmación', tipo: 'select', ops: ['Pendiente', 'Confirmado', 'No viene'], valor: i.estado },
    { n: 'tel', e: 'WhatsApp', valor: i.tel },
  ];
  modal({
    titulo: nuevo ? 'Nuevo invitado' : i.nombre,
    cuerpo: `<div class="rejilla">${formulario(campos)}</div><div class="campo"><span>Restricciones de comida</span>
      <div class="chips-op">${RESTRICCIONES.map(r => `<label><input type="checkbox" value="${r}" ${i.restr?.includes(r) ? 'checked' : ''}><span>${r}</span></label>`).join('')}</div></div>`,
    acciones: [
      ...(!nuevo ? [{ texto: 'Borrar', clase: 's peligro', hacer: () => { if (!confirm('¿Borrar este invitado?')) return false; Store.borrar('invitados', i.id); repintar(); } }] : []),
      { texto: 'Cancelar', clase: 's' },
      { texto: 'Guardar', clase: 'p', hacer: f => {
        const v = leerFormulario(campos, f);
        if (!v.nombre) { aviso('Falta el nombre', 'mal'); return false; }
        v.restr = $$('.chips-op input:checked', f).map(x => x.value);
        v.adultos = v.adultos || 0; v.ninos = v.ninos || 0; v.grupo = v.grupo || 'Otros';

        aviso('Invitados actualizados'); repintar();
      } },
    ],
  });
}

/* ===== js/24-salon.js ===== */
/* ============================================================
   BODA · SALÓN Y MESAS  (la estrella de la demostración)
   ------------------------------------------------------------
   Un plano a escala, en metros, dibujado en SVG:
   · la forma del salón (rectangular, en L, con galería o con jardín)
   · los elementos (pista, DJ, mesa principal, barra, living…)
   · las mesas (redonda, cuadrada, rectangular, imperial, ovalada)
     con su estilo: mantel, camino, centro de mesa y sillas.
   Todo se arrastra con el mouse o con el dedo. Las familias se sientan
   arrastrándolas a una mesa (o tocando la familia y después la mesa).
   El dibujo de cada mesa está en 25-salon-dibujo.js.
   ============================================================ */

let _sel = null;          // { tipo: 'mesa' | 'elem', id }
let _pick = null;         // id del invitado elegido para sentar
let _zoom = 1;
let _vistaSalon = 'plano';

PANTALLAS['b-salon'] = {
  t: 'Salón y mesas',
  pintar(hoja) {
    const b = bodaAbierta();
    const mesas = Store.deBoda('mesas', b.id);

    const cap = suma(mesas, m => m.cap);
    const sentados = suma(inv.filter(i => i.mesaId), i => i.adultos + i.ninos);
    const sinMesa = inv.filter(i => !i.mesaId);
    const forma = FORMAS_SALON.find(f => f.id === b.salon.forma)?.t;

      `<button class="btn" id="sl-listado">☰ Listado con mesas</button><button class="btn" id="sl-cartel">⎙ Cartel de ubicación</button><button class="btn" id="sl-pdf">⎙ Plano en PDF</button>`) + `

/* ---------- Ayudas ---------- */
const nombreMesa = (m, b) => m.nombre || (NOMBRES_MESA[b.salon.nombres] || NOMBRES_MESA.numeros)(m.num);
/* Número + nombre: «Mesa 3 · Jazmín» (o solo «Mesa 3» si no tiene otro nombre) */
const etiquetaMesa = (m, b) => { const n = nombreMesa(m, b); return n === 'Mesa ' + m.num ? n : `Mesa ${m.num} · ${n}`; };
/* Versión corta para el plano: «3 · Jazmín» */
const etiquetaCorta = (m, b) => { const n = nombreMesa(m, b); return n === 'Mesa ' + m.num ? n : `${m.num} · ${n}`; };
const ocupados = m => suma(Store.listar('invitados', i => i.mesaId === m.id), i => i.adultos + i.ninos);
const iconoForma = f => ({ redonda: '●', cuadrada: '■', rect: '▬', imperial: '━', oval: '⬮' }[f] || '●');

/* Color de cada grupo de invitados (para ver en el plano quién es quién) */
function coloresGrupos(b) {
  const [c1, c2] = Boda.paleta(b);
  const base = [c1, c2, '#5E6B47', '#56769A', '#B3787D', '#C28A55', '#76689A', '#6F8B78', '#8C5A6E', '#4F7C82', '#A8833A', '#B0603C'];
  const tonos = unicos(base.map(c => c.toUpperCase()));
  const grupos = unicos(Store.deBoda('invitados', b.id).map(i => i.grupo));
  const r = {};
  grupos.forEach((g, i) => { r[g] = tonos[i % tonos.length]; });
  return r;
}

        <label class="campo"><span>Lugares</span><input type="number" id="slp-cap" min="2" max="30" value="${m.cap}"></label>
      </div>
      <div class="slp-rot"><span>Girar</span><button class="btn mini" data-rot="-15">↺ 15°</button><button class="btn mini" data-rot="15">↻ 15°</button><button class="btn mini" data-rot="90">90°</button></div>

    $('#slp-gral')?.addEventListener('click', () => guardar({ estilo: null }));

/* ---------- Arrastrar mesas y elementos dentro del plano ---------- */
function puntoSVG(svg, e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
const redondo = v => Math.round(v * 10) / 10;

function engancharLienzo(b) {
  const svg = $('#sl-svg');
  if (!svg) return;
  let arr = null;
  svg.addEventListener('pointerdown', e => {
    const g = e.target.closest('[data-obj]');
    if (!g) { if (_sel || _pick) { _sel = null; _pick = null; repintar(); } return; }
    const [tipo, id] = g.dataset.obj.split(':');
    const obj = Store.obtener(tipo === 'mesa' ? 'mesas' : 'elementos', id);
    const p = puntoSVG(svg, e);
    arr = { g, tipo, id, obj, x0: obj.x, y0: obj.y, px: p.x, py: p.y, movio: false };
    svg.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  svg.addEventListener('pointermove', e => {
    if (!arr) return;
    const p = puntoSVG(svg, e);
    const dx = p.x - arr.px, dy = p.y - arr.py;
    if (!arr.movio && Math.hypot(dx, dy) < 0.12) return;
    arr.movio = true;
    const x = Math.max(0, Math.min(b.salon.ancho, redondo(arr.x0 + dx)));
    const y = Math.max(0, Math.min(b.salon.largo, redondo(arr.y0 + dy)));
    arr.nx = x; arr.ny = y;
    arr.g.setAttribute('transform', `translate(${x} ${y})`);
    arr.g.classList.add('moviendo');
  });
  const soltar = () => {
    if (!arr) return;
    const a = arr; arr = null;
    if (a.movio) {
      Store.editar(a.tipo === 'mesa' ? 'mesas' : 'elementos', a.id, { x: a.nx, y: a.ny });
      _sel = { tipo: a.tipo, id: a.id };
      return repintar();
    }
    if (a.tipo === 'mesa' && _pick) return sentarEn(_pick, a.obj, b);
    _sel = (_sel?.id === a.id) ? null : { tipo: a.tipo, id: a.id };
    repintar();
  };
  svg.addEventListener('pointerup', soltar);
  svg.addEventListener('pointercancel', () => { arr = null; repintar(); });
}

/* ---------- Arrastrar una familia hasta una mesa ---------- */
function engancharFamilias(b) {
  $$('[data-fam]').forEach(chip => {
    chip.addEventListener('pointerdown', e => {
      const id = chip.dataset.fam;
      const x0 = e.clientX, y0 = e.clientY;
      let fantasma = null, sobre = null;
      const mover = ev => {
        if (!fantasma && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 6) return;
        if (!fantasma) {
          fantasma = chip.cloneNode(true); fantasma.classList.add('fantasma'); document.body.appendChild(fantasma);
          document.body.classList.add('arrastrando');
        }
        fantasma.style.left = ev.clientX + 'px'; fantasma.style.top = ev.clientY + 'px';
        fantasma.style.display = 'none';
        const debajo = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-obj^="mesa:"]');
        fantasma.style.display = '';
        if (sobre !== debajo) { sobre?.classList.remove('destino'); sobre = debajo; sobre?.classList.add('destino'); }
      };
      const fin = () => {
        document.removeEventListener('pointermove', mover);
        document.removeEventListener('pointerup', fin);
        document.body.classList.remove('arrastrando');
        if (!fantasma) { _pick = _pick === id ? null : id; _sel = null; return repintar(); }
        fantasma.remove();
        if (sobre) sentarEn(id, Store.obtener('mesas', sobre.dataset.obj.split(':')[1]), b);
      };
      document.addEventListener('pointermove', mover);
      document.addEventListener('pointerup', fin);
      e.preventDefault();
    });
  });
}

function sentarEn(invId, m, b) {
  const i = Store.obtener('invitados', invId);
  const libre = m.cap - ocupados(m);
  const n = i.adultos + i.ninos;
  _pick = null;
  if (n > libre) { aviso(`En ${etiquetaMesa(m, b)} quedan ${libre} lugares y ${i.nombre} son ${n}`, 'mal'); return repintar(); }
  Store.editar('invitados', invId, { mesaId: m.id });
  aviso(`${i.nombre} → ${etiquetaMesa(m, b)} ✓`);
  repintar();
}
