/* ---------- Elegir paleta (se usa al crear y al editar) ---------- */
function selectorPaleta(actual) {
  const c = actual?.c || PALETAS[0].c;
  return `<div class="pal-grilla">${PALETAS.map((p, i) => `<button type="button" class="pal-op ${actual?.nombre === p.nombre ? 'on' : ''}" data-pal="${i}">
      <span class="pal-mues">${p.c.map(x => `<i style="background:${x}"></i>`).join('')}</span><b>${p.nombre}</b></button>`).join('')}</div>
    <div class="pal-propia"><span>O armala color por color:</span>
      ${['Principal', 'Acento', 'Suave', 'Fondo'].map((t, i) => `<label title="${t}"><input type="color" data-c="${i}" value="${c[i]}"><i>${t}</i></label>`).join('')}
    </div>`;
}
function engancharPaleta(ctx, alCambiar) {
  $$('.pal-op', ctx).forEach(b => b.onclick = () => {
    $$('.pal-op', ctx).forEach(x => x.classList.remove('on')); b.classList.add('on');
    const p = PALETAS[+b.dataset.pal];
    $$('[data-c]', ctx).forEach((inp, i) => { inp.value = p.c[i]; });
    alCambiar?.(leerPaleta(ctx));
  });
  $$('[data-c]', ctx).forEach(inp => inp.oninput = () => { $$('.pal-op', ctx).forEach(x => x.classList.remove('on')); alCambiar?.(leerPaleta(ctx)); });
}
function leerPaleta(ctx) {
  const c = $$('[data-c]', ctx).map(i => i.value.toUpperCase());
  const igual = PALETAS.find(p => p.c.join() === c.join());
  return { nombre: igual?.nombre || 'Paleta propia', c };
}

/* ---------- Nueva boda ---------- */
function nuevaBoda(desdeCliente) {
  const cl = desdeCliente || {};
  const [novia, novio] = (cl.nombre || '').split('&').map(s => s.trim());
  const planes = ordenar(Store.listar('planes'), p => p.orden);
  const elegido = Store.obtener('planes', cl.planId) || planes.find(p => p.destacado) || planes[0];
  const campos = [
    { tipo: 'titulo', texto: 'La pareja' },
    { n: 'novia', e: 'Nombre (1)', valor: novia || '', req: true, ph: 'Camila' },
    { n: 'apNovia', e: 'Apellido', valor: '' },
    { n: 'novio', e: 'Nombre (2)', valor: novio || '', req: true, ph: 'Santiago' },
    { n: 'apNovio', e: 'Apellido', valor: '' },
    { tipo: 'titulo', texto: 'La boda' },
    { n: 'fecha', e: 'Fecha', tipo: 'date', valor: cl.fechaTent || sumarMeses(iso(HOY()), 12), req: true },
    { n: 'hora', e: 'Hora', tipo: 'time', valor: '19:00' },
    { n: 'lugar', e: 'Salón o lugar', valor: '', ph: 'A definir', tipo: 'sugerido', ops: Store.listar('proveedores', p => p.rubro === 'Salón o estancia').map(p => p.nombre) },
    { n: 'ciudad', e: 'Ciudad', valor: cl.ciudad || 'Rivera' },
    { n: 'invitadosEst', e: 'Invitados (estimado)', tipo: 'number', valor: cl.invitados || 150 },
    { n: 'estilo', e: 'Estilo', tipo: 'select', ops: ESTILOS_BODA, valor: 'Clásica' },
    { n: 'plan', e: 'Plan contratado', tipo: 'select', ops: planes.map(p => ({ v: p.id, t: `${p.nombre} · ${pesos(p.precio)}` })), valor: elegido?.id },
    { n: 'honorario', e: 'Honorarios ($)', tipo: 'number', valor: desdeCliente?.honorario || elegido?.precio || 0 },
    { n: 'tareas', e: 'Cargar la lista de tareas modelo (26 tareas por etapa)', tipo: 'checkbox', valor: true, ancho: 'ancho' },
  ];
  const m = modal({
    titulo: 'Nueva boda', ancho: 'ancho',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>
      <h4 class="f-sep">La paleta de la boda</h4>
      <p class="suave chico" style="margin-top:-4px">Toda la página de esta boda se va a teñir con estos colores, también el PDF y lo que ven los novios.</p>
      <div id="nb-pal">${selectorPaleta(PALETAS[1])}</div>
      <div class="nb-vista" id="nb-vista"></div>`,
    acciones: [
      { texto: 'Cancelar', clase: 's' },
      { texto: 'Crear la boda', clase: 'p', hacer: f => {
        const v = leerFormulario(campos, f);
        if (!v.novia || !v.novio || !v.fecha) { aviso('Faltan los nombres o la fecha', 'mal'); return false; }
        const b = crearBoda(v, leerPaleta($('#nb-pal', f)), cl);
        aviso('¡Boda creada! ♡');
        setTimeout(() => abrirBoda(b.id), 200);
      } },
    ],
  });
  const vista = () => {
    const p = leerPaleta($('#nb-pal', m.fondo));
    const n1 = $('#f-novia', m.fondo).value || 'Camila', n2 = $('#f-novio', m.fondo).value || 'Santiago';
    $('#nb-vista', m.fondo).innerHTML = `<div class="nb-mini" style="background:linear-gradient(135deg,${p.c[0]},${p.c[1]})">
      <span class="script">${esc(n1)} &amp; ${esc(n2)}</span><small>${$('#f-fecha', m.fondo).value ? conMayuscula(fechaMedia($('#f-fecha', m.fondo).value)) : ''}</small></div>`;
  };
  engancharPaleta($('#nb-pal', m.fondo), vista);
  ['#f-novia', '#f-novio', '#f-fecha'].forEach(s => $(s, m.fondo).addEventListener('input', vista));
  $('#f-plan', m.fondo).onchange = e => { const p = Store.obtener('planes', e.target.value); if (p) $('#f-honorario', m.fondo).value = p.precio; };
  vista();
}

function crearBoda(v, paleta, cliente = {}) {
  const b = Store.crear('bodas', {
    novia: v.novia, apNovia: v.apNovia, novio: v.novio, apNovio: v.apNovio, fecha: v.fecha, hora: v.hora || '19:00',
    lugar: v.lugar || 'A definir', ciudad: v.ciudad, ceremonia: '', invitadosEst: v.invitadosEst || 0, estilo: v.estilo,
    plan: v.plan, honorario: v.honorario || 0, paleta, frase: 'El mejor día de nuestras vidas está cada vez más cerca.',
    clienteId: cliente.id || null,
    acceso: { activo: false, usuario: '', clave: '', secciones: ['portada', 'invitados', 'salon', 'cronograma', 'inspiracion', 'tareas'] },
    salon: { forma: 'rect', ancho: 22, largo: 16, nombres: 'numeros', estilo: { mantel: 'c4', camino: 'lino', centro: 'bajo', silla: 'tiffany' } },
  });
  if (v.tareas) TAREAS_MODELO.forEach(([etapa, texto, resp, dias]) => {
    const f = sumarDias(v.fecha, -dias);
    Store.crear('tareas', { bodaId: b.id, etapa, texto, resp, fecha: diasHasta(f) < 0 ? iso(HOY()) : f, hecho: false });
  });
  /* Los elementos básicos del salón, para que el plano no arranque vacío */
  [['principal', 11, 1.4], ['pista', 11, 7], ['entrada', 11, 15.75]].forEach(([tipo, x, y]) => {
    const e = ELEMENTOS_SALON.find(z => z.tipo === tipo);
    Store.crear('elementos', { bodaId: b.id, tipo, x, y, w: e.w, h: e.h, rot: 0, nombre: e.t });
  });
  /* Honorarios: la seña para reservar la fecha (hoy) y el saldo unos días antes del evento */
  if (v.honorario) Sena.cuotas(v.fecha, v.honorario).forEach(c => Store.crear('movimientos', {
    fecha: c.fecha, tipo: 'ingreso', cat: 'Honorarios', detalle: `${c.t} · ${v.novia} & ${v.novio}`, bodaId: b.id,
    cuota: c.t === 'Saldo' ? 'saldo' : 'sena', monto: c.monto, moneda: '$', estado: 'pendiente' }));
  if (cliente.id) Store.editar('clientes', cliente.id, { etapa: 'Reservó', bodaId: b.id });
  return b;
}

/* ---------- Editar los datos de una boda ---------- */
function editarBoda(b) {
  const campos = [
    { n: 'novia', e: 'Nombre (1)', valor: b.novia, req: true }, { n: 'apNovia', e: 'Apellido', valor: b.apNovia },
    { n: 'novio', e: 'Nombre (2)', valor: b.novio, req: true }, { n: 'apNovio', e: 'Apellido', valor: b.apNovio },
    { n: 'fecha', e: 'Fecha', tipo: 'date', valor: b.fecha }, { n: 'hora', e: 'Hora', tipo: 'time', valor: b.hora },
    { n: 'lugar', e: 'Salón o lugar', valor: b.lugar }, { n: 'ciudad', e: 'Ciudad', valor: b.ciudad },
    { n: 'ceremonia', e: 'Ceremonia', valor: b.ceremonia, ancho: 'ancho' },
    { n: 'invitadosEst', e: 'Invitados (estimado)', tipo: 'number', valor: b.invitadosEst },
    { n: 'estilo', e: 'Estilo', tipo: 'select', ops: ESTILOS_BODA, valor: b.estilo },
    { n: 'frase', e: 'Frase de la portada', valor: b.frase, ancho: 'ancho' },
  ];
  const m = modal({
    titulo: 'Datos y paleta de la boda', ancho: 'ancho',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div><h4 class="f-sep">Paleta</h4><div id="eb-pal">${selectorPaleta(b.paleta)}</div>`,
    acciones: [
      { texto: 'Cancelar', clase: 's', hacer: () => aplicarPaleta(b) },
      { texto: 'Guardar', clase: 'p', hacer: f => {
        Store.editar('bodas', b.id, Object.assign(leerFormulario(campos, f), { paleta: leerPaleta($('#eb-pal', f)) }));
        aplicarPaleta(b); aviso('Boda actualizada'); repintar();
      } },
    ],
    alCerrar: () => aplicarPaleta(Store.obtener('bodas', b.id)),
  });
  /* Al tocar una paleta, la página entera cambia de color al instante */
  engancharPaleta($('#eb-pal', m.fondo), p => aplicarPaleta({ paleta: p }));
}


/* ===== js/12-calendario.js ===== */
/* ============================================================
   PANEL · CALENDARIO Y AGENDA
   · Mes: todas las bodas (con su color) y las reuniones, pruebas,
     degustaciones y pagos. Avisa si hay dos bodas el mismo fin de semana.
   · Agenda: lo que viene, semana por semana.
   · Temporada: las bodas del año, mes a mes.
   ============================================================ */

let _calVista = 'mes';
let _calMes = null;

/* Todo lo que pasa en un día: eventos de la agenda + bodas */
function cosasDelDia(f) {
  const ev = Store.listar('eventos', e => e.fecha === f).map(e => ({ ...e, clase: 'ev' }));
  const bo = Store.listar('bodas', b => b.fecha === f).map(b => ({ fecha: f, hora: b.hora, titulo: Boda.pareja(b), tipo: 'Boda', bodaId: b.id, lugar: b.lugar, clase: 'boda' }));
  return [...bo, ...ev].sort((a, b) => (a.clase === 'boda' ? '0' : '1').localeCompare(b.clase === 'boda' ? '0' : '1') || String(a.hora).localeCompare(String(b.hora)));
}
/* De quién es un evento: la boda o el cliente */
function deQuien(e) {
  if (e.bodaId) { const b = Store.obtener('bodas', e.bodaId); return b ? Boda.pareja(b) : ''; }
  if (e.clienteId) { const c = Store.obtener('clientes', e.clienteId); return c ? c.nombre : ''; }
  return '';
}

/* Fines de semana con más de una boda */
function choques() {
  const porFinde = agrupar(Store.listar('bodas', b => diasHasta(b.fecha) >= 0), b => { const d = aDate(b.fecha); d.setDate(d.getDate() - ((d.getDay() + 1) % 7)); return iso(d); });
  return Object.entries(porFinde).filter(([, l]) => l.length > 1);
}

PANTALLAS.calendario = {
  t: 'Calendario y agenda',
  pintar(hoja) {
    if (!_calMes) _calMes = clave(iso(HOY()));
    const ch = choques();
    hoja.innerHTML = encabezado('Calendario y agenda', 'Tus bodas, reuniones, pruebas y pagos, todo en un mismo lugar.',
      `<button class="btn p" id="cal-nuevo">＋ Agregar a la agenda</button>`) + `
      ${ch.map(([, l]) => `<div class="aviso-banda">⚠ Ojo: dos bodas el mismo fin de semana — ${l.map(b => `<b>${esc(Boda.pareja(b))}</b> (${fechaDia(b.fecha)})`).join(' y ')}. Revisá el equipo.</div>`).join('')}
      <div class="filtros"><div class="solapas" id="cal-v">
        <button data-v="mes" class="${_calVista === 'mes' ? 'on' : ''}">▦ Mes</button>
        <button data-v="agenda" class="${_calVista === 'agenda' ? 'on' : ''}">☰ Agenda</button>
        <button data-v="temporada" class="${_calVista === 'temporada' ? 'on' : ''}">♡ Temporada</button></div>
        <div class="cal-ley">${TIPOS_EVENTO.slice(0, 6).map(t => `<span><i style="background:${t.c}"></i>${t.n}</span>`).join('')}</div></div>
      <div id="cal-cuerpo"></div>`;
    const cuerpo = $('#cal-cuerpo', hoja);
    if (_calVista === 'mes') cuerpo.innerHTML = vistaMes();
    else if (_calVista === 'agenda') cuerpo.innerHTML = vistaAgenda();
    else cuerpo.innerHTML = vistaTemporada();

    $$('#cal-v button', hoja).forEach(x => x.onclick = () => { _calVista = x.dataset.v; repintar(); });
    $('#cal-nuevo', hoja).onclick = () => editarEvento(null, iso(HOY()));
    $$('[data-mes]', hoja).forEach(x => x.onclick = () => { _calMes = clave(sumarMeses(_calMes + '-01', +x.dataset.mes)); repintar(); });
    $('#cal-hoy', hoja)?.addEventListener('click', () => { _calMes = clave(iso(HOY())); repintar(); });
    $$('[data-dia]', hoja).forEach(x => x.onclick = e => { if (e.target.closest('[data-ev],[data-bo]')) return; verDia(x.dataset.dia); });
    $$('[data-ev]', hoja).forEach(x => x.onclick = () => editarEvento(Store.obtener('eventos', x.dataset.ev)));
    $$('[data-bo]', hoja).forEach(x => x.onclick = () => abrirBoda(x.dataset.bo));
  },
};

function vistaMes() {
  const k = _calMes, prim = aDate(k + '-01');
  const inicio = sumarDias(k + '-01', -((prim.getDay() + 6) % 7));
  const hoy = iso(HOY());
  let celdas = '';
  for (let i = 0; i < 42; i++) {
    const f = sumarDias(inicio, i);
    if (i >= 35 && clave(f) !== k) break;
    const cosas = cosasDelDia(f);
    celdas += `<div class="cal-d ${clave(f) !== k ? 'fuera' : ''} ${f === hoy ? 'hoy' : ''} ${esFinde(f) ? 'finde' : ''}" data-dia="${f}">
      <span class="cd-n">${aDate(f).getDate()}</span>
      ${cosas.slice(0, 4).map(c => {
        if (c.clase === 'boda') { const b = Store.obtener('bodas', c.bodaId), [c1, c2] = Boda.paleta(b);
          return `<button class="cal-boda" data-bo="${b.id}" style="background:linear-gradient(120deg,${c1},${c2})">♡ <span class="script">${esc(b.novia)} &amp; ${esc(b.novio)}</span></button>`; }
        const t = tipoEvento(c.tipo);
        return `<button class="cal-ev" data-ev="${c.id}" style="--t:${t.c}"><b>${esc(c.hora)}</b> ${esc(c.titulo)}</button>`;
      }).join('')}${cosas.length > 4 ? `<small class="cd-mas">+${cosas.length - 4} más</small>` : ''}</div>`;
  }
  return `<div class="tarjeta cal-mes"><div class="cal-cab">
      <button class="btn icono mini" data-mes="-1" aria-label="Mes anterior">‹</button>
      <h3>${conMayuscula(mesNombre(k))}</h3>
      <button class="btn icono mini" data-mes="1" aria-label="Mes siguiente">›</button>
      <button class="btn mini" id="cal-hoy">Hoy</button></div>
    <div class="cal-sem">${['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(d => `<span>${d}</span>`).join('')}</div>
    <div class="cal-grilla">${celdas}</div></div>`;
}

function vistaAgenda() {
  const hoy = iso(HOY());
  const cosas = [];
  for (let i = 0; i <= 90; i++) cosas.push(...cosasDelDia(sumarDias(hoy, i)));
  const lunes = f => { const d = aDate(f); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
  const semanas = agrupar(cosas, c => lunes(c.fecha));
  const lunHoy = lunes(hoy);
  const titulo = l => l === lunHoy ? 'Esta semana' : l === sumarDias(lunHoy, 7) ? 'La semana que viene' : 'Semana del ' + fechaDia(l);
  return Object.entries(semanas).map(([l, lista]) => `<section class="ag-sem"><h3>${titulo(l)}</h3>
    ${Object.entries(agrupar(lista, c => c.fecha)).map(([f, cs]) => `<div class="ag-dia">
      <div class="fecha-cubo ${f === hoy ? 'hoy' : ''}"><b>${aDate(f).getDate()}</b><i>${DIAS[aDate(f).getDay()].slice(0, 3)}</i></div>
      <div class="ag-items">${cs.map(c => {
        if (c.clase === 'boda') { const b = Store.obtener('bodas', c.bodaId), [c1, c2] = Boda.paleta(b);
          return `<button class="ag-boda" data-bo="${b.id}" style="background:linear-gradient(120deg,${c1},${c2})"><span class="script">${esc(b.novia)} &amp; ${esc(b.novio)}</span><small>¡Día de la boda! · ${esc(b.hora)} h · ${esc(b.lugar)}</small></button>`; }
        const t = tipoEvento(c.tipo), b = c.bodaId ? Store.obtener('bodas', c.bodaId) : null;
        return `<button class="ag-ev" data-ev="${c.id}"><span class="ev-ic" style="background:${t.c}1f;color:${t.c}">${t.ic}</span>
          <span class="ag-t"><b>${esc(c.titulo)}</b><small>${esc(c.hora)}${c.lugar ? ' · ' + esc(c.lugar) : ''}</small></span>
          ${deQuien(c) ? `<span class="chip" ${b ? `style="background:${Boda.paleta(b)[0]}1f;color:${mezclar(Boda.paleta(b)[0], '#000000', .2)}"` : ''}>${esc(deQuien(c))}</span>` : ''}</button>`;
      }).join('')}</div></div>`).join('')}</section>`).join('') || vacio('◷', 'Nada en los próximos tres meses');
}

function vistaTemporada() {
  const k0 = clave(iso(HOY()));
  const meses = Array.from({ length: 15 }, (_, i) => clave(sumarMeses(k0 + '-01', i)));
  const bodas = Store.listar('bodas');
  const max = Math.max(1, ...meses.map(k => bodas.filter(b => clave(b.fecha) === k).length));
  return `<div class="tarjeta"><div class="cuerpo"><div class="temporada">${meses.map(k => {
    const l = ordenar(bodas.filter(b => clave(b.fecha) === k), b => b.fecha);
    return `<div class="tm-mes ${l.length ? '' : 'libre'}"><div class="tm-n">${conMayuscula(MESES[+k.slice(5) - 1]).slice(0, 3)}<small>${k.slice(0, 4)}</small></div>
      <div class="tm-bodas">${l.map(b => { const [c1, c2] = Boda.paleta(b); return `<button data-bo="${b.id}" style="background:linear-gradient(120deg,${c1},${c2})">
        <b class="script">${esc(b.novia)} &amp; ${esc(b.novio)}</b><small>${fechaDia(b.fecha)} · ${esc(b.lugar)}</small></button>`; }).join('') || '<span class="tm-libre">Fechas libres para vender ✦</span>'}</div>
      <div class="tm-barra"><i style="width:${l.length / max * 100}%"></i></div></div>`;
  }).join('')}</div></div></div>`;
}

function verDia(f) {
  const cosas = cosasDelDia(f);
  const m = modal({
    titulo: conMayuscula(fechaLarga(f)),
    cuerpo: cosas.length ? `<div class="renglones">${cosas.map(c => { const t = c.clase === 'boda' ? { ic: '♡', c: '#A8833A' } : tipoEvento(c.tipo); return `
      <div class="renglon clic" ${c.clase === 'boda' ? `data-bo2="${c.bodaId}"` : `data-ev2="${c.id}"`}><span class="ev-ic" style="background:${t.c}1f;color:${t.c}">${t.ic}</span>
        <div class="r-t"><b>${esc(c.titulo)}</b><small>${esc(c.hora || '')}${c.lugar ? ' · ' + esc(c.lugar) : ''}${deQuien(c) && c.clase !== 'boda' ? ' · ' + esc(deQuien(c)) : ''}</small></div></div>`; }).join('')}</div>`
      : vacio('◷', 'Día libre'),
    acciones: [{ texto: '＋ Agregar este día', clase: 'p', hacer: () => { setTimeout(() => editarEvento(null, f), 50); } }],
  });
  $$('[data-bo2]', m.fondo).forEach(x => x.onclick = () => { m.cerrar(); abrirBoda(x.dataset.bo2); });
  $$('[data-ev2]', m.fondo).forEach(x => x.onclick = () => { m.cerrar(); editarEvento(Store.obtener('eventos', x.dataset.ev2)); });
}

function editarEvento(e, fecha) {
  const nuevo = !e;
  e = e || { fecha: fecha || iso(HOY()), hora: '10:00', tipo: 'Reunión', titulo: '', bodaId: Vista.bodaId || '', clienteId: '', lugar: '' };
  const bodas = ordenar(Store.listar('bodas', b => diasHasta(b.fecha) >= -30), b => b.fecha);
  const clientes = Store.listar('clientes', c => ['Consulta', 'Presupuesto enviado'].includes(c.etapa));
  const campos = [
    { n: 'titulo', e: 'Qué', valor: e.titulo, req: true, ancho: 'ancho', ph: 'Ej.: Prueba de vestido' },
    { n: 'tipo', e: 'Tipo', tipo: 'select', ops: TIPOS_EVENTO.map(t => ({ v: t.n, t: `${t.ic} ${t.n}` })), valor: e.tipo },
    { n: 'lugar', e: 'Dónde', valor: e.lugar },
    { n: 'fecha', e: 'Día', tipo: 'date', valor: e.fecha },
    { n: 'hora', e: 'Hora', tipo: 'time', valor: e.hora },
    { n: 'bodaId', e: 'De qué boda', tipo: 'select', ops: [{ v: '', t: '— Ninguna —' }, ...bodas.map(b => ({ v: b.id, t: Boda.pareja(b) + ' · ' + fechaDia(b.fecha) }))], valor: e.bodaId || '' },
    { n: 'clienteId', e: 'O de qué cliente', tipo: 'select', ops: [{ v: '', t: '— Ninguno —' }, ...clientes.map(c => ({ v: c.id, t: c.nombre }))], valor: e.clienteId || '' },
  ];
  const gcal = () => {
    const f = (e.fecha || '').replace(/-/g, ''), h = (e.hora || '10:00').replace(':', '');
    return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(e.titulo)}&dates=${f}T${h}00/${f}T${String(+h.slice(0, 2) + 1).padStart(2, '0')}${h.slice(2)}00&location=${encodeURIComponent(e.lugar || '')}`;
  };
  modal({
    titulo: nuevo ? 'Agregar a la agenda' : 'Editar', ancho: 'ancho',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>${!nuevo ? `<a class="btn mini" href="${gcal()}" target="_blank" rel="noopener">📅 Pasar a Google Calendar</a>` : ''}`,
    acciones: [
      ...(!nuevo ? [{ texto: 'Borrar', clase: 's peligro', hacer: () => { if (!confirm('¿Borrar?')) return false; Store.borrar('eventos', e.id); repintar(); } }] : []),
      { texto: 'Cancelar', clase: 's' },
      { texto: 'Guardar', clase: 'p', hacer: f => {
        const v = leerFormulario(campos, f);
        if (!v.titulo) { aviso('Falta qué es', 'mal'); return false; }
        v.bodaId = v.bodaId || null; v.clienteId = v.clienteId || null;
        nuevo ? Store.crear('eventos', v) : Store.editar('eventos', e.id, v);
        aviso('Agendado ✓'); repintar();
      } },
    ],
  });
}


/* ===== js/13-clientes.js ===== */
/* ============================================================
   PANEL · CLIENTES
   La base de datos de parejas (y consultas), con su seguimiento:
   Consulta → Presupuesto enviado → Reservó → Se casaron (o No avanzó).
   Cada ficha guarda ciudad, Instagram, WhatsApp, fecha tentativa,
   invitados y el presupuesto aproximado que manejan.
   Cuando una pareja reserva, con un botón pasa a ser una boda.
   ============================================================ */

let _cliVista = 'seguimiento', _cliBusca = '', _cliEtapa = '';

PANTALLAS.clientes = {
  t: 'Clientes',
  pintar(hoja) {
    const todos = Store.listar('clientes');
    const cerrados = todos.filter(c => ['Reservó', 'Se casaron', 'No avanzó'].includes(c.etapa));
    const ganados = todos.filter(c => ['Reservó', 'Se casaron'].includes(c.etapa));
    const origenes = Object.entries(agrupar(ganados, c => c.origen)).sort((a, b) => b[1].length - a[1].length);
    const conPres = todos.filter(c => c.presupuesto);

    hoja.innerHTML = encabezado('Clientes', 'Todas las parejas que te consultaron, en qué etapa está cada una y cuánto piensan invertir.',
      `<button class="btn p" id="cl-nuevo">＋ Nueva consulta</button>`) + `
    <div class="nums">
      <div class="num"><i>Consultas abiertas</i><b>${todos.filter(c => ['Consulta', 'Presupuesto enviado'].includes(c.etapa)).length}</b><small>${todos.filter(c => c.etapa === 'Presupuesto enviado').length} con presupuesto enviado</small></div>
      <div class="num acento"><i>Se convierten en boda</i><b>${pct(ganados.length, cerrados.length)} %</b><small>${ganados.length} de ${cerrados.length} consultas cerradas</small></div>
      <div class="num"><i>Llegan más por</i><b>${esc(origenes[0]?.[0] || '—')}</b><small>${origenes[0] ? `${origenes[0][1].length} bodas ganadas` : ''}</small></div>
      <div class="num"><i>Presupuesto promedio</i><b>${dolares(suma(conPres, c => c.presupuesto) / (conPres.length || 1))}</b><small>lo que piensan invertir en la boda</small></div>
    </div>
    <div class="filtros"><div class="solapas" id="cl-v"><button data-v="seguimiento" class="${_cliVista === 'seguimiento' ? 'on' : ''}">◫ Seguimiento</button>
      <button data-v="base" class="${_cliVista === 'base' ? 'on' : ''}">☰ Base de datos</button></div>
      <input type="search" class="crece" id="cl-busca" placeholder="Buscar pareja, ciudad, Instagram…" value="${esc(_cliBusca)}">
      ${_cliVista === 'base' ? `<select id="cl-etapa"><option value="">Todas las etapas</option>${ETAPAS_CLIENTE.map(e => `<option ${_cliEtapa === e ? 'selected' : ''}>${e}</option>`).join('')}</select>` : ''}</div>
    <div id="cl-cuerpo"></div>`;

    let lista = todos;
    if (_cliBusca) lista = lista.filter(c => contiene(`${c.nombre} ${c.contacto} ${c.ciudad} ${c.ig} ${c.wa}`, _cliBusca));
    $('#cl-cuerpo', hoja).innerHTML = _cliVista === 'seguimiento' ? tableroClientes(lista) : baseClientes(_cliEtapa ? lista.filter(c => c.etapa === _cliEtapa) : lista);

    $$('#cl-v button', hoja).forEach(x => x.onclick = () => { _cliVista = x.dataset.v; repintar(); });
    const bus = $('#cl-busca', hoja);
    bus.oninput = () => { _cliBusca = bus.value; const p = bus.selectionStart; repintar(); const n = $('#cl-busca'); n.focus(); n.setSelectionRange(p, p); };
    $('#cl-etapa', hoja)?.addEventListener('change', e => { _cliEtapa = e.target.value; repintar(); });
    $('#cl-nuevo', hoja).onclick = () => fichaCliente(null);
    $$('[data-cli]', hoja).forEach(x => x.onclick = e => { if (e.target.closest('[data-mover],[data-wa],a')) return; fichaCliente(Store.obtener('clientes', x.dataset.cli)); });
    $$('[data-mover]', hoja).forEach(x => x.onclick = () => {
      const c = Store.obtener('clientes', x.dataset.mover);
      const i = ETAPAS_CLIENTE.indexOf(c.etapa) + (+x.dataset.dir);
      if (i < 0 || i >= ETAPAS_CLIENTE.length) return;
      if (ETAPAS_CLIENTE[i] === 'Reservó' && !c.bodaId) return confirmarReserva(c);
      Store.editar('clientes', c.id, { etapa: ETAPAS_CLIENTE[i] }); repintar();
    });
    $$('[data-wa]', hoja).forEach(x => x.onclick = () => whatsapp(x.dataset.wa, `¡Hola ${x.dataset.n}! Soy Vanessa Camargo 😊`));
  },
};

function tableroClientes(lista) {
  return `<div class="kanban">${ETAPAS_CLIENTE.map((et, i) => {
    const l = ordenar(lista.filter(c => c.etapa === et), c => c.etapa === 'Se casaron' ? c.fechaTent : c.consultaEl, et === 'Se casaron');
    return `<section class="kb-col ${claseEstado(et)}"><header><b>${et}</b><span>${l.length}</span></header>
      ${l.map(c => { const b = c.bodaId ? Store.obtener('bodas', c.bodaId) : null; const col = b ? Boda.paleta(b)[0] : 'var(--oro)'; return `
      <article class="kb-t" data-cli="${c.id}" style="--c:${col}">
        <b class="kb-n">${esc(c.nombre)}</b>
        <small>${c.fechaTent ? '♡ ' + fechaMedia(c.fechaTent) : 'Sin fecha'} · ${c.invitados || '?'} inv.</small>
        <div class="kb-datos"><span>${esc(c.ciudad || '')}</span><span>≈ ${dolares(c.presupuesto || 0)}</span></div>
        <div class="kb-pie"><span class="chip">${esc(c.origen || '')}</span>
          ${['Consulta', 'Presupuesto enviado'].includes(c.etapa) ? `<small class="${diasHasta(c.consultaEl) < -7 ? 'mal-t' : ''}">hace ${-diasHasta(c.consultaEl)} d</small>` : ''}
          <span class="kb-mov">${i > 0 && i < 4 ? `<button data-mover="${c.id}" data-dir="-1" title="Etapa anterior">‹</button>` : ''}${i < 3 ? `<button data-mover="${c.id}" data-dir="1" title="Siguiente etapa">›</button>` : ''}</span></div>

  }).join('')}</div>`;
}

function baseClientes(lista) {
  return `<div class="tarjeta"><div class="tabla-marco"><table class="t">
    <thead><tr><th>Pareja</th><th>Contacto</th><th>Ciudad</th><th>Instagram</th><th>WhatsApp</th><th>Fecha tentativa</th><th class="n">Invitados</th><th class="n">Presupuesto aprox.</th><th>Etapa</th></tr></thead>
    <tbody>${ordenar(lista, c => c.nombre).map(c => `<tr class="clic" data-cli="${c.id}">
      <td class="titulo"><b>${esc(c.nombre)}</b></td><td>${esc(c.contacto || '')}</td><td>${esc(c.ciudad || '')}</td>
      <td>${c.ig ? `<a href="https://instagram.com/${esc(c.ig.replace('@', ''))}" target="_blank" rel="noopener">${esc(c.ig)}</a>` : '—'}</td>
      <td>${c.wa ? `<button class="btn-txt" data-wa="${esc(c.wa)}" data-n="${esc((c.contacto || '').split(' ')[0])}">${esc(c.wa)}</button>` : '—'}</td>
      <td>${c.fechaTent ? fecha(c.fechaTent) : '—'}</td><td class="n">${c.invitados || '—'}</td><td class="n">${c.presupuesto ? dolares(c.presupuesto) : '—'}</td>
      <td>${chip(c.etapa)}</td></tr>`).join('')}</tbody></table></div></div>`;

function fichaCliente(c) {
  const nuevo = !c;
  c = c || { nombre: '', contacto: '', ciudad: 'Rivera', ig: '', wa: '', fechaTent: '', invitados: 120, presupuesto: 15000, origen: 'Instagram', etapa: 'Consulta', notas: '', consultaEl: iso(HOY()) };
  const campos = [
    { n: 'nombre', e: 'Pareja', valor: c.nombre, req: true, ph: 'Ej.: Rocío & Facundo' },
    { n: 'contacto', e: 'Quién escribió', valor: c.contacto },
    { n: 'ciudad', e: 'Ciudad / ubicación', valor: c.ciudad },
    { n: 'ig', e: 'Instagram', valor: c.ig, ph: '@usuario' },
    { n: 'wa', e: 'WhatsApp', valor: c.wa },
    { n: 'fechaTent', e: 'Fecha tentativa', tipo: 'date', valor: c.fechaTent },
    { n: 'invitados', e: 'Invitados aprox.', tipo: 'number', valor: c.invitados },
    { n: 'presupuesto', e: 'Presupuesto aprox. de la boda (US$)', tipo: 'number', valor: c.presupuesto },
    { n: 'origen', e: 'Cómo llegó', tipo: 'select', ops: ORIGENES, valor: c.origen },
    { n: 'etapa', e: 'Etapa', tipo: 'select', ops: ETAPAS_CLIENTE, valor: c.etapa },
    { n: 'notas', e: 'Notas', tipo: 'textarea', valor: c.notas, ancho: 'ancho' },
  ];
  const b = c.bodaId ? Store.obtener('bodas', c.bodaId) : null;
  const m = modal({
    titulo: nuevo ? 'Nueva consulta' : c.nombre, ancho: 'ancho',
    cuerpo: `${!nuevo ? `<div class="botones" style="margin-bottom:14px">
        ${b ? `<button class="btn" id="fc-boda">♡ Ir a su boda</button>` : `<button class="btn" id="fc-pres">◈ Armar presupuesto</button><button class="btn" id="fc-conv">♡ Reservó: crear la boda</button>`}
        ${c.wa ? `<button class="btn" id="fc-wa">WhatsApp</button>` : ''}</div>` : ''}
      <div class="rejilla">${formulario(campos)}</div>`,
    acciones: [
      ...(!nuevo ? [{ texto: 'Borrar', clase: 's peligro', hacer: () => { if (!confirm('¿Borrar este cliente?')) return false; Store.borrar('clientes', c.id); repintar(); } }] : []),
      { texto: 'Cancelar', clase: 's' },
      { texto: 'Guardar', clase: 'p', hacer: f => {
        const v = leerFormulario(campos, f);
        if (!v.nombre) { aviso('Falta el nombre', 'mal'); return false; }
        nuevo ? Store.crear('clientes', Object.assign({ consultaEl: iso(HOY()), bodaId: null }, v)) : Store.editar('clientes', c.id, v);
        aviso('Cliente guardado'); repintar();
      } },
    ],
  });
  $('#fc-boda', m.fondo)?.addEventListener('click', () => { m.cerrar(); abrirBoda(b.id); });
  $('#fc-pres', m.fondo)?.addEventListener('click', () => { m.cerrar(); nuevoPresupuesto(c); });
  $('#fc-conv', m.fondo)?.addEventListener('click', () => { m.cerrar(); nuevaBoda(c); });
  $('#fc-wa', m.fondo)?.addEventListener('click', () => whatsapp(c.wa, `¡Hola ${(c.contacto || '').split(' ')[0]}! Soy Vanessa Camargo 😊`));
}

function confirmarReserva(c) {
  modal({
    titulo: '¡Reservaron! ♡',
    cuerpo: `<p><b>${esc(c.nombre)}</b> pasa a «Reservó». ¿Creamos ya su boda, con su paleta y la lista de tareas?</p>`,
    acciones: [
      { texto: 'Solo mover', clase: 's', hacer: () => { Store.editar('clientes', c.id, { etapa: 'Reservó' }); repintar(); } },
      { texto: 'Crear la boda', clase: 'p', hacer: () => { setTimeout(() => nuevaBoda(c), 50); } },
    ],
  });
}


/* ===== js/14-proveedores.js ===== */
/* ============================================================
   PANEL · PROVEEDORES (base de datos de Vanessa)
   Nombre, rubro, ubicación, Instagram, WhatsApp, rango de precio
   aproximado (por evento o por persona), su valoración y notas.
   El ESTIMADOR suma los rangos para una cantidad de invitados y le
   da a la pareja una noción de cuánto cuesta la boda que quieren.
   ============================================================ */

let _provVista = 'base', _provRubro = '', _provCiudad = '', _provBusca = '';
let _est = null;   // { personas, elegidos: { rubro: provId } }

PANTALLAS.proveedores = {
  t: 'Proveedores',
  pintar(hoja) {
    const todos = Store.listar('proveedores');
    hoja.innerHTML = encabezado('Proveedores', 'Tu agenda de proveedores de confianza, con precios aproximados para orientar a cada pareja.',
      `<button class="btn p" id="pv-nuevo">＋ Proveedor</button>`) + `
      <div class="filtros"><div class="solapas" id="pv-v"><button data-v="base" class="${_provVista === 'base' ? 'on' : ''}">✦ Base de datos · ${todos.length}</button>
        <button data-v="estimador" class="${_provVista === 'estimador' ? 'on' : ''}">◈ Estimador de costos</button></div></div>
      <div id="pv-cuerpo"></div>`;
    const cuerpo = $('#pv-cuerpo', hoja);
    if (_provVista === 'base') pintarBaseProv(cuerpo, todos); else pintarEstimador(cuerpo);
    $$('#pv-v button', hoja).forEach(x => x.onclick = () => { _provVista = x.dataset.v; repintar(); });

function pintarBaseProv(cuerpo, todos) {
  let l = todos;
  if (_provRubro) l = l.filter(p => p.rubro === _provRubro);
  if (_provCiudad) l = l.filter(p => p.ciudad === _provCiudad);
  if (_provBusca) l = l.filter(p => contiene(`${p.nombre} ${p.rubro} ${p.ciudad} ${p.ig} ${p.notas} ${p.contacto}`, _provBusca));
