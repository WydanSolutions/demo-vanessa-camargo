<style>
/* ===== css/01-base.css ===== */
/* ============================================================
   BASE · colores, letras y piezas que se repiten en toda la página
   Colores y tipografías SOLO acá, en :root (regla de Wydan).
   ============================================================ */
:root{
  /* Identidad de Vanessa (sale de su logo) */
  --oro:#A8833A;
  --oro-osc:#86672A;
  --oro-claro:#C9A962;
  --oro-suave:#F1E6D0;
  --crema:#FBF8F2;
  --papel:#F5EFE4;
  --blanco:#FFFFFF;
  --tinta:#2E2A26;
  --tinta2:#5C554D;
  --tinta3:#8E857A;
  --linea:#EEE6D8;
  --borde:#E4D9C6;

  /* Estados */
  --ok:#6F8B5E;   --ok-suave:#E8EFE2;
  --pronto:#C2902F; --pronto-suave:#F7ECD6;
  --mal:#B5583F;  --mal-suave:#F6E2DB;

  /* Paleta de la boda abierta (la pone aplicarPaleta() en 04-reglas.js) */
  --b1:#A8833A; --b2:#C9A962; --b3:#EFE5D2; --b4:#FBF8F2;
  --b1-suave:#F6EFE2; --b1-oscuro:#7E6229; --b1-txt:#FFFFFF;

  /* El color que manda en cada pantalla: oro en el panel, el de la boda adentro */
  --acento:var(--oro);
  --acento-suave:var(--oro-suave);

  /* Letras */
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Inter',system-ui,-apple-system,sans-serif;
  --script:'Allura','Great Vibes',cursive;

  /* Formas */
  --r:16px; --r2:11px; --r3:8px;
  --sombra:0 1px 2px #2e2a2608,0 6px 22px #2e2a260b;
  --sombra-media:0 2px 6px #2e2a260d,0 14px 36px #2e2a2614;
  --sombra-alta:0 26px 70px #2e2a262e;
  --lateral:268px;
}
body.en-boda{--acento:var(--b1);--acento-suave:var(--b1-suave)}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--tinta);
  background:var(--crema);-webkit-font-smoothing:antialiased;
}
body.sin-scroll{overflow:hidden}
.hidden{display:none!important}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;line-height:1.15;color:var(--tinta)}
h1{font-size:30px} h2{font-size:24px} h3{font-size:20px} h4{font-size:17px}
p{margin:0 0 .6em}
a{color:var(--acento)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.script{font-family:var(--script);font-weight:400}
.serif{font-family:var(--serif)}
.suave{color:var(--tinta3)}
.chico{font-size:12.5px}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ok-t{color:var(--ok)} .mal-t{color:var(--mal)} .pronto-t{color:var(--pronto)}
@keyframes aparece{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flota{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(2deg)}}

/* ---------- Botones ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--borde);background:var(--blanco);
  color:var(--tinta);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px;
  transition:.16s;white-space:nowrap;text-decoration:none;line-height:1.2;
}
.btn:hover{border-color:var(--acento);color:var(--acento)}
.btn.p{background:var(--acento);border-color:var(--acento);color:#fff}
body.en-boda .btn.p{color:var(--b1-txt)}
.btn.p:hover{filter:brightness(1.07);color:#fff;transform:translateY(-1px);box-shadow:0 6px 16px #2e2a261f}
.btn.s{background:transparent}
.btn.oro{background:var(--oro);border-color:var(--oro);color:#fff}
.btn.mini{padding:5px 11px;font-size:12.5px}
.btn.icono{width:38px;height:38px;padding:0;justify-content:center;border-radius:50%}
.btn.icono.mini{width:30px;height:30px;font-size:13px}
.btn.peligro:hover{border-color:var(--mal);color:var(--mal)}
.btn:disabled{opacity:.45;cursor:default;transform:none!important}
.btn-txt{background:none;border:0;color:var(--acento);cursor:pointer;padding:0;font-weight:500}
.btn-txt:hover{text-decoration:underline}
.botones{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Campos ---------- */
.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.campo>span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3);font-weight:500}
.campo input,.campo select,.campo textarea,.inp{
  width:100%;border:1px solid var(--borde);background:var(--blanco);border-radius:var(--r2);
  padding:10px 12px;font-size:16px;outline:none;transition:.15s;
}
.campo input:focus,.campo select:focus,.campo textarea:focus,.inp:focus{border-color:var(--acento);box-shadow:0 0 0 3px var(--acento-suave)}
.campo textarea{resize:vertical;min-height:70px}
.campo .ayuda{font-style:normal;font-size:12px;color:var(--tinta3)}
.campo-si{flex-direction:row;align-items:center;gap:9px}
.campo-si input{width:18px;height:18px;accent-color:var(--acento)}
.campo-si span{text-transform:none;letter-spacing:0;font-size:14px;color:var(--tinta)}
.rejilla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.rejilla .ancho{grid-column:1/-1}
.rejilla3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.f-sep{grid-column:1/-1;font-size:15px;color:var(--acento);margin:8px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--linea)}
input[type=color]{padding:2px;height:40px;cursor:pointer}

/* ---------- Tarjetas ---------- */
.tarjeta{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra);min-width:0;max-width:100%}
.tarjeta>header{display:flex;align-items:center;gap:10px;padding:16px 20px 0;flex-wrap:wrap}
.tarjeta>header h3{font-size:20px;flex:1;min-width:0}
.tarjeta>header .sub{font-size:12.5px;color:var(--tinta3);width:100%;margin-top:-6px}
.tarjeta>.cuerpo{padding:14px 20px 18px;min-width:0}
.cols{display:grid;gap:18px;margin-bottom:18px}
.cols>*{min-width:0;max-width:100%}
.cols.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.cols.c12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}

/* Encabezado de cada sección */
.enc{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.enc .enc-t{flex:1;min-width:220px}
.enc h2{font-size:30px;font-weight:500}
.enc p{color:var(--tinta3);margin:4px 0 0;font-size:14.5px}
.adorno{display:block;width:74px;height:10px;margin:6px 0 0;
  background:radial-gradient(circle,var(--acento) 2.2px,transparent 2.6px) center/10px 10px no-repeat,
  linear-gradient(90deg,transparent,var(--acento) 30%,transparent 46%,transparent 54%,var(--acento) 70%,transparent) center/100% 1px no-repeat}

/* Números grandes */
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.num{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:15px 18px;box-shadow:var(--sombra);min-width:0;position:relative;overflow:hidden}
.num i{display:block;font-style:normal;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta3);font-weight:500}
.num b{display:block;font-family:var(--serif);font-size:28px;font-weight:600;color:var(--tinta);margin-top:2px;line-height:1.1}
.num small{display:block;font-size:12.5px;color:var(--tinta3);margin-top:3px}
.num.acento{background:linear-gradient(135deg,var(--acento),color-mix(in srgb,var(--acento) 70%,#000))}
.num.acento i,.num.acento small{color:#ffffffc4}
.num.acento b{color:#fff}
.num.mal b{color:var(--mal)} .num.ok b{color:var(--ok)}

/* Chips de estado */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;
  background:var(--papel);color:var(--tinta2);white-space:nowrap;border:1px solid transparent}
.chip.ok,.e-confirmado,.e-pagado,.e-cobrado,.e-se-casaron,.e-realizada{background:var(--ok-suave);color:#4F6B40}
.chip.pronto,.e-pendiente,.e-reservado,.e-presupuesto-enviado,.e-recta-final,.e-borrador{background:var(--pronto-suave);color:#8E6516}
.chip.mal,.e-no-viene,.e-no-avanzo,.e-atrasado{background:var(--mal-suave);color:#94402B}
.e-contratado,.e-reservo,.e-enviado,.e-en-organizacion{background:#E6EDF4;color:#3D5A78}
.e-a-cotizar,.e-consulta{background:var(--papel);color:var(--tinta2)}
.e-recien-reservada,.e-aceptado{background:var(--oro-suave);color:var(--oro-osc)}
.e-es-hoy{background:var(--acento);color:#fff}
.punto{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}

/* Barras y anillos */
.barra{height:6px;background:var(--linea);border-radius:99px;overflow:hidden;min-width:40px}
.barra i{display:block;height:100%;background:var(--acento);border-radius:99px;transition:width .5s ease}
.anillo{display:block;color:var(--tinta)}
.estrellas{color:var(--oro);letter-spacing:1px;font-size:13px;white-space:nowrap}
.estrellas i{font-style:normal;color:var(--linea)}

/* Paleta en circulitos */
.paleta{display:inline-flex;align-items:center}
.paleta i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;margin-left:-5px;box-shadow:0 0 0 1px #0000000f}
.paleta i:first-child{margin-left:0}
.paleta.grande i{width:26px;height:26px;margin-left:-7px;border-width:3px}

/* Persona en circulito */
.avatar{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:600;color:#fff;background:var(--oro);flex:0 0 auto;letter-spacing:.03em}

/* Solapas */
.solapas{display:flex;gap:4px;background:var(--papel);padding:4px;border-radius:999px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.solapas::-webkit-scrollbar{display:none}
.solapas button{border:0;background:none;padding:7px 16px;border-radius:999px;cursor:pointer;color:var(--tinta2);font-weight:500;white-space:nowrap;font-size:14px}
.solapas button.on{background:var(--blanco);color:var(--acento);box-shadow:var(--sombra)}

/* Filtros */
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filtros input,.filtros select{border:1px solid var(--borde);background:var(--blanco);border-radius:999px;padding:9px 15px;font-size:15px;outline:none;min-width:160px}
.filtros input:focus,.filtros select:focus{border-color:var(--acento)}
.filtros .crece{flex:1;min-width:200px}
.filtros .cuenta{margin-left:auto;font-size:13px;color:var(--tinta3)}

/* Tablas */
.tabla-marco{overflow-x:auto;max-width:100%}
.tabla-marco.alta{max-height:70vh;overflow-y:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta3);
  padding:10px 12px;border-bottom:1px solid var(--borde);background:var(--blanco);position:sticky;top:0;z-index:1;white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--linea);vertical-align:middle}
table.t tbody tr{transition:background .12s}
table.t tbody tr:hover{background:#FDFBF7}
table.t tr.clic{cursor:pointer}
table.t tfoot td{font-weight:600;border-top:1px solid var(--borde);border-bottom:0;background:#FDFBF7}
table.t td.acc{white-space:nowrap;text-align:right}

/* Vacío */
.vacio{text-align:center;padding:34px 16px;color:var(--tinta3)}
.vacio .vacio-ic{font-size:30px;display:block;margin-bottom:8px;color:var(--acento);opacity:.75}
.vacio b{display:block;color:var(--tinta);font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:4px}

/* Lista simple con renglones */
.renglones{display:flex;flex-direction:column}
.renglon{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--linea);min-width:0}
.renglon:last-child{border-bottom:0}
.renglon .r-t{flex:1;min-width:0}
.renglon .r-t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.renglon .r-t small{display:block;color:var(--tinta3);font-size:12.5px}
.renglon.clic{cursor:pointer;border-radius:var(--r3);padding-left:8px;padding-right:8px;margin:0 -8px}
.renglon.clic:hover{background:var(--crema)}
.fecha-cubo{width:46px;flex:0 0 auto;text-align:center;border-radius:var(--r3);background:var(--crema);border:1px solid var(--linea);padding:4px 0;line-height:1.05}
.fecha-cubo b{display:block;font-family:var(--serif);font-size:20px;font-weight:600}
.fecha-cubo i{display:block;font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--tinta3)}

/* ---------- Ventanitas ---------- */
.modal-fondo{position:fixed;inset:0;background:#2e2a2652;backdrop-filter:blur(3px);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;animation:aparece .18s ease}
.modal{background:var(--blanco);border-radius:20px;width:100%;max-width:560px;box-shadow:var(--sombra-alta);overflow:hidden;animation:aparece .22s ease}
.modal.ancho{max-width:820px}
.modal.muy-ancho{max-width:1040px}
.modal>header{display:flex;align-items:center;padding:18px 22px 6px}
.modal>header h3{flex:1;font-size:23px;font-weight:500}
.m-x{border:0;background:var(--papel);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1;color:var(--tinta2)}
.m-cuerpo{padding:12px 22px 16px;max-height:72vh;overflow:auto}
.m-pie{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;background:var(--crema);border-top:1px solid var(--linea)}

/* Aviso abajo */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;background:var(--tinta);color:#fff;
  padding:11px 20px;border-radius:999px;font-size:14px;z-index:120;transition:.25s;pointer-events:none;box-shadow:var(--sombra-alta);max-width:90vw}
#toast.ver{opacity:1;transform:translate(-50%,0)}
#toast.t-mal{background:var(--mal)}

/* Lista de sugerencias propia (nada de <datalist>) */
.sugeridos{position:fixed;z-index:130;background:#fff;border:1px solid var(--borde);border-radius:var(--r2);box-shadow:var(--sombra-media);overflow:auto}
.sugeridos button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;cursor:pointer;font-size:15px}
.sugeridos button:hover,.sugeridos button.on{background:var(--crema);color:var(--acento)}


/* ===== css/02-entrada.css ===== */
/* ============================================================
   1) PRESENTACIÓN DE WYDAN   2) BLOQUEO   3) TRANSICIÓN A UNA BODA
   ============================================================ */

/* ---------- Presentación de Wydan (identidad de Wydan, no del cliente) ---------- */
#bienvenida{
  position:fixed;inset:0;z-index:70;overflow:auto;
  background:#F4F6F9;color:#14294A;font-family:'Inter',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:34px 18px;
}
.bv-in{max-width:640px;width:100%;text-align:center;animation:aparece .5s ease both}
.bv-marca img{height:40px;width:auto}
.bv-para{margin-top:30px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#6E7C8C}
.bv-t{font-family:'Poppins','Inter',sans-serif;font-size:30px;font-weight:700;color:#14294A;margin:7px 0 2px;line-height:1.2}
.bv-s{font-size:14px;color:#6E7C8C;font-weight:500}
.bv-frase{font-size:15.5px;line-height:1.65;color:#39485C;max-width:540px;margin:20px auto 26px}
.bv-vista{background:#fff;border:1px solid #DCE3EC;border-radius:14px;padding:14px;box-shadow:0 18px 44px #14294a1a;text-align:left}
.bv-btn{margin-top:26px;background:#14294A;color:#fff;border:0;border-radius:10px;padding:14px 26px;font-size:15.5px;font-weight:600;
  font-family:'Poppins','Inter',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:.18s}
.bv-btn:hover{background:#1D3C6B;transform:translateY(-1px)}
.bv-pie{margin-top:30px;font-size:12px;color:#8E9BA9;letter-spacing:.04em}

/* Vista previa en miniatura (con los colores de Vanessa) */
.vp{font-family:var(--sans);font-size:11px;color:var(--tinta2);background:var(--crema);border-radius:9px;padding:10px;display:grid;grid-template-columns:92px 1fr;gap:10px}
.vp-lat{background:#fff;border-radius:7px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid var(--linea)}
.vp-lat i{display:block;height:5px;width:70%;border-radius:9px;background:var(--linea)}
.vp-lat i.on{background:var(--oro)}
.vp-cuerpo{min-width:0}
.vp-t{font-family:var(--serif);font-size:15px;color:var(--tinta);margin-bottom:6px}
.vp-bodas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vp-boda{border-radius:7px;background:#fff;border:1px solid var(--linea);overflow:hidden}
.vp-boda .vp-tapa{height:30px;display:flex;align-items:center;justify-content:center;font-family:var(--script);font-size:14px;color:#fff}
.vp-boda .vp-pie{padding:5px 6px;display:flex;gap:3px}
.vp-boda .vp-pie b{width:8px;height:8px;border-radius:50%}

/* ---------- Pantalla de bloqueo ---------- */
#bloqueo{
  position:fixed;inset:0;z-index:60;overflow:auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 18px;
  background:radial-gradient(900px 620px at 50% 0%,#FFFDF9,#F4ECDD 75%);
}
.bq-hojas{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bq-hojas .bq-aros{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.16;animation:gira 90s linear infinite}
.bq-hojas .bq-aros svg{width:min(118vmin,980px);height:auto}
@keyframes gira{to{transform:translate(-50%,-50%) rotate(360deg)}}
.bq-hojas .hoja-suelta{position:absolute;opacity:.55;animation:cae linear infinite}
@keyframes cae{0%{transform:translateY(-12vh) rotate(0deg);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(112vh) rotate(260deg);opacity:0}}
.bq-tarjeta{
  position:relative;z-index:2;width:100%;max-width:410px;text-align:center;
  background:#FFFFFFD6;backdrop-filter:blur(12px) saturate(1.1);-webkit-backdrop-filter:blur(12px);
  border:1px solid #fff;box-shadow:0 30px 80px #8a6a2c26,0 1px 0 #fff inset;
  border-radius:26px;padding:18px 30px 26px;animation:aparece .5s ease both;
}
.bq-tarjeta.tiembla{animation:tiembla .4s}
@keyframes tiembla{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.bq-logo svg{display:block;margin:0 auto;width:210px;height:210px}
.bq-saludo{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--tinta2);margin:-4px 0 16px}
.bq-solapas{display:grid;grid-template-columns:1fr 1fr;background:var(--papel);border-radius:999px;padding:4px;margin-bottom:16px}
.bq-solapas button{border:0;background:none;padding:9px 6px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--tinta3);font-weight:500;transition:.18s}
.bq-solapas button.on{background:#fff;color:var(--oro-osc);box-shadow:var(--sombra)}
.bq-tarjeta .campo{text-align:left}
.bq-tarjeta #bq-clave{text-align:center;letter-spacing:.35em;font-size:19px;font-family:var(--serif)}
.bq-tarjeta .btn{width:100%;justify-content:center;margin-top:4px;padding:13px;font-size:15px;background:linear-gradient(135deg,var(--oro-claro),var(--oro) 55%,var(--oro-osc));border:0}
.bq-error{min-height:18px;font-size:13px;color:var(--mal);margin-top:8px}
.bq-ayuda{font-size:12.5px;color:var(--tinta3);line-height:1.55}
.bq-ayuda b{color:var(--oro-osc)}
.bq-ayuda code{font-family:var(--sans);background:var(--papel);padding:1px 6px;border-radius:6px;color:var(--tinta)}
.bq-pie{position:relative;z-index:2;margin-top:22px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tinta3);letter-spacing:.05em}
.bq-pie img{height:26px;opacity:.85}
.bq-volver{background:none;border:0;color:var(--tinta3);font-size:12.5px;cursor:pointer;margin-top:14px;position:relative;z-index:2}
.bq-volver:hover{color:var(--oro-osc)}

/* ---------- Transición al entrar a una boda ---------- */
#transicion{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(800px 600px at 50% 40%,var(--b4),var(--b3));transition:opacity .6s ease}
#transicion.sale{opacity:0}
.tr-in{text-align:center;animation:aparece .7s ease both}
.tr-sobre{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--b1-oscuro)}
.tr-nombres{font-family:var(--script);font-size:clamp(54px,11vw,104px);line-height:1.05;color:var(--b1);margin:12px 0 4px;animation:aparece .8s .1s ease both}
.tr-nombres span{font-size:.6em;color:var(--b2);margin:0 .12em}
.tr-adorno{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--b2);margin:6px 0 10px}
.tr-adorno i{height:1px;width:80px;background:linear-gradient(90deg,transparent,var(--b2))}
.tr-adorno i:last-child{transform:scaleX(-1)}
.tr-fecha{font-family:var(--serif);font-size:23px;color:var(--tinta);font-style:italic}
.tr-lugar{font-size:14px;color:var(--tinta2);letter-spacing:.05em;margin-top:4px}
.tr-in .paleta{margin-top:20px}

/* ---------- Aviso discreto de vencimiento de la demostración ---------- */
.bv-vence{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:26px;
  background:#fff;border:1px solid #DCE3EC;border-radius:999px;padding:6px 8px 6px 14px;font-size:12.5px;color:#6E7C8C;box-shadow:0 4px 14px #14294a0d}
.bv-vence:empty{display:none}
.bvv-cuenta{display:inline-flex;gap:4px;background:#F4F6F9;border-radius:999px;padding:3px 10px}
.bvv-cuenta .cd{display:inline-flex;align-items:baseline;gap:2px;font-size:11.5px;color:#8E9BA9}
.bvv-cuenta .cd b{font-size:13px;font-weight:600;color:#14294A;font-variant-numeric:tabular-nums;min-width:1ch;text-align:right}
.bq-vence{position:relative;z-index:2;margin-top:16px;font-size:12px;color:var(--tinta3);letter-spacing:.02em}
.bv-fin-ic{font-size:40px;margin:30px 0 4px;opacity:.8}
.bv-fin .bv-btn{text-decoration:none}
@media(max-width:480px){
  .bv-vence{border-radius:16px;padding:8px 10px}
  .bvv-t{width:100%;text-align:center}
}


/* ===== css/03-app.css ===== */
/* ============================================================
   ESTRUCTURA: menú lateral, barra de arriba y hoja de trabajo
   ============================================================ */
.lateral{
  position:fixed;top:0;left:0;bottom:0;width:var(--lateral);z-index:40;
  background:var(--blanco);border-right:1px solid var(--linea);
  display:flex;flex-direction:column;overflow:hidden;
}
/* Ramita de adorno abajo del menú */
.lateral::after{content:'';position:absolute;right:-40px;bottom:70px;width:200px;height:200px;pointer-events:none;opacity:.5;
  background:radial-gradient(circle at 70% 70%,var(--acento-suave),transparent 60%)}
.lat-cabeza{padding:18px 18px 12px;border-bottom:1px solid var(--linea);position:relative;z-index:1}
.marca-h{display:flex;align-items:center;gap:10px}
.marca-txt b{display:block;font-family:var(--script);font-weight:400;font-size:27px;line-height:1;color:var(--tinta)}
.marca-txt i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--tinta3);margin-top:3px}

/* Cabeza del menú cuando se está adentro de una boda */
.lat-volver{display:inline-flex;align-items:center;gap:6px;border:0;background:none;cursor:pointer;color:var(--tinta3);font-size:13px;padding:0;margin-bottom:12px}
.lat-volver:hover{color:var(--oro-osc)}
.lat-boda{border-radius:14px;padding:14px 14px 12px;background:linear-gradient(150deg,var(--b4),var(--b3));border:1px solid var(--b3);position:relative;overflow:hidden}
.lat-boda::after{content:'';position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;border:1.5px solid var(--b2);opacity:.5}
.lat-boda .lb-n{font-family:var(--script);font-size:32px;line-height:1.05;color:var(--b1)}
.lat-boda .lb-f{font-size:12.5px;color:var(--tinta2);margin-top:2px}
.lat-boda .lb-pie{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.lat-boda .lb-d{font-family:var(--serif);font-size:15px;color:var(--b1-oscuro);font-weight:600}

.lat-menu{flex:1;overflow-y:auto;padding:12px 10px;position:relative;z-index:1}
.lat-menu .lm-sep{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--tinta3);padding:14px 12px 6px}
.lat-menu button{
  display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 12px;border-radius:11px;
  cursor:pointer;color:var(--tinta2);font-size:14.5px;text-align:left;transition:.14s;position:relative;
}
.lat-menu button .ic{width:22px;text-align:center;font-size:15px;color:var(--tinta3);flex:0 0 auto}
.lat-menu button:hover{background:var(--crema);color:var(--tinta)}
.lat-menu button.on{background:var(--acento-suave);color:var(--tinta);font-weight:500}
.lat-menu button.on .ic{color:var(--acento)}
.lat-menu button.on::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--acento)}
.lat-menu .globo{margin-left:auto;background:var(--mal);color:#fff;font-size:10.5px;font-weight:600;border-radius:99px;padding:1px 7px}
.lat-menu .globo.suave{background:var(--oro-suave);color:var(--oro-osc)}
.lat-pie{padding:12px 16px 14px;border-top:1px solid var(--linea);position:relative;z-index:1}
.lat-salir{border:0;background:none;cursor:pointer;color:var(--tinta3);font-size:13px;padding:4px 0}
.lat-salir:hover{color:var(--mal)}
.lat-wydan{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--tinta3);letter-spacing:.04em}
.lat-wydan img{height:26px;opacity:.85}
.tapa{display:none}

.contenido{margin-left:var(--lateral);min-height:100vh;display:flex;flex-direction:column}
.arriba{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:14px 32px;background:var(--crema);border-bottom:1px solid var(--linea);box-shadow:0 6px 18px #2e2a2608;
}
.menu-btn{display:none}
.arriba-t{flex:1;min-width:0}
.arriba-migas{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta3)}
.arriba h1{font-size:25px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arriba-der{display:flex;align-items:center;gap:8px}
.arriba-der .hoy{font-size:13px;color:var(--tinta3);font-style:italic;font-family:var(--serif);font-size:16px}
.hoja{padding:26px 32px 60px;flex:1;width:100%;max-width:1380px;animation:aparece .3s ease both}
.abajo{display:none}

/* Fondo de la boda: un velo suave de su paleta */
body.en-boda{background:var(--b4)}
body.en-boda .arriba{background:var(--b4)}
body.en-boda .lateral{background:linear-gradient(180deg,#fff 0%,#fff 70%,var(--b4))}
/* Vista de los novios: sin volver al panel */
body.novios .lat-volver{display:none}


/* ===== css/04-panel.css ===== */
/* ============================================================
   PANEL DE VANESSA · inicio y mis bodas
   ============================================================ */

/* ---------- Inicio ---------- */
.ini-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;margin-bottom:20px;align-items:stretch}
.ini-saludo{padding:10px 4px;display:flex;flex-direction:column;justify-content:center}
.ini-hola{font-family:var(--serif);font-size:24px;font-style:italic;color:var(--tinta2)}
.ini-nombre{font-size:78px;line-height:.95;color:var(--oro);margin:0 0 10px;text-shadow:0 2px 0 #fff}
.ini-saludo p{color:var(--tinta2);font-size:15.5px;max-width:460px}
.ini-saludo .botones{margin-top:8px}
.ini-prox{
  position:relative;overflow:hidden;border:0;cursor:pointer;text-align:left;color:#fff;border-radius:24px;padding:24px 26px;
  background:linear-gradient(140deg,var(--p1),color-mix(in srgb,var(--p1) 55%,var(--p2)) 60%,var(--p2));
  box-shadow:0 22px 50px color-mix(in srgb,var(--p1) 35%,transparent);transition:.25s;font-family:var(--sans);
}
.ini-prox::before,.ini-prox::after{content:'';position:absolute;border-radius:50%;border:1.5px solid #ffffff55}
.ini-prox::before{width:260px;height:260px;right:-70px;top:-90px}
.ini-prox::after{width:240px;height:240px;right:-50px;top:-80px;border-color:#ffffff33}
.ini-prox:hover{transform:translateY(-3px);box-shadow:0 30px 60px color-mix(in srgb,var(--p1) 45%,transparent)}
.ip-sobre{font-size:11.5px;letter-spacing:.25em;text-transform:uppercase;opacity:.85}
.ip-n{font-size:52px;line-height:1.05;margin:6px 0 2px}
.ip-n span{font-size:.6em;opacity:.8}
.ip-f{font-size:14px;opacity:.9}
.ip-cuenta{display:flex;gap:10px;margin-top:18px}
.ip-cuenta div{background:#ffffff26;border:1px solid #ffffff40;border-radius:14px;padding:9px 14px;min-width:78px;text-align:center;backdrop-filter:blur(4px)}
.ip-cuenta b{display:block;font-family:var(--serif);font-size:30px;font-weight:600;line-height:1}
.ip-cuenta i{font-style:normal;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.ip-ir{position:absolute;right:24px;bottom:20px;font-size:13.5px;font-weight:500;opacity:.9}

.ev-ic{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto}
.avisos{display:flex;flex-direction:column;gap:7px}
.aviso-fila{display:flex;align-items:center;gap:11px;text-align:left;border:1px solid var(--linea);background:var(--crema);border-radius:12px;padding:10px 12px;cursor:pointer;transition:.15s}
.aviso-fila:hover{border-color:var(--borde);background:#fff}
.aviso-fila b{display:block;font-weight:500;font-size:14px}
.aviso-fila small{display:block;color:var(--tinta3);font-size:12.5px}
.aviso-fila.mal{border-left:3px solid var(--mal)}
.aviso-fila.pronto{border-left:3px solid var(--pronto)}

.ini-linea{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.il-boda{position:relative;border:1px solid var(--linea);background:#fff;border-radius:16px;padding:14px 14px 12px;text-align:left;cursor:pointer;overflow:hidden;transition:.2s;display:flex;flex-direction:column;gap:2px}
.il-boda:hover{transform:translateY(-2px);box-shadow:var(--sombra-media)}
.il-banda{position:absolute;left:0;right:0;top:0;height:5px}
.il-cuando{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta3);margin-top:4px}
.il-n{font-size:30px;line-height:1.1;color:var(--tinta)}
.il-l{font-size:12.5px;color:var(--tinta3)}
.il-av{display:flex;align-items:center;gap:10px;margin-top:8px}

.mini-graf{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:150px;align-items:end}
.mg-col{display:flex;flex-direction:column;align-items:center;gap:5px;height:100%}
.mg-barras{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.mg-barras i{width:42%;max-width:14px;background:linear-gradient(180deg,var(--oro-claro),var(--oro));border-radius:4px 4px 1px 1px;min-height:2px}
.mg-barras i.g{background:var(--borde)}
.mg-col span{font-size:10.5px;color:var(--tinta3)}
.mg-pie{display:flex;gap:14px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--tinta3);flex-wrap:wrap}
.mg-pie b{margin-left:auto;color:var(--tinta);font-weight:500}
.mg-c{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--oro);margin-right:5px;vertical-align:-1px}
.mg-c.g{background:var(--borde)}

/* ---------- Mis bodas ---------- */
.bodas-grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.boda-tarj{border:0;padding:0;background:#fff;border-radius:22px;overflow:hidden;cursor:pointer;text-align:left;box-shadow:var(--sombra);
  transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column;font-family:var(--sans);border:1px solid var(--linea)}
.boda-tarj:hover{transform:translateY(-4px);box-shadow:0 24px 50px color-mix(in srgb,var(--c1) 25%,transparent)}
.bt-tapa{position:relative;padding:18px 20px 20px;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 50%,var(--c2)) 65%,var(--c2))}
.boda-tarj.pasada .bt-tapa{filter:saturate(.75)}
.bt-aros{position:absolute;right:-30px;top:-34px;width:150px;height:150px;fill:none;stroke:#ffffff55;stroke-width:1.2}
.bt-cuando{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.88;position:relative}
.bt-n{font-size:40px;line-height:1.08;margin-top:6px;position:relative}
.bt-n span{font-size:.62em;opacity:.8}
.bt-f{font-size:13px;opacity:.92;position:relative}
.bt-cuerpo{padding:14px 18px 14px;display:flex;flex-direction:column;gap:10px;flex:1;background:linear-gradient(180deg,#fff,var(--c4))}
.bt-fila{display:flex;gap:10px;align-items:center}
.bt-datos{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--tinta2)}
.bt-datos span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-av{text-align:center;color:var(--tinta)}
.bt-av i{display:block;font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta3);margin-top:-2px}
.bt-alertas{display:flex;gap:6px;flex-wrap:wrap;min-height:24px}
.bt-pie{display:flex;align-items:center;gap:10px;border-top:1px solid var(--linea);padding-top:10px;font-size:12.5px}
.bt-acc{color:var(--tinta3)}
.bt-ir{margin-left:auto;color:var(--c1);font-weight:600}
.boda-nueva{border:1.5px dashed var(--borde);border-radius:22px;background:transparent;cursor:pointer;min-height:300px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;color:var(--tinta2);font-family:var(--serif);font-size:22px;transition:.2s}
.boda-nueva span{width:54px;height:54px;border-radius:50%;background:var(--oro-suave);color:var(--oro);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:8px}
.boda-nueva small{font-family:var(--sans);font-size:13px;color:var(--tinta3)}
.boda-nueva:hover{border-color:var(--oro);background:#fff}

/* Selector de paleta */
.pal-grilla{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pal-op{border:1.5px solid var(--linea);background:#fff;border-radius:12px;padding:8px;cursor:pointer;text-align:left;transition:.15s}
.pal-op:hover{border-color:var(--borde)}
.pal-op.on{border-color:var(--tinta);box-shadow:0 0 0 3px var(--oro-suave)}
.pal-mues{display:flex;height:26px;border-radius:7px;overflow:hidden;margin-bottom:6px}
.pal-mues i{flex:1}
.pal-op b{font-weight:500;font-size:12.5px}
.pal-propia{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;font-size:13px;color:var(--tinta3)}
.pal-propia label{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.pal-propia input{width:44px;height:36px;border:1px solid var(--borde);border-radius:9px;background:#fff}
.pal-propia i{font-style:normal;font-size:10.5px}
.nb-vista{margin-top:14px}
.nb-mini{border-radius:16px;padding:18px;color:#fff;text-align:center}
.nb-mini span{display:block;font-size:40px;line-height:1.1}
.nb-mini small{font-size:13px;opacity:.9}


/* ===== css/05-boda.css ===== */
/* ============================================================
   ADENTRO DE CADA BODA (todo con la paleta de la boda: --b1…--b4)
   ============================================================ */

/* ---------- Portada ---------- */
.bp-hero{position:relative;overflow:hidden;border-radius:28px;padding:40px 44px 34px;margin-bottom:20px;
  background:radial-gradient(700px 400px at 85% 10%,#ffffffb3,transparent 60%),linear-gradient(140deg,var(--b4),var(--b3));
  border:1px solid var(--b3);box-shadow:var(--sombra)}
.bp-aros{position:absolute;right:-60px;top:-70px;width:400px;height:400px;fill:none;stroke:var(--b2);stroke-width:1;opacity:.55}
.bp-hoja1{position:absolute;right:30px;bottom:-30px;width:230px;opacity:.55;transform:rotate(-8deg)}
.bp-hoja1 svg{width:100%;height:auto}
.bp-in{position:relative;max-width:680px}
.bp-sobre{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--b1-oscuro)}
.bp-n{font-size:clamp(52px,7.4vw,96px);font-weight:400;line-height:1.02;color:var(--b1);margin:8px 0 6px}
.bp-n span{color:var(--b2);font-size:.62em}
.bp-f{font-family:var(--serif);font-size:22px;font-style:italic;color:var(--tinta)}
.bp-l{font-size:14px;color:var(--tinta2);margin-top:4px}
.bp-cuenta{display:flex;gap:12px;margin:22px 0 4px}
.bp-cuenta div{background:#ffffffb8;border:1px solid #fff;border-radius:16px;padding:12px 16px;min-width:92px;text-align:center;box-shadow:0 6px 18px #0000000a}
.bp-cuenta b{display:block;font-family:var(--serif);font-size:40px;font-weight:600;color:var(--b1);line-height:1}
.bp-cuenta i{font-style:normal;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta3)}
.bp-hecha{font-family:var(--serif);font-size:24px;color:var(--b1);margin:16px 0 4px}
.bp-frase{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--tinta2);margin:16px 0 14px}
.bp-avances{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:16px 20px;align-items:center;justify-content:space-around;box-shadow:var(--sombra)}
.bp-av{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.bp-av span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3)}
.bp-av.grande span{color:var(--b1);font-weight:600}
.tarea-r{cursor:pointer}
.tarea-r input{width:19px;height:19px;accent-color:var(--b1);flex:0 0 auto}
.nota-mini{border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14px;box-shadow:0 3px 10px #0000000d}
.nota-mini small{display:block;color:var(--tinta3);margin-top:4px;font-size:12px}
.solo-vos{font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--oro-suave);color:var(--oro-osc);border-radius:99px;padding:2px 8px;vertical-align:middle;margin-left:6px}
.pal-grande{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pal-grande div{text-align:center}
.pal-grande i{display:block;height:58px;border-radius:14px;border:1px solid #0000000d;margin-bottom:6px}
.pal-grande b{display:block;font-size:12.5px;font-weight:500}
.pal-grande small{font-size:11px;color:var(--tinta3);font-family:monospace}
.pal-nombre{margin-top:12px;font-size:13.5px;color:var(--tinta2)}
.hon-mini .hm-plan{font-family:var(--serif);font-size:19px;margin-bottom:8px}
.hm-fila{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.hm-fila span{color:var(--tinta3)}
.hon-mini .barra{margin:6px 0 8px}
.hm-fila.total{border-top:1px solid var(--linea);margin-top:6px;padding-top:8px}
.hm-fila.total b{font-family:var(--serif);font-size:22px;color:var(--b1)}

/* ---------- Presupuesto ---------- */
.dona-caja{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dona-ley{flex:1;min-width:150px;display:flex;flex-direction:column;gap:5px}
.dona-ley div{display:flex;align-items:center;gap:8px;font-size:13px}
.dona-ley i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.dona-ley span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-t{font-size:16px;margin:18px 0 8px}
.quien{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.quien b{font-weight:500;font-size:13px}
.item-c{display:flex;gap:10px;align-items:center}
.item-ic{width:34px;height:34px;border-radius:10px;background:var(--b1-suave);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.item-c b{display:block;font-weight:500}
.item-c small{display:block;color:var(--tinta3);font-size:12px}
.d-b{display:block}

/* ---------- Proveedores de la boda ---------- */
.pipeline-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.pm-paso{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:12px 14px;position:relative;display:flex;align-items:baseline;gap:8px}
.pm-paso b{font-family:var(--serif);font-size:28px;font-weight:600}
.pm-paso span{font-size:13px;color:var(--tinta2)}
.pm-paso i{position:absolute;right:-10px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--tinta3);z-index:1;font-size:18px}
.sugerencia{background:var(--b1-suave);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sugerencia .chip{cursor:pointer;background:#fff;border-color:var(--b3)}
.sugerencia .chip:hover{border-color:var(--b1)}
.prov-grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.prov-t{background:#fff;border:1px solid var(--linea);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sombra)}
.prov-t header{display:flex;gap:12px;align-items:center}
.pt-ic{width:42px;height:42px;border-radius:12px;background:var(--b1-suave);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.prov-t header small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta3)}
.prov-t header b{display:block;font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.15}
.pt-estados{display:grid;grid-template-columns:repeat(4,1fr);background:var(--crema);border-radius:10px;padding:3px;gap:2px}
.pt-estados button{border:0;background:none;font-size:11.5px;padding:6px 2px;border-radius:8px;cursor:pointer;color:var(--tinta3)}
.pt-estados button.on{font-weight:600}
.pt-datos{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.pt-datos div{display:flex;flex-direction:column}
.pt-datos span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta3)}
.pt-datos b{font-weight:500;font-size:14px}
.pt-nota{font-size:13px;color:var(--tinta2);background:var(--crema);border-radius:10px;padding:8px 10px;margin:0}
.prov-t footer{display:flex;gap:6px;align-items:center;margin-top:auto}
.prov-t footer .btn-txt{margin-left:auto}
.elegir-lista{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto}
.elegir-prov{display:flex;gap:12px;align-items:center;border:1px solid var(--linea);background:#fff;border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;transition:.15s}
.elegir-prov:hover{border-color:var(--acento);background:var(--crema)}
.ep-t{flex:1;min-width:0}
.ep-t b{display:block;font-weight:500}
.ep-t small{color:var(--tinta3);font-size:12.5px}
.ep-p{text-align:right;font-family:var(--serif);font-size:17px;font-weight:600;white-space:nowrap}
.ep-p small{display:block;font-family:var(--sans);font-size:11px;font-weight:400;color:var(--tinta3)}

/* ---------- Invitados ---------- */
.inv-grupo{background:#fff;border:1px solid var(--linea);border-radius:var(--r);margin-bottom:14px;overflow:hidden;box-shadow:var(--sombra)}
.inv-grupo>header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(90deg,var(--b1-suave),#fff);border-bottom:1px solid var(--linea);flex-wrap:wrap}
.inv-grupo>header b{font-family:var(--serif);font-size:18px;font-weight:600}
.inv-grupo>header span{font-size:12.5px;color:var(--tinta3)}
.inv-grupo>header .chip{margin-left:auto}
.inv-fila{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--linea);cursor:pointer;transition:background .12s}
.inv-fila:last-child{border-bottom:0}
.inv-fila:hover{background:var(--crema)}
.inv-fila .avatar{width:32px;height:32px;font-size:11.5px}
.if-t{flex:1;min-width:0}
.if-t b{display:block;font-weight:500}
.if-t small{color:var(--tinta3);font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--crema);border-radius:99px;padding:3px;gap:2px;flex:0 0 auto}
.seg button{border:0;background:none;border-radius:99px;padding:5px 10px;cursor:pointer;color:var(--tinta3);font-size:13px;display:flex;gap:5px;align-items:center}
.seg button span{font-size:12px}
.seg button:not(.on) span{display:none}
.seg button.on{box-shadow:var(--sombra)}
.chips-op{display:flex;flex-wrap:wrap;gap:6px}
.chips-op label{cursor:pointer}
.chips-op input{display:none}
.chips-op span{display:inline-block;padding:6px 12px;border-radius:99px;border:1px solid var(--borde);font-size:13px;background:#fff}
.chips-op input:checked+span{background:var(--acento);color:#fff;border-color:var(--acento)}
.rsvp{border-radius:22px;padding:28px 26px;text-align:center;background:linear-gradient(160deg,#fff,var(--b3));border:1px solid var(--b3);max-width:420px;margin:12px auto}
.rsvp-sobre{font-size:11.5px;letter-spacing:.25em;text-transform:uppercase;color:var(--tinta3)}
.rsvp-n{font-size:52px;color:var(--b1);line-height:1.1;margin:6px 0}
.rsvp-f{font-family:var(--serif);font-size:17px;color:var(--tinta2);margin-bottom:16px}
.rsvp .campo{text-align:left}
.rsvp-bot{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.rsvp .btn.p{background:var(--b1);border-color:var(--b1)}
.rsvp .chips-op{justify-content:center}
.rsvp .chips-op input:checked+span{background:var(--b1);border-color:var(--b1)}
.rsvp-link{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12.5px;color:var(--tinta3);flex-wrap:wrap}
.rsvp-link code{background:var(--crema);padding:4px 8px;border-radius:8px;font-size:12px;word-break:break-all}

/* ---------- Tareas ---------- */
.ta-progreso{display:flex;align-items:center;gap:12px;margin:-6px 0 14px}
.ta-progreso .barra{flex:1;height:8px}
.ta-progreso b{font-family:var(--serif);font-size:20px;color:var(--b1)}
.etapas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.etapa{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:14px 12px 10px;box-shadow:var(--sombra)}
.etapa>header{display:flex;gap:10px;align-items:center;padding:0 4px 10px;border-bottom:1px solid var(--linea);margin-bottom:6px}
.et-punto{width:26px;height:26px;border-radius:50%;border:2px solid var(--b2);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:0 0 auto}
.etapa.completa .et-punto{background:var(--b1);border-color:var(--b1)}
.etapa>header b{display:block;font-family:var(--serif);font-size:18px;font-weight:600}
.etapa>header small{color:var(--tinta3);font-size:12px}
.tarea{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:10px;cursor:pointer}
.tarea:hover{background:var(--crema)}
.ta-check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--borde);background:#fff;cursor:pointer;flex:0 0 auto;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.tarea.hecha .ta-check{background:var(--b1);border-color:var(--b1)}
.tarea.hecha .ta-t b{text-decoration:line-through;color:var(--tinta3);font-weight:400}
.tarea.atrasada .ta-t small{color:var(--mal)}
.ta-t b{display:block;font-weight:500;font-size:14px}
.ta-t small{font-size:12px;color:var(--tinta3)}
.ta-resp{background:var(--crema);padding:1px 7px;border-radius:99px}
.ta-resp.nov{background:var(--b1-suave);color:var(--b1-oscuro)}

/* ---------- Cronograma ---------- */
.crono{position:relative;padding-left:4px}
.cr-mom{display:grid;grid-template-columns:64px 22px 1fr;gap:10px;cursor:pointer;position:relative}
.cr-mom::before{content:'';position:absolute;left:84px;top:22px;bottom:-4px;width:2px;background:linear-gradient(var(--b2),var(--b3))}
.cr-mom:last-child::before{display:none}
.cr-hora{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--b1);text-align:right;padding-top:6px}
.cr-punto{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--b1);margin:11px auto 0;position:relative;z-index:1}
.cr-cuerpo{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:12px 16px;margin-bottom:14px;box-shadow:var(--sombra);transition:.15s}
.cr-mom:hover .cr-cuerpo{border-color:var(--b2)}
.cr-cuerpo b{font-family:var(--serif);font-size:19px;font-weight:600}
.cr-cuerpo p{font-size:13.5px;color:var(--tinta2);margin:4px 0 0}
.cr-pie{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cr-llega{background:var(--b1-suave)!important;color:var(--b1-oscuro)!important}
.cr-h{font-family:var(--serif);font-size:18px;color:var(--b1);min-width:48px}

/* ---------- Inspiración ---------- */
.ins-pal{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;box-shadow:var(--sombra)}
.ins-pal .pal-grande i{height:40px}
.ins-muro{columns:4 230px;column-gap:16px}
.ins-idea{break-inside:avoid;margin:0 0 16px;background:#fff;border:1px solid var(--linea);border-radius:18px;overflow:hidden;box-shadow:var(--sombra);transition:.2s}
.ins-idea:hover{box-shadow:var(--sombra-media);transform:translateY(-2px)}
.ins-foto{display:block;position:relative;background:var(--b3)}
.ins-foto img{display:block;width:100%;height:auto;min-height:120px;object-fit:cover}
.yt-play{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:#000000a0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.ins-emb{display:block;width:100%;border:0;background:var(--crema)}
.ins-emb.pin{height:420px}
.ins-emb.ig{height:520px}
.ins-web{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px 16px;text-decoration:none;color:var(--tinta);background:linear-gradient(150deg,var(--b4),var(--b3))}
.ins-web img{width:34px;height:34px;border-radius:9px;background:#fff;padding:4px;box-shadow:var(--sombra)}
.ins-web b{font-family:var(--serif);font-size:18px;font-weight:600;margin-top:6px}
.ins-web small{color:var(--tinta3);font-size:12px;word-break:break-all}
.ins-web span{font-size:12.5px;color:var(--b1);font-weight:500;margin-top:4px}
.ins-idea figcaption{padding:10px 14px 12px}
.ins-idea figcaption b{display:block;font-weight:500;font-size:14px}
.ins-idea figcaption small{display:block;color:var(--tinta3);font-size:12.5px}
.ins-pie{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.ins-nota{font-size:13px;color:var(--tinta3);text-align:center;margin-top:10px}
.ins-form{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.ins-prev{border:1px dashed var(--borde);border-radius:16px;overflow:hidden;min-height:180px}
.ins-prev .ins-emb.ig{height:380px}
.ins-prev .ins-emb.pin{height:330px}
.ins-tipo{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3);padding:8px 12px;background:var(--crema)}

/* ---------- Notas ---------- */
.notas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.nota{position:relative;padding:20px 18px 14px;border-radius:4px 4px 18px 4px;box-shadow:0 10px 24px #2e2a2614;transform:rotate(var(--g));min-height:150px;display:flex;flex-direction:column}
.nota::before{content:'';position:absolute;top:-8px;left:50%;width:56px;height:18px;transform:translateX(-50%) rotate(-2deg);background:#ffffff90;border:1px solid #0000000a}
.nota p{font-family:var(--serif);font-size:18px;line-height:1.35;flex:1;margin:0}
.nota small{color:var(--tinta3);margin-top:10px}
.nota .m-x{position:absolute;right:8px;top:8px;opacity:0;transition:.15s;background:#ffffff90}
.nota:hover .m-x{opacity:1}
.nota-priv{font-size:11px;letter-spacing:.06em;color:var(--oro-osc);margin-bottom:6px}
.m-x.mini{width:24px;height:24px;font-size:15px;flex:0 0 auto}

/* ---------- Acceso de los novios ---------- */
.interruptor{display:flex;align-items:center;gap:12px;cursor:pointer}
.interruptor input{display:none}
.interruptor span{width:48px;height:28px;border-radius:99px;background:var(--borde);position:relative;transition:.2s;flex:0 0 auto}
.interruptor span::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:var(--sombra);transition:.2s}
.interruptor input:checked+span{background:var(--b1)}
.interruptor input:checked+span::after{left:23px}
.interruptor b{font-weight:500}
.ac-msj{margin-top:16px;background:var(--crema);border-radius:14px;padding:12px 14px}
.ac-msj small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta3)}
.ac-msj p{font-size:14px;margin:6px 0 10px;word-break:break-word}
.ac-secc{display:flex;flex-direction:column;gap:4px}
.ac-s{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}
.ac-s:hover{background:var(--crema)}
.ac-s input{width:18px;height:18px;accent-color:var(--b1)}
.ac-s span{flex:1}
.ac-s small{color:var(--tinta3);font-size:12px}
.ac-s.fija{opacity:.7;cursor:default}
.ac-seguridad{margin-top:18px;background:#fff;border:1px solid var(--linea);border-left:4px solid var(--b1);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--tinta2)}
.hm-cuotas{display:flex;flex-direction:column;gap:4px;margin:2px 0 8px}
.hm-cuotas div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;background:var(--crema);border-radius:9px;padding:6px 9px;font-size:13px}
.hm-cuotas small{grid-column:1;color:var(--tinta3);font-size:11.5px}
.hm-cuotas b{grid-column:2;grid-row:1/3;align-self:center;font-weight:500}
.hm-cuotas .ok small{color:var(--ok)}
.hm-cuotas .mal small{color:var(--mal)}


/* ===== css/06-salon.css ===== */
/* ============================================================
   SALÓN Y MESAS
   ============================================================ */
.nums-chicos .num{padding:11px 15px}
.nums-chicos .num b{font-size:24px}
.sl-barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;justify-content:space-between}
.sl-zoom{display:inline-flex;align-items:center;gap:6px;margin-left:4px;font-size:12.5px;color:var(--tinta3)}
.sl-zoom b{font-weight:500;min-width:38px;text-align:center}
.desplegable{position:relative}
.menu-d{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:20;background:#fff;border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra-media);padding:6px;min-width:220px}
.desplegable.abierto .menu-d{display:block}
.menu-d button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:14px;text-align:left;color:var(--tinta)}
.menu-d button:hover{background:var(--crema)}
.menu-d small{margin-left:auto;color:var(--tinta3);font-size:12px}

.sl-grilla{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.sl-lienzo{background:#fff;border:1px solid var(--linea);border-radius:20px;padding:12px;overflow:auto;max-height:78vh;box-shadow:var(--sombra);position:relative;
  background-image:radial-gradient(var(--linea) 1px,transparent 1px);background-size:16px 16px}
.sl-lienzo.eligiendo{outline:2px dashed var(--b1);outline-offset:-6px}
.salon-svg{display:block;max-width:none;height:auto;user-select:none;-webkit-user-select:none}
.salon-svg .arrastrable{cursor:grab;touch-action:none}
.salon-svg .arrastrable:hover .mesa-top{filter:brightness(.97)}
.salon-svg .moviendo{cursor:grabbing;opacity:.85}
.salon-svg .moviendo .mesa-cuerpo{filter:drop-shadow(0 .2px .3px #0000004d)}
.salon-svg .sel-aro{stroke:var(--b1);stroke-width:.07;stroke-dasharray:.25 .15;animation:hormiga 1s linear infinite}
@keyframes hormiga{to{stroke-dashoffset:-.4}}
.salon-svg .destino .mesa-top{stroke:var(--b1);stroke-width:.16}
.sl-lienzo.eligiendo .obj-mesa{cursor:copy}
body.arrastrando{cursor:grabbing;user-select:none}

.sl-panel{background:#fff;border:1px solid var(--linea);border-radius:20px;padding:16px;box-shadow:var(--sombra);max-height:78vh;overflow:auto;position:sticky;top:90px}
.slp-cab{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.slp-cab b{font-family:var(--serif);font-size:22px;font-weight:600;flex:1}
.slp-vista{display:flex;justify-content:center;background:linear-gradient(160deg,var(--b4),var(--b3));border-radius:14px;padding:8px;margin-bottom:12px}
.slp-rot{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3)}
.slp-rot span{margin-right:auto}
.slp-t{font-family:var(--sans);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta3);font-weight:500;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.slp-t small,.slp-t .btn-txt{text-transform:none;letter-spacing:0;font-size:12px}
.slp-sent{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.slp-fam{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:var(--crema);font-size:13.5px}
.slp-fam .t{flex:1;min-width:0}
.slp-fam small{color:var(--tinta3)}
.slp-acc{margin-top:8px;padding-top:12px;border-top:1px solid var(--linea)}
.slp-aviso{background:var(--b1-suave);border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:10px}
.slp-libres{display:flex;flex-direction:column;gap:10px}
.slp-g small{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tinta3);margin-bottom:5px}
.slp-g{display:flex;flex-wrap:wrap;gap:5px}
.slp-g small{width:100%}
.fam-chip{border:1px solid var(--linea);border-left:4px solid var(--g);background:#fff;border-radius:9px;padding:6px 9px;font-size:13px;cursor:grab;touch-action:none;display:inline-flex;gap:6px;align-items:center;transition:.12s}
.fam-chip:hover{border-color:var(--g);box-shadow:var(--sombra)}
.fam-chip b{background:var(--crema);border-radius:99px;padding:0 6px;font-size:11.5px}
.fam-chip i{font-style:normal;color:var(--pronto);font-weight:600}
.fam-chip.on{background:var(--b1-suave);border-color:var(--b1);box-shadow:0 0 0 2px var(--b1-suave)}
.fam-chip.fantasma{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-120%) rotate(-3deg);box-shadow:var(--sombra-alta)}
.slp-ley{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--tinta2)}
.slp-ley span{display:flex;align-items:center;gap:5px}
.slp-ley i{width:10px;height:10px;border-radius:50%}

/* Estilo de mesas */
.est-op{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;margin-bottom:8px;font-size:12.5px;color:var(--tinta3)}
.est-op select{border:1px solid var(--borde);border-radius:9px;padding:7px 9px;font-size:14px;background:#fff;width:100%}
.est-mantel{display:flex;gap:6px;flex-wrap:wrap}
.est-mantel button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--borde);cursor:pointer}
.est-mantel button.on{box-shadow:0 0 0 2px var(--tinta)}
.estilo-caja{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:center}
.estilo-vista{background:radial-gradient(circle at 50% 40%,#fff,var(--b3));border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ev-mini{display:flex;gap:10px;align-items:center;justify-content:center}
.mesa-sola{display:block;overflow:visible}

/* Forma del salón y catálogo de elementos */
.formas-salon{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.formas-salon button{border:1.5px solid var(--linea);background:#fff;border-radius:14px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px}
.formas-salon button.on{border-color:var(--b1);background:var(--b1-suave)}
.formas-salon svg{width:60px;height:44px}
.formas-salon b{font-weight:500}
.elem-grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.elem-grilla button{border:1px solid var(--linea);background:#fff;border-radius:14px;padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s}
.elem-grilla button:hover{border-color:var(--b1);background:var(--crema)}
.elem-grilla svg{width:90px;height:56px}
.elem-grilla b{font-weight:500;font-size:13px}
.elem-grilla small{color:var(--tinta3);font-size:11.5px}

/* Lista por mesa */
.lista-mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lm-mesa{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:12px;box-shadow:var(--sombra);display:flex;flex-direction:column;gap:5px}
.lm-mesa header{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.lm-mesa header b{display:block;font-family:var(--serif);font-size:19px;font-weight:600}
.lm-mesa header small{color:var(--tinta3);font-size:12px}


/* ===== css/07-panel2.css ===== */
/* ============================================================
   PANEL DE VANESSA · calendario, clientes, proveedores, planes,
   finanzas y equipo
   ============================================================ */
.aviso-banda{background:var(--pronto-suave);border:1px solid #EBD3A0;color:#7A5714;border-radius:14px;padding:11px 16px;margin-bottom:14px;font-size:14px}

/* ---------- Calendario ---------- */
.cal-ley{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--tinta3);margin-left:auto}
.cal-ley span{display:flex;align-items:center;gap:5px}
.cal-ley i{width:9px;height:9px;border-radius:3px}
.cal-mes{padding:16px}
.cal-cab{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-cab h3{font-size:26px;font-weight:500;min-width:210px;text-align:center}
.cal-sem{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-sem span{text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta3)}
.cal-grilla{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-d{min-height:112px;background:var(--crema);border:1px solid var(--linea);border-radius:12px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:.15s;min-width:0}
.cal-d:hover{border-color:var(--borde);background:#fff}
.cal-d.finde{background:#FDF9F1}
.cal-d.fuera{opacity:.45}
.cal-d.hoy{border:2px solid var(--oro);background:#fff}
.cd-n{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--tinta2);padding-left:2px}
.cal-d.hoy .cd-n{color:var(--oro)}
.cal-ev{border:0;text-align:left;background:color-mix(in srgb,var(--t) 13%,#fff);border-left:3px solid var(--t);border-radius:6px;padding:3px 6px;font-size:11.5px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tinta);width:100%}
.cal-ev b{font-weight:600}
.cal-boda{border:0;border-radius:8px;color:#fff;padding:5px 7px;font-size:11px;cursor:pointer;text-align:left;overflow:hidden;width:100%;box-shadow:0 3px 8px #0000001a;line-height:1}
.cal-boda .script{font-size:18px;line-height:1}
.cd-mas{font-size:11px;color:var(--tinta3);padding-left:4px}
.ag-sem{margin-bottom:22px}
.ag-sem h3{font-size:22px;font-weight:500;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--linea)}
.ag-dia{display:flex;gap:14px;margin-bottom:10px;align-items:flex-start}
.fecha-cubo.hoy{background:var(--oro);color:#fff;border-color:var(--oro)}
.fecha-cubo.hoy i{color:#fff}
.ag-items{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.ag-ev{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:9px 12px;cursor:pointer;text-align:left;transition:.15s;width:100%}
.ag-ev:hover{border-color:var(--borde);box-shadow:var(--sombra)}
.ag-t{flex:1;min-width:0}
.ag-t b{display:block;font-weight:500}
.ag-t small{color:var(--tinta3);font-size:12.5px}
.ag-boda{border:0;border-radius:14px;padding:12px 16px;color:#fff;text-align:left;cursor:pointer;box-shadow:var(--sombra-media)}
.ag-boda .script{display:block;font-size:30px;line-height:1.05}
.ag-boda small{font-size:12.5px;opacity:.92}
.temporada{display:flex;flex-direction:column;gap:8px}
.tm-mes{display:grid;grid-template-columns:70px minmax(0,1fr) 120px;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linea)}
.tm-n{font-family:var(--serif);font-size:20px;font-weight:600}
.tm-n small{display:block;font-family:var(--sans);font-size:11px;color:var(--tinta3);font-weight:400}
.tm-bodas{display:flex;gap:8px;flex-wrap:wrap}
.tm-bodas button{border:0;border-radius:12px;color:#fff;padding:7px 12px;cursor:pointer;text-align:left}
.tm-bodas b{display:block;font-size:22px;line-height:1;font-weight:400}
.tm-bodas small{font-size:11.5px;opacity:.9}
.tm-libre{font-size:13px;color:var(--tinta3);font-style:italic}
.tm-barra{height:6px;background:var(--linea);border-radius:9px;overflow:hidden}
.tm-barra i{display:block;height:100%;background:var(--oro)}

/* ---------- Clientes ---------- */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.kb-col{background:var(--papel);border-radius:18px;padding:10px;min-height:200px}
.kb-col>header{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px}
.kb-col>header b{font-family:var(--serif);font-size:18px;font-weight:600}
.kb-col>header span{background:#fff;border-radius:99px;padding:1px 9px;font-size:12.5px;color:var(--tinta2)}
.kb-col.e-reservo{background:#EEF2F6}
.kb-col.e-se-casaron{background:var(--ok-suave)}
.kb-col.e-no-avanzo{opacity:.75}
.kb-t{background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--sombra);cursor:pointer;border-top:3px solid var(--c);transition:.15s}
.kb-t:hover{transform:translateY(-2px);box-shadow:var(--sombra-media)}
.kb-n{display:block;font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.2}
.kb-t>small{display:block;color:var(--tinta3);font-size:12px;margin:2px 0 6px}
.kb-datos{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tinta2)}
.kb-pie{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px}
.kb-pie .chip{font-size:11px;padding:2px 8px}
.kb-mov{margin-left:auto;display:flex;gap:3px}
.kb-mov button{width:26px;height:26px;border-radius:50%;border:1px solid var(--borde);background:#fff;cursor:pointer;font-size:15px;line-height:1;color:var(--tinta2)}
.kb-mov button:hover{border-color:var(--oro);color:var(--oro)}
.kb-vacio{text-align:center;color:var(--tinta3);font-size:13px}

/* ---------- Proveedores ---------- */
.rubros-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rubros-chips button{border:1px solid var(--linea);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--tinta2);transition:.15s}
.rubros-chips button i{font-style:normal;color:var(--tinta3);font-size:11.5px;margin-left:3px}
.rubros-chips button.on{background:var(--oro);border-color:var(--oro);color:#fff}
.rubros-chips button.on i{color:#ffffffcc}
.pv-grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pv-t{background:#fff;border:1px solid var(--linea);border-radius:18px;padding:15px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--sombra);cursor:pointer;transition:.18s}
.pv-t:hover{transform:translateY(-2px);box-shadow:var(--sombra-media)}
.pv-t header{display:flex;gap:12px;align-items:center}
.pv-t header small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta3)}
.pv-t header b{display:block;font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.15}
.pv-t .pt-ic{background:var(--oro-suave)}
.pv-l{font-size:13px;color:var(--tinta2);display:flex;justify-content:space-between}
.pv-precio{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--oro-osc)}
.pv-precio small{font-family:var(--sans);font-size:12px;color:var(--tinta3);font-weight:400;margin-left:6px}
.pv-bodas{font-size:12.5px;color:var(--tinta2);display:flex;align-items:center;gap:8px}
.pv-t footer{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.est-pers{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 14px}
.est-pers>span{grid-column:1/-1}
.est-pers input[type=range]{accent-color:var(--oro);padding:0;border:0;box-shadow:none}
.est-pers b{font-family:var(--serif);font-size:20px}
.est-filas{display:flex;flex-direction:column;gap:6px}
.est-fila{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--linea);border-radius:12px;background:#fff}
.est-fila.apagada{opacity:.55;background:var(--crema)}
.est-fila .pt-ic{width:36px;height:36px;font-size:16px;background:var(--oro-suave)}
.ef-t{flex:1;min-width:0}
.ef-t small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3)}
.ef-t select{border:0;background:none;font-size:14.5px;padding:2px 0;width:100%;outline:none;cursor:pointer}
.ef-p{font-family:var(--serif);font-size:16px;white-space:nowrap}
.est-res{position:sticky;top:90px;border-radius:24px;padding:26px;color:#fff;background:linear-gradient(150deg,#BC9A55,var(--oro) 50%,var(--oro-osc));box-shadow:0 24px 50px #8a6a2c40}
.er-sobre{font-size:13px;letter-spacing:.06em;opacity:.9}
.er-n{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1.1;margin:6px 0}
.er-n span{font-size:.55em;font-style:italic;font-weight:400;opacity:.85}
.er-pp{font-size:13px;opacity:.9;margin-bottom:16px}
.er-barras{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.erb{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;font-size:12px}
.erb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erb-b{height:6px;background:#ffffff33;border-radius:9px;overflow:hidden}
.erb-b i{display:block;height:100%;background:#fff;border-radius:9px}
.est-res .btn{border-color:#ffffff80;background:#ffffff1f;color:#fff}
.est-res .btn.p{background:#fff;color:var(--oro-osc);border-color:#fff}
.er-nota{font-size:12px;opacity:.85;margin-top:12px}

/* ---------- Planes ---------- */
.planes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-bottom:18px;align-items:stretch}
.plan{position:relative;background:#fff;border:1px solid var(--linea);border-radius:24px;padding:26px 24px 20px;box-shadow:var(--sombra);display:flex;flex-direction:column;text-align:left}
.plan.destacado{border:1.5px solid var(--oro);box-shadow:0 22px 50px #a8833a2e;background:linear-gradient(180deg,#FFFDF8,#fff 40%)}
.plan-cinta{position:absolute;top:-12px;left:24px;background:linear-gradient(135deg,var(--oro-claro),var(--oro));color:#fff;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:4px 12px;border-radius:99px}
.plan h3{font-size:26px;font-weight:500}
.plan-sub{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--tinta2);margin:6px 0 12px;min-height:44px}
.plan-precio{font-family:var(--serif);font-size:44px;font-weight:600;color:var(--oro-osc);line-height:1;margin-bottom:14px}
.plan-precio small{font-size:17px;margin-right:4px;font-weight:500}
.plan ul{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.plan li{font-size:14px;padding-left:22px;position:relative}
.plan li::before{content:'✓';position:absolute;left:0;color:var(--oro);font-weight:600}
.plan .btn{align-self:flex-start}
.plan-nuevo{border:1.5px dashed var(--borde);background:transparent;cursor:pointer;align-items:center;justify-content:center;font-family:var(--serif);font-size:21px;color:var(--tinta2);box-shadow:none;min-height:200px}
.plan-nuevo span{width:48px;height:48px;border-radius:50%;background:var(--oro-suave);color:var(--oro);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:8px}
.extras{display:flex;flex-wrap:wrap;gap:8px}
.extra{display:flex;gap:10px;align-items:center;border:1px solid var(--linea);background:var(--crema);border-radius:12px;padding:9px 13px;cursor:pointer;font-size:14px}
.extra b{font-family:var(--serif);font-size:16px;color:var(--oro-osc)}
.extra:hover{border-color:var(--oro)}
.extra.nuevo{border-style:dashed;background:none;color:var(--tinta3)}
.np{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.np-planes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.np-plan input{display:none}
.np-plan span{display:flex;flex-direction:column;border:1.5px solid var(--linea);border-radius:14px;padding:10px 12px;cursor:pointer;transition:.15s;height:100%}
.np-plan b{font-weight:500;font-size:14px}
.np-plan i{font-style:normal;font-family:var(--serif);font-size:18px;color:var(--oro-osc)}
.np-plan input:checked+span{border-color:var(--oro);background:var(--oro-suave)}
.np-extras{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.np-lineas{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.np-linea{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto auto;gap:8px;align-items:center;font-size:13.5px;background:var(--crema);border-radius:10px;padding:6px 8px}
.np-linea select{border:1px solid var(--borde);border-radius:8px;padding:5px;background:#fff;font-size:13.5px;min-width:0}
.np-linea b{font-family:var(--serif);font-size:15px;white-space:nowrap}
.np-der{position:sticky;top:0}
.np-res{border-radius:20px;padding:20px;background:linear-gradient(170deg,#FFFDF8,var(--oro-suave));border:1px solid #EBDDBF}
.np-res>small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--tinta3)}
.np-n{font-size:40px;line-height:1.1;color:var(--oro-osc);margin:2px 0 12px}
.np-r{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #E2D3B2;font-size:14px}
.np-r.total{border:0;border-top:1.5px solid var(--oro);margin-top:6px;padding-top:10px}
.np-r.total b{font-family:var(--serif);font-size:28px;color:var(--oro-osc)}
.np-est-t{display:flex;justify-content:space-between;font-size:13px;color:var(--tinta2);margin:8px 0;flex-wrap:wrap;gap:4px}

/* ---------- Finanzas ---------- */
.graf-anual{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;height:230px;align-items:end}
.ga-col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.ga-res{font-size:10.5px;font-weight:600;color:var(--ok);min-height:14px}
.ga-res.mal-t{color:var(--mal)}
.ga-barras{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.ga-barras i{width:40%;max-width:20px;background:linear-gradient(180deg,var(--oro-claro),var(--oro));border-radius:5px 5px 2px 2px;min-height:2px}
.ga-barras i.g{background:var(--borde)}
.ga-col span{font-size:11px;color:var(--tinta3)}

/* ---------- Equipo ---------- */
.equipo{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.eq-t{background:#fff;border:1px solid var(--linea);border-top:4px solid var(--c);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sombra)}
.eq-t header{display:flex;gap:12px;align-items:center}
.eq-t header .avatar{width:46px;height:46px;font-size:15px}
.eq-t header b{display:block;font-family:var(--serif);font-size:20px;font-weight:600}
.eq-t header small{color:var(--tinta3);font-size:12.5px}
.eq-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;background:var(--crema);border-radius:12px;padding:8px 4px}
.eq-nums b{display:block;font-family:var(--serif);font-size:19px;font-weight:600}
.eq-nums span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta3)}
.eq-pie{display:flex;justify-content:space-between;font-size:13px;gap:8px;flex-wrap:wrap}
.eq-t footer{display:flex;justify-content:space-between;align-items:center}
.eq-bodas{display:flex;flex-direction:column}
.eqb{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;padding:11px 0;border-bottom:1px solid var(--linea);align-items:center}
.eqb:last-child{border-bottom:0}
.eqb-b{display:flex;gap:10px;align-items:center;cursor:pointer}
.eqb-b b{display:block;font-weight:500}
.eqb-b small{color:var(--tinta3);font-size:12px}
.eqb-gente{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.eqb-p{display:flex;align-items:center;gap:7px;background:var(--crema);border:1px solid var(--linea);border-radius:99px;padding:3px 6px 3px 3px;font-size:12.5px}
.eqb-p .avatar{width:26px;height:26px;font-size:10px}
.eqb-p b{font-weight:500}
.eqb-p small{color:var(--tinta3);margin-left:4px}
.eqb-p.debe{border-color:#EBC3B5;background:var(--mal-suave)}
.eqb-p .chip{font-size:11px;padding:1px 7px}

/* ---------- Planes: servicios de Vanessa, seña y armado del presupuesto ---------- */
.sena-banda{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#FFFBF2,var(--oro-suave));border:1px solid #EBDDBF;border-radius:16px;padding:12px 16px;margin-bottom:18px}
.sena-banda .sb-ic{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--oro);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.sena-banda div{flex:1;min-width:0}
.sena-banda b{display:block;font-family:var(--serif);font-size:19px;font-weight:600}
.sena-banda span{font-size:13.5px;color:var(--tinta2)}
.plan-num{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta3);margin-bottom:4px}
.planes .plan h3{font-size:23px;line-height:1.15}
.plan-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--tinta2);background:var(--crema);border-radius:10px;padding:7px 10px;margin-bottom:12px}
.plan-alcance{font-size:12.5px;color:var(--tinta2);background:#FFF9EE;border-left:3px solid var(--oro-claro);border-radius:0 10px 10px 0;padding:8px 10px;margin:0 0 12px}
.plan-texto{font-family:var(--serif);font-size:17px;line-height:1.55;color:var(--tinta)}
.planes{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.np-sub{font-size:12.5px;color:var(--tinta2);margin:-8px 0 10px}
.np-ops{display:flex;flex-direction:column;gap:6px}
.np-op{display:grid;grid-template-columns:minmax(0,1fr) 110px 34px 34px;gap:8px;align-items:center;border:1px solid var(--linea);border-radius:12px;padding:7px 8px 7px 10px;background:#fff;transition:.15s}
.np-op.apagada{opacity:.5;background:var(--crema)}
.np-op label{display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
.np-op label input{width:18px;height:18px;accent-color:var(--oro);flex:0 0 auto}
.np-op b{display:block;font-weight:500;font-size:14px}
.np-op small{display:block;font-size:11.5px;color:var(--tinta3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-op .inp{padding:7px 9px;font-size:15px;text-align:right}
.np-rec{width:34px;height:34px;border-radius:50%;border:1px solid var(--borde);background:#fff;cursor:pointer;color:var(--borde);font-size:16px}
.np-rec.on{background:var(--oro);border-color:var(--oro);color:#fff}
.np-r small{display:block;font-size:11.5px;color:var(--tinta3)}
.np-r.rec span{color:var(--oro-osc);font-weight:500}
.np-sena{font-size:12.5px;color:var(--tinta2);margin:12px 0 0;background:#fff;border-radius:10px;padding:8px 10px}
.slp-num{width:34px;height:34px;border-radius:50%;background:var(--b1);color:var(--b1-txt);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;font-weight:600;flex:0 0 auto}
.slp-id{grid-template-columns:90px minmax(0,1fr)}
@media(max-width:760px){
  .np-op{grid-template-columns:minmax(0,1fr) 90px 32px 32px}
  .sena-banda{flex-wrap:wrap}
  .slp-id{grid-template-columns:90px minmax(0,1fr)}
}
.np-txt{width:34px;height:34px;border-radius:50%;border:1px solid var(--borde);background:#fff;cursor:pointer;color:var(--tinta3);font-size:14px}
.np-txt.on{background:var(--oro-suave);border-color:var(--oro);color:var(--oro-osc)}
#np-secs{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.np-sec{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:6px;background:var(--crema);border-radius:12px;padding:8px}
.np-sec textarea{grid-column:1;resize:vertical}
.np-sec .m-x{grid-column:2;grid-row:1}


/* ===== css/08-celular.css ===== */
/* ============================================================
   CELULAR Y TABLET  (estándar de Wydan: probar siempre a 375 px)
   · El menú lateral se guarda y aparece una barra abajo.
   · Las tablas angostas se convierten en FICHAS (etiqueta a la
     izquierda, dato a la derecha); las anchas se deslizan de costado
     con la primera columna fija. Lo decide solo js/98-celular.js.
   · Los campos miden 16 px para que el celular no agrande la pantalla.
   ============================================================ */

@media(max-width:1100px){
  .sl-grilla{grid-template-columns:1fr}
  .sl-panel{position:static;max-height:none}
  .kanban{grid-template-columns:repeat(5,minmax(240px,1fr))}
  .np{grid-template-columns:1fr}
  .np-der{position:static}
}

@media(max-width:1000px){
  .lateral{transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--sombra-alta);width:280px}
  .lateral.abierto{transform:none}
