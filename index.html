  .tapa.ver{display:block;position:fixed;inset:0;background:#2e2a2640;z-index:39}
  .contenido{margin-left:0}
  .menu-btn{display:inline-flex}
  .arriba{padding:10px 16px;gap:10px}
  .arriba h1{font-size:21px}
  .arriba-der .hoy{display:none}
  .hoja{padding:18px 16px 96px}

  .cols.c21,.cols.c12{grid-template-columns:1fr}
  .est-res{position:static}
  .abajo{
    display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:38;
    background:#FFFFFFF2;backdrop-filter:blur(10px);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom);
  }
  .abajo button{background:none;border:0;padding:8px 2px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tinta3);font-size:10.5px}
  .abajo button .ic{font-size:18px;line-height:1}
  .abajo button.on{color:var(--acento);font-weight:600}
}

@media(max-width:760px){
  body{font-size:15px}
  h1{font-size:23px} h2{font-size:21px}
  .enc{margin-bottom:14px}
  .enc h2{font-size:26px}
  .enc .botones{width:100%}
  .enc .botones .btn{flex:1;justify-content:center}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .num{padding:12px 13px}
  .num b{font-size:22px}
  .num i{font-size:10.5px}
  .cols.c2,.cols.c3{grid-template-columns:1fr}
  .tarjeta>header{padding:14px 15px 0}
  .tarjeta>.cuerpo{padding:12px 15px 15px}
  .rejilla,.rejilla3{grid-template-columns:1fr}
  .modal-fondo{padding:0;align-items:flex-end}
  .modal,.modal.ancho,.modal.muy-ancho{max-width:none;border-radius:20px 20px 0 0;max-height:94vh;display:flex;flex-direction:column}
  .m-cuerpo{max-height:none;flex:1}
  .m-pie{flex-wrap:wrap}
  .m-pie .btn{flex:1;justify-content:center}
  .filtros{gap:8px}
  .filtros input,.filtros select,.filtros .crece{min-width:0;width:100%;flex:1 1 100%}
  .filtros .cuenta{margin-left:0}
  .solapas{max-width:100%}

  /* Inicio */
  .ini-nombre{font-size:60px}
  .ip-n{font-size:40px}
  .ip-cuenta div{min-width:0;flex:1;padding:8px 6px}
  .ip-ir{position:static;display:block;margin-top:12px}
  .mini-graf{height:120px;gap:3px}

  /* Bodas */
  .bodas-grilla{grid-template-columns:1fr}
  .pal-grilla{grid-template-columns:repeat(2,minmax(0,1fr))}

  /* Boda */
  .bp-hero{padding:26px 20px 22px;border-radius:22px}
  .bp-aros{width:260px;height:260px;right:-90px;top:-80px}
  .bp-hoja1{width:150px;right:-20px}
  .bp-cuenta div{min-width:0;flex:1;padding:10px 6px}
  .bp-cuenta b{font-size:30px}
  .bp-f{font-size:18px}
  .bp-avances{gap:10px;padding:12px}
  .bp-av{flex:1 1 28%}
  .bp-av.grande{flex-basis:100%}
  .pal-grande i{height:44px}
  .pipeline-mini{grid-template-columns:repeat(2,1fr)}
  .pm-paso i{display:none}
  .prov-grilla,.pv-grilla,.equipo,.etapas,.notas,.lista-mesas{grid-template-columns:1fr}
  .inv-fila{flex-wrap:wrap;padding:10px 12px}
  .if-t{flex:1 1 60%}
  .seg{margin-left:44px}
  .seg button:not(.on) span{display:none}
  .inv-grupo>header .chip{margin-left:0}
  .ins-muro{columns:2 140px;column-gap:10px}
  .ins-form{grid-template-columns:1fr}
  .cr-mom{grid-template-columns:48px 18px 1fr;gap:8px}
  .cr-mom::before{left:63px}
  .cr-hora{font-size:17px}
  .sl-barra .botones{width:100%}
  .sl-lienzo{max-height:none;padding:8px;border-radius:16px}
  .estilo-caja{grid-template-columns:1fr}
  .formas-salon{grid-template-columns:repeat(2,1fr)}
  .quien{grid-template-columns:minmax(0,1fr) 70px auto}

  /* Panel */
  .cal-mes{padding:10px}
  .cal-cab h3{font-size:20px;min-width:0;flex:1}
  .cal-grilla,.cal-sem{gap:3px}
  .cal-d{min-height:64px;padding:3px;border-radius:8px}
  .cd-n{font-size:13px}
  .cal-ev{font-size:0;height:6px;padding:0;border-left-width:0;background:var(--t);border-radius:4px}
  .cal-boda{font-size:0;padding:3px 4px}
  .cal-boda .script{font-size:12px}
  .cal-ley{margin-left:0}
  .tm-mes{grid-template-columns:52px minmax(0,1fr)}
  .tm-barra{display:none}
  .kanban{grid-template-columns:repeat(5,minmax(240px,82vw));scroll-snap-type:x mandatory}
  .kb-col{scroll-snap-align:start}
  .planes{grid-template-columns:1fr}
  .np-planes{grid-template-columns:1fr}
  .np-extras{grid-template-columns:1fr}
  .np-linea{grid-template-columns:1fr auto;}
  .np-linea select{grid-column:1/-1;grid-row:2}
  .er-n{font-size:30px}
  .erb{grid-template-columns:110px 1fr}
  .graf-anual{height:170px;gap:3px}
  .ga-res{font-size:8.5px}
  .eqb{grid-template-columns:1fr}

  /* Tablas angostas → fichas */
  table.cel-fichas thead{display:none}
  table.cel-fichas,table.cel-fichas tbody,table.cel-fichas tr,table.cel-fichas td{display:block;width:auto}
  table.cel-fichas tr{background:#fff;border:1px solid var(--linea);border-radius:var(--r2);margin:0 0 10px;padding:4px 2px;box-shadow:var(--sombra)}
  table.cel-fichas tr:hover{background:#fff}
  table.cel-fichas td{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:6px 12px;border-bottom:1px solid var(--linea);text-align:right}
  table.cel-fichas td:last-child{border-bottom:0}
  table.cel-fichas td::before{content:attr(data-et);flex:0 0 auto;max-width:46%;text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3);font-weight:500}
  table.cel-fichas td.titulo{background:var(--crema);border-radius:8px;font-weight:500;text-align:left;display:block;padding:9px 12px}

  table.cel-fichas td.esconder-cel{display:none}
  table.cel-fichas tfoot{display:block}
  table.cel-fichas tfoot tr{background:var(--crema)}
  table.cel-fichas tfoot td::before{content:''}

  /* Tablas anchas → se deslizan, primera columna fija */
  .cel-ancho-aviso{font-size:11.5px;color:var(--tinta3);padding:0 2px 6px}

  table.cel-ancho th:first-child{z-index:3}
}

  .ins-muro{columns:1}
}


/* ===== css/09-impresion.css ===== */
/* ============================================================
   PDF / IMPRESIÓN (hojas A4 armadas en #impreso por 30-impresos.js)
   ============================================================ */
@media screen{#impreso{display:none}}
@media print{
  html,body{background:#fff!important}
  body>*:not(#impreso){display:none!important}
  #impreso{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#impreso{font-family:var(--sans);color:var(--tinta)}
.pg{width:210mm;height:296.5mm;position:relative;overflow:hidden;page-break-after:always;break-after:page;padding:20mm 18mm 22mm;background:#fff}
.pg:last-child{page-break-after:auto;break-after:auto}
.pg.apaisada{width:297mm;height:209.5mm;padding:12mm 14mm 16mm}
.imp-rama{position:absolute;right:-8mm;top:-6mm;width:62mm;opacity:.5}
.imp-pie{position:absolute;left:18mm;right:18mm;bottom:10mm;display:flex;justify-content:space-between;font-size:8.5pt;color:var(--tinta3);border-top:1px solid var(--linea);padding-top:3mm;letter-spacing:.03em}
.apaisada .imp-pie{left:14mm;right:14mm;bottom:6mm}

/* Portada */
.portada{background:radial-gradient(160mm 160mm at 50% 42%,#FFFDF8,#F4ECDD);display:flex;align-items:center;justify-content:center;text-align:center}
.pt-aros{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.13}
.pt-in{position:relative}
.pt-in>svg{display:block;margin:0 auto 10mm}
.pt-sobre{font-size:10pt;letter-spacing:.3em;text-transform:uppercase;color:var(--tinta3)}
.pt-n{font-size:46pt;color:var(--oro-osc);line-height:1.1;margin:3mm 0 1mm}
.pt-n span{font-size:.6em;color:var(--oro-claro)}
.pt-adorno{display:flex;align-items:center;justify-content:center;gap:4mm;color:var(--oro);margin:3mm 0 5mm}
.pt-adorno i{height:1px;width:28mm;background:linear-gradient(90deg,transparent,var(--oro))}
.pt-adorno i:last-child{transform:scaleX(-1)}
.pt-l1{font-family:var(--serif);font-style:italic;font-size:17pt}
.pt-l2{font-size:10.5pt;color:var(--tinta2);margin-top:2mm;letter-spacing:.04em}

/* Encabezados de hoja */
.imp-cab{margin-bottom:8mm;max-width:140mm}
.imp-cab h2{font-size:28pt;font-weight:500}
.imp-cab p{font-family:var(--serif);font-size:13pt;color:var(--tinta2);font-style:italic;margin-top:2mm}
.imp-nota{font-size:14pt!important}
.imp-h4{font-family:var(--serif);font-size:15pt;font-weight:600;margin:7mm 0 3mm;color:var(--oro-osc)}

/* Planes */
.imp-planes{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm}
.imp-planes.n2{grid-template-columns:repeat(2,1fr)}
.imp-planes.n4{grid-template-columns:repeat(2,1fr)}
.ip{position:relative;border:1px solid var(--borde);border-radius:5mm;padding:7mm 5mm 5mm;background:#FFFDF9}
.ip.dest{border:1.5px solid var(--oro);background:linear-gradient(180deg,#FFF8EA,#fff 45%)}
.ip-cinta{position:absolute;top:-3mm;left:5mm;background:var(--oro);color:#fff;font-size:7pt;letter-spacing:.15em;text-transform:uppercase;padding:1mm 3mm;border-radius:99px}
.ip h3{font-size:16pt;font-weight:600}
.ip-sub{font-family:var(--serif);font-style:italic;font-size:10.5pt;color:var(--tinta2);margin:2mm 0 3mm;min-height:13mm}
.ip-precio{font-family:var(--serif);font-size:26pt;font-weight:600;color:var(--oro-osc);margin-bottom:3mm}
.ip-precio small{font-size:11pt;margin-right:1mm}
.ip ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:1.6mm}
.ip li{font-size:9pt;padding-left:4mm;position:relative;line-height:1.35}
.ip li::before{content:'✓';position:absolute;left:0;color:var(--oro)}
.imp-extras{margin-top:7mm;display:flex;flex-wrap:wrap;gap:2mm 4mm;font-size:9.5pt}
.imp-extras h4{width:100%;font-size:13pt;margin-bottom:1mm}
.imp-extras span{background:var(--crema);border-radius:2mm;padding:1.5mm 3mm}
.imp-extras b{color:var(--oro-osc);margin-left:2mm}

.imp-pasos{margin-top:9mm}
.imp-pasos h4{font-size:13pt;margin-bottom:3mm}
.imp-pasos>div{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm}
.paso{border-top:1.5px solid var(--oro);padding-top:3mm}
.paso span{display:inline-flex;width:7mm;height:7mm;border-radius:50%;background:var(--oro-suave);color:var(--oro-osc);align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:11pt}
.paso b{display:block;font-family:var(--serif);font-size:13pt;margin:1.5mm 0 1mm}
.paso small{display:block;font-size:8.5pt;color:var(--tinta2);line-height:1.4}

/* Tablas */
.imp-t{width:100%;border-collapse:collapse;font-size:11pt}
.imp-t td,.imp-t th{padding:3mm 2mm;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
.imp-t th{font-size:8pt;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta3);font-weight:500}
.imp-t td small{display:block;color:var(--tinta3);font-size:8.5pt}
.imp-t .n{text-align:right;white-space:nowrap}
.imp-t tfoot td{font-family:var(--serif);font-size:16pt;font-weight:600;color:var(--oro-osc);border-top:1.5px solid var(--oro);border-bottom:0}
.imp-t.chica{font-size:9pt}
.imp-t.chica td,.imp-t.chica th{padding:2mm 1.5mm}
.imp-t.chica tfoot td{font-size:12pt}
.imp-cuotas{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin:6mm 0 2mm}
.imp-cuotas div{background:var(--crema);border-radius:3mm;padding:3mm 4mm}
.imp-cuotas small{display:block;font-size:8pt;color:var(--tinta3);text-transform:uppercase;letter-spacing:.08em}
.imp-cuotas b{font-family:var(--serif);font-size:15pt}
.imp-cuotas i{font-style:normal;font-size:8.5pt;color:var(--tinta3);margin-left:2mm}
.imp-cond{font-size:8.5pt;color:var(--tinta2);margin-top:6mm;line-height:1.5}
.imp-firma{margin-top:8mm;text-align:right}
.imp-firma .script{font-size:30pt;color:var(--oro-osc)}
.imp-firma small{display:block;font-size:8.5pt;color:var(--tinta3)}

/* Hojas de una boda */
.imp-boda{display:flex;align-items:center;justify-content:space-between;gap:6mm;padding:5mm 7mm;border-radius:5mm;margin-bottom:6mm;
  background:linear-gradient(130deg,var(--c4),var(--c3));border:1px solid var(--c3)}
.imp-boda small{display:block;font-size:8pt;letter-spacing:.25em;text-transform:uppercase;color:var(--tinta3)}
.imp-boda b{display:block;font-size:30pt;line-height:1.1;color:var(--c1);font-weight:400}
.imp-boda span{font-size:9.5pt;color:var(--tinta2)}
.apaisada .imp-boda{padding:3mm 6mm;margin-bottom:4mm}
.apaisada .imp-boda b{font-size:24pt}
.imp-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(35mm,1fr));gap:4mm;margin-bottom:6mm}
.imp-nums div{border:1px solid var(--linea);border-radius:3mm;padding:3mm 4mm}
.imp-nums small{display:block;font-size:7.5pt;text-transform:uppercase;letter-spacing:.08em;color:var(--tinta3)}
.imp-nums b{font-family:var(--serif);font-size:14pt}
.imp-plano{height:150mm;display:flex;justify-content:center}
.imp-plano svg{width:auto!important;height:100%;max-width:100%}
.imp-mesas{columns:4;column-gap:5mm;font-size:8.5pt}
.im{break-inside:avoid;margin-bottom:4mm;border:1px solid var(--linea);border-radius:2.5mm;padding:2.5mm 3mm}
.im b{font-family:var(--serif);font-size:11pt}
.im small{color:var(--tinta3);margin-left:2mm}
.im ul{list-style:none;padding:0;margin:1mm 0 0}
.im li i{font-style:normal;color:var(--tinta3)}
.im li em{color:var(--pronto);font-size:7.5pt}
.hd-cols{display:grid;grid-template-columns:1.1fr 1fr;gap:7mm}
.hd-crono div{display:grid;grid-template-columns:14mm 1fr;gap:3mm;padding:2mm 0;border-bottom:1px solid var(--linea);font-size:9.5pt}
.hd-crono b{font-family:var(--serif);font-size:12pt;color:var(--oro-osc)}
.hd-crono strong{display:block;font-weight:500}
.hd-crono small{display:block;color:var(--tinta2);font-size:8.5pt}
.hd-crono em{font-size:8pt;color:var(--tinta3)}

/* Cartel de ubicación */
.cartel{background:linear-gradient(180deg,var(--c4),#fff 30%,#fff 70%,var(--c4));padding:24mm 22mm}
.ca-marco{position:absolute;inset:9mm;border:1px solid var(--c2);border-radius:4mm}
.ca-marco::after{content:'';position:absolute;inset:2.5mm;border:.5px solid var(--c3);border-radius:3mm}
.ca-cab{text-align:center;position:relative;margin-bottom:8mm}
.ca-cab small{font-size:9pt;letter-spacing:.3em;text-transform:uppercase;color:var(--tinta3)}
.ca-cab b{display:block;font-size:40pt;color:var(--c1);font-weight:400;line-height:1.1}
.ca-cab .pt-adorno{color:var(--c2)}
.ca-cab .pt-adorno i{background:linear-gradient(90deg,transparent,var(--c2))}
.ca-cab h2{font-size:22pt;font-weight:500;letter-spacing:.05em}
.ca-lista{columns:3;column-gap:8mm;font-size:8.6pt;position:relative}
.ca-lista div{display:flex;align-items:baseline;gap:1.5mm;break-inside:avoid;padding:.9mm 0}
.ca-lista span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34mm}
.ca-lista i{flex:1;border-bottom:1px dotted var(--c2);min-width:3mm}
.ca-lista b{font-family:var(--serif);font-size:10pt;color:var(--c1);white-space:nowrap}
.ca-pie{position:absolute;left:0;right:0;bottom:15mm;text-align:center;font-family:var(--serif);font-style:italic;font-size:11pt;color:var(--tinta2)}

/* ---------- La carta del presupuesto (corre de una hoja a otra) ---------- */
.carta{padding:0 19mm;font-size:10.5pt;line-height:1.5}
.carta-fija{position:fixed;top:-15mm;right:0;width:60mm;pointer-events:none}
.carta-fija .imp-rama{position:static;width:58mm;opacity:.42}
.carta-cab{display:flex;align-items:center;justify-content:space-between;gap:8mm;margin-bottom:5mm}
.carta-cab svg{width:40mm;height:40mm}
.cc-fecha{font-family:var(--serif);font-style:italic;font-size:13pt;color:var(--tinta2);align-self:flex-start;margin-top:12mm}
.carta-sres{font-family:var(--serif);font-size:19pt;font-weight:600;margin-bottom:3mm}
.carta-intro{font-size:11pt;color:var(--tinta);margin:0 0 3mm}
.carta-nota{font-family:var(--serif);font-style:italic;font-size:13pt;color:var(--oro-osc);margin:0 0 4mm}
.carta-datos{display:grid;grid-template-columns:1.2fr 1.2fr 1.2fr .6fr;gap:3mm;margin:4mm 0 6mm}
.carta-datos div{background:var(--crema);border-radius:2.5mm;padding:2.5mm 3.5mm}
.carta-datos small{display:block;font-size:7.5pt;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta3)}
.carta-datos b{font-family:var(--serif);font-size:12pt;font-weight:600}
.op{position:relative;border:1px solid var(--borde);border-radius:4mm;padding:5mm 6mm 4mm;margin-bottom:5mm;break-inside:avoid;page-break-inside:avoid;background:#fff}
.op.rec{border:1.5px solid var(--oro);background:linear-gradient(180deg,#FFF9EC,#fff 40%)}
.op header{display:flex;justify-content:space-between;align-items:flex-start;gap:6mm}
.op header small{font-size:7.5pt;letter-spacing:.18em;text-transform:uppercase;color:var(--tinta3)}
.op h3{font-size:16.5pt;font-weight:600;line-height:1.15;margin-top:.5mm}
.op-precio{text-align:right;flex:0 0 auto}
.op-precio small{display:block;font-size:7.5pt;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta3)}
.op-precio b{font-family:var(--serif);font-size:20pt;font-weight:600;color:var(--oro-osc);white-space:nowrap}
.op-cinta{display:inline-block;background:var(--oro);color:#fff;font-size:7.5pt;letter-spacing:.1em;text-transform:uppercase;padding:.8mm 3mm;border-radius:99px;margin:1.5mm 0 0}
.op-texto{margin:2.5mm 0 2.5mm;font-size:10pt;color:var(--tinta);text-align:justify}
.op-incluye{list-style:none;padding:0;margin:0 0 2.5mm;columns:2;column-gap:6mm;font-size:9pt}

.op footer{display:flex;justify-content:space-between;gap:4mm;flex-wrap:wrap;font-size:8.5pt;color:var(--tinta2);border-top:1px solid var(--linea);padding-top:2mm}

.carta-pago{break-inside:avoid;background:var(--crema);border-radius:4mm;padding:4mm 6mm;margin:2mm 0 4mm}

/* ============================================================
   LOGOS
   - LOGO_VC: la marca de Vanessa Camargo, redibujada en código (SVG)
     a partir de su logo original (logo-original.png, fuera de la página).
     Así se ve nítida en cualquier tamaño, en pantalla y en el PDF.
       .completo(tam) → aros, ramas, mariposa y el nombre (bloqueo, PDF)
       .aros(tam)     → solo los aros con las ramas (fondos, adornos)
       .mini(tam)     → aros + mariposa, chiquito (menú, celular)
       .horizontal()  → mini + nombre al costado (barra lateral)
   - LOGO_WYDAN: nuestra marca (imagen incrustada por herramientas/armar.js).
   ============================================================ */

const MARCA = {
  nombre: 'Vanessa Camargo',
  rubro: 'Organizadora de eventos',
  lugar: 'Rivera · Uruguay',
};

const ORO = '#A8833A';
const HOJA = '#F1E6D0';
const HOJA_BORDE = '#B79653';

/* Una rama con hojas a lo largo de una curva (x0,y0 → x1,y1, con control cx,cy) */
function ramaSVG(x0, y0, cx, cy, x1, y1, n = 6, tam = 24, lado = 1) {
  const punto = t => [
    (1 - t) ** 2 * x0 + 2 * (1 - t) * t * cx + t * t * x1,
    (1 - t) ** 2 * y0 + 2 * (1 - t) * t * cy + t * t * y1,
  ];
  const angulo = t => {
    const dx = 2 * (1 - t) * (cx - x0) + 2 * t * (x1 - cx);
    const dy = 2 * (1 - t) * (cy - y0) + 2 * t * (y1 - cy);
    return Math.atan2(dy, dx) * 180 / Math.PI;
  };
  const hoja = (x, y, rot, s) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${(s / 20).toFixed(3)})">
    <path d="M0 0 C5 -7 13 -7.5 21 0 C13 7.5 5 7 0 0Z" fill="${HOJA}" stroke="${HOJA_BORDE}" stroke-width="1.15"/>
    <path d="M1.5 0 L18 0" stroke="${HOJA_BORDE}" stroke-width=".7"/></g>`;
  let s = `<path d="M${x0} ${y0} Q${cx} ${cy} ${x1} ${y1}" fill="none" stroke="${HOJA_BORDE}" stroke-width="1.3"/>`;
  for (let i = 0; i < n; i++) {
    const t = 0.12 + (i / n) * 0.82;
    const [x, y] = punto(t);
    const a = angulo(t);
    const giro = (i % 2 ? 46 : -46) * lado;
    s += hoja(x, y, a + giro, tam * (1 - t * 0.35));
  }
  const [xf, yf] = punto(1);
  s += hoja(xf, yf, angulo(1), tam * 0.7);
  return s;
}

/* La mariposa de línea fina */
const MARIPOSA = `<g fill="none" stroke="#3A3530" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

  <path d="M209 175 C220 152 236 138 240 148 C243 158 230 170 209 175Z"/>
  <path d="M209 177 C222 180 236 186 232 193 C228 199 216 192 209 177Z"/>
  <path d="M205 172 L212 190"/>
  <path d="M207 172 C207 162 211 154 218 148"/>
  <path d="M206 172 C202 162 200 156 196 152"/>
</g>`;

function arosSVG() {
  return `<ellipse cx="252" cy="246" rx="151" ry="148" fill="none" stroke="${ORO}" stroke-width="4"/>
  <ellipse cx="258" cy="241" rx="147" ry="149" fill="none" stroke="${ORO}" stroke-width="2.6" transform="rotate(-6 258 241)"/>
  <ellipse cx="248" cy="250" rx="146" ry="143" fill="none" stroke="${ORO}" stroke-width="2" transform="rotate(8 248 250)"/>`;
}

function ramasSVG() {
  return ramaSVG(232, 212, 268, 150, 334, 126, 7, 26, 1)
    + ramaSVG(176, 334, 222, 340, 266, 386, 5, 22, -1)
    + ramaSVG(292, 356, 336, 318, 386, 296, 6, 23, 1);
}

function logoSVG(tam = 220, conTexto = true, conMariposa = true) {
  return `<svg viewBox="80 80 340 340" width="${tam}" height="${tam}" role="img" aria-label="Vanessa Camargo · Organizadora de eventos">
  ${arosSVG()}${ramasSVG()}${conMariposa ? MARIPOSA : ''}
  ${conTexto ? `<text x="252" y="252" text-anchor="middle" font-family="Allura,'Great Vibes',cursive" font-size="50" fill="#2E2A26">Vanessa Camargo</text>
  <text x="246" y="282" text-anchor="middle" font-family="Jost,'Inter',sans-serif" font-size="18" letter-spacing="3.2" fill="#2E2A26">ORGANIZADORA DE EVENTOS</text>` : ''}
</svg>`;
}

const LOGO_VC = {
  completo: (tam = 220) => logoSVG(tam, true, true),
  aros: (tam = 400) => logoSVG(tam, false, false),
  mini: (tam = 44) => `<svg viewBox="80 80 340 340" width="${tam}" height="${tam}" aria-hidden="true">
    ${arosSVG()}${ramasSVG()}
    <text x="250" y="275" text-anchor="middle" font-family="Allura,cursive" font-size="120" fill="#2E2A26">VC</text></svg>`,
  horizontal: () => `<span class="marca-h">${LOGO_VC.mini(46)}
    <span class="marca-txt"><b>Vanessa Camargo</b><i>Organizadora de eventos</i></span></span>`,
};

/* ===== js/02-utils.js ===== */
/* ============================================================
   HERRAMIENTAS DE USO GENERAL
   Fechas, dinero, textos, ventanitas propias (nada de prompt ni alert)
   y listas de sugerencias que funcionan igual en compu y en celular.
   ============================================================ */

/* ---------- Buscar en la pantalla ---------- */
const $  = (s, ctx = document) => ctx.querySelector(s);
const $$ = (s, ctx = document) => Array.from(ctx.querySelectorAll(s));

/* ---------- Textos ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const sinTildes = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

/* Busca un texto dentro de otro, sin importar tildes ni mayúsculas */
const contiene = (texto, busca) => sinTildes(texto).includes(sinTildes(busca));

/* Clase CSS a partir de un estado ("En preparación" → "e-en-preparacion") */
const claseEstado = e => 'e-' + sinTildes(e).replace(/[^a-z0-9]+/g, '-');

const chip = (estado, extra = '') =>
  `<span class="chip ${claseEstado(estado)} ${extra}">${esc(estado)}</span>`;

/* ---------- Fechas ---------- */
const HOY = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };

/* aaaa-mm-dd (así se guardan todas las fechas) */
const iso = d => {
  const x = d instanceof Date ? d : new Date(d + 'T00:00:00');
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
};
const fecha = f => {
  if (!f) return '—';
  const [a, m, d] = String(f).slice(0, 10).split('-');
  return `${d}/${m}/${a}`;
};
const fechaCorta = f => f ? fecha(f).slice(0, 5) : '—';
const aDate = f => new Date(String(f).slice(0, 10) + 'T00:00:00');
const sumarDias = (f, n) => { const d = aDate(iso(f)); d.setDate(d.getDate() + n); return iso(d); };
const sumarMeses = (f, n) => { const d = aDate(iso(f)); d.setMonth(d.getMonth() + n); return iso(d); };
/* Días desde hoy hasta la fecha (negativo = ya pasó) */
const diasHasta = f => Math.round((aDate(f) - HOY()) / 86400000);
const diasEntre = (a, b) => Math.round((aDate(b) - aDate(a)) / 86400000);

const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
  'agosto', 'setiembre', 'octubre', 'noviembre', 'diciembre'];
const MESES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'set', 'oct', 'nov', 'dic'];
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const DIAS_C = ['Do', 'Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sá'];

const clave = f => String(f).slice(0, 7);                       // aaaa-mm
const mesNombre = k => `${MESES[+k.slice(5, 7) - 1]} ${k.slice(0, 4)}`;
const mesCorto = k => `${MESES_C[+k.slice(5, 7) - 1]} ${k.slice(2, 4)}`;
const primerDia = k => k + '-01';
const ultimoDia = k => iso(new Date(+k.slice(0, 4), +k.slice(5, 7), 0));
const diaSemana = f => DIAS[aDate(f).getDay()];
const esFinde = f => [0, 6].includes(aDate(f).getDay());

/* Primera letra en mayúscula ("miércoles 14" → "Miércoles 14") */
const conMayuscula = s => String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1);

/* "hoy", "ayer", "en 3 días", "hace 12 días" */
function enPalabras(f) {
  const d = diasHasta(f);
  if (d === 0) return 'hoy';
  if (d === 1) return 'mañana';
  if (d === -1) return 'ayer';
  return d > 0 ? `en ${d} días` : `hace ${-d} días`;
}

/* ---------- Dinero y números (formato uruguayo: $ 48.300) ---------- */
const nf = new Intl.NumberFormat('es-UY', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('es-UY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const numero = n => nf.format(Math.round(+n || 0));
const pesos = n => '$ ' + numero(n);
const pesosFinos = n => '$ ' + nf2.format(+n || 0);
const dolares = n => 'US$ ' + numero(n);
/* Un monto en su moneda: '$' (pesos) o 'USD' */
const plata = (monto, moneda = '$') => moneda === 'USD' ? dolares(monto) : pesos(monto);
/* Para sumar todo junto: a dólares (las finanzas de Vanessa se leen en US$) */
const aUSD = (m, moneda) => moneda === 'USD' ? (+m || 0) : (+m || 0) / Store.cfg().tipoCambio;
const aPesos = (m, moneda) => moneda === 'USD' ? (+m || 0) * Store.cfg().tipoCambio : (+m || 0);

const pct = (n, total) => total ? Math.round((n / total) * 100) : 0;

/* ---------- Semáforo de plazos ---------- */
/* Devuelve: ok (verde) · pronto (ámbar) · vencido (terracota) */
function semaforo(fechaLimite) {
  if (!fechaLimite) return 'ok';
  const d = diasHasta(fechaLimite);
  if (d < 0) return 'vencido';
  if (d <= Store.cfg().avisoDias) return 'pronto';
  return 'ok';
}

/* ---------- Colores ---------- */
/* Mezcla dos colores hex (t = 0 → a, 1 → b) */
function mezclar(a, b, t) {
  const largo = c => c.length === 4 ? '#' + [...c.slice(1)].map(x => x + x).join('') : c;
  const h = c => [1, 3, 5].map(i => parseInt(largo(c).slice(i, i + 2), 16));
  const [x, y] = [h(a), h(b)];
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
/* ¿Conviene letra clara u oscura sobre este color? */
const esOscuro = c => { const [r, g, b] = [1, 3, 5].map(i => parseInt(mezclar(c, c, 0).slice(i, i + 2), 16)); return (r * 299 + g * 587 + b * 114) / 1000 < 150; };

/* Anillo de avance (SVG) */
function anillo(porc, tam = 64, color = 'var(--oro)', grosor = 5, texto = true) {
  const r = (tam - grosor) / 2, c = 2 * Math.PI * r;
  return `<svg class="anillo" width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}" aria-label="${porc} %">
    <circle cx="${tam / 2}" cy="${tam / 2}" r="${r}" fill="none" stroke="var(--linea)" stroke-width="${grosor}"/>
    <circle cx="${tam / 2}" cy="${tam / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${grosor}" stroke-linecap="round"
      stroke-dasharray="${(c * porc / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${tam / 2} ${tam / 2})"/>
    ${texto ? `<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${tam / 4.2}" fill="currentColor"
      font-family="Cormorant Garamond,serif" font-weight="600">${porc}%</text>` : ''}</svg>`;
}

/* Barra de avance */
const barra = (porc, color = '') => `<div class="barra"><i style="width:${Math.max(0, Math.min(100, porc))}%;${color ? 'background:' + color : ''}"></i></div>`;

/* Estrellas (valoración de 1 a 5) */
const estrellas = n => `<span class="estrellas" aria-label="${n} de 5">${'★'.repeat(n || 0)}<i>${'★'.repeat(5 - (n || 0))}</i></span>`;

/* Iniciales para los circulitos de persona */
const iniciales = s => {
  const p = String(s || '').split(/\s+/).filter(w => w && !['y', '&', 'de', 'del', 'da', 'dos', 'la', 'los'].includes(w.toLowerCase()));
  return (p.length > 2 ? [p[0], p[p.length - 1]] : p.slice(0, 2)).map(w => w[0]).join('').toUpperCase();
};

/* Fecha linda: "sábado 14 de marzo de 2027" */
const fechaLarga = f => { const d = aDate(f); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`; };
const fechaMedia = f => { const d = aDate(f); return `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`; };
const fechaDia = f => { const d = aDate(f); return `${d.getDate()} ${MESES_C[d.getMonth()]}`; };

/* ---------- Avisos cortos abajo de la pantalla ---------- */
let _tToast;
function aviso(texto, tipo = 'ok') {
  let c = $('#toast');
  if (!c) { c = document.createElement('div'); c.id = 'toast'; document.body.appendChild(c); }
  c.className = 't-' + tipo;
  c.innerHTML = esc(texto);
  c.classList.add('ver');
  clearTimeout(_tToast);
  _tToast = setTimeout(() => c.classList.remove('ver'), 3200);
}

/* ---------- Ventanita propia (en vez de las del navegador) ---------- */
let _modales = 0;
function modal({ titulo, cuerpo, ancho = '', acciones = [], alCerrar }) {
  const fondo = document.createElement('div');
  fondo.className = 'modal-fondo';
  fondo.innerHTML = `<div class="modal ${ancho}" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <header><h3>${esc(titulo)}</h3><button class="m-x" aria-label="Cerrar">×</button></header>
    <div class="m-cuerpo">${cuerpo}</div>
    <footer class="m-pie"></footer></div>`;
  const pie = $('.m-pie', fondo);
  acciones.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.clase || '');
    b.textContent = a.texto;
    b.onclick = () => { if (a.hacer?.(fondo) !== false) cerrar(); };
    pie.appendChild(b);
  });
  if (!acciones.length) pie.remove();
  const cerrar = () => { fondo.remove(); $$('.sugeridos').forEach(x => x.remove()); if (!--_modales) document.body.classList.remove('sin-scroll'); alCerrar?.(); };
  $('.m-x', fondo).onclick = cerrar;
  fondo.onclick = e => { if (e.target === fondo) cerrar(); };
  document.addEventListener('keydown', function salir(e) {
    if (e.key === 'Escape' && document.body.contains(fondo)) { cerrar(); document.removeEventListener('keydown', salir); }
  });
  document.body.appendChild(fondo);
  _modales++; document.body.classList.add('sin-scroll');
  setTimeout(() => $('input:not([data-sugerido]),textarea,select,button.p', fondo)?.focus(), 60);
  return { fondo, cerrar };
}

/* Pide UN texto con una ventanita de la página (reemplaza a prompt()) */
function pedirTexto({ titulo, etiqueta = '', valor = '', largo = false, tipo = 'text' }) {
  return new Promise(resolver => {
    const campo = largo
      ? `<textarea id="pt-v" rows="4">${esc(valor)}</textarea>`
      : `<input id="pt-v" type="${tipo}" value="${esc(valor)}">`;
    const m = modal({
      titulo,
      cuerpo: `<label class="campo">${etiqueta ? `<span>${esc(etiqueta)}</span>` : ''}${campo}</label>`,
      acciones: [
        { texto: 'Cancelar', clase: 's', hacer: () => resolver(null) },
        { texto: 'Guardar', clase: 'p', hacer: f => resolver($('#pt-v', f).value.trim()) },
      ],
      alCerrar: () => resolver(null),
    });
    const inp = $('#pt-v', m.fondo);
    inp.focus(); inp.select?.();
    if (!largo) inp.onkeydown = e => { if (e.key === 'Enter') { resolver(inp.value.trim()); m.cerrar(); } };
  });
}

/* ---------- Formularios ---------- */
/* Arma un formulario a partir de una lista de campos y devuelve lo cargado */
function formulario(campos) {
  return campos.map(c => {
    if (c.tipo === 'titulo') return `<h4 class="f-sep">${esc(c.texto)}</h4>`;
    const id = 'f-' + c.n;
    const req = c.req ? 'required' : '';
    let dentro;
    if (c.tipo === 'select') {
      dentro = `<select id="${id}" ${req}>${(c.ops || []).map(o => {
        const v = typeof o === 'object' ? o.v : o, t = typeof o === 'object' ? o.t : o;
        return `<option value="${esc(v)}" ${String(c.valor) === String(v) ? 'selected' : ''}>${esc(t)}</option>`;
      }).join('')}</select>`;
    } else if (c.tipo === 'textarea') {
      dentro = `<textarea id="${id}" rows="${c.filas || 3}" ${req}>${esc(c.valor ?? '')}</textarea>`;
    } else if (c.tipo === 'checkbox') {
      dentro = `<input id="${id}" type="checkbox" ${c.valor ? 'checked' : ''}>`;
    } else if (c.tipo === 'sugerido') {
      dentro = `<input id="${id}" type="text" value="${esc(c.valor ?? '')}" autocomplete="off"
        data-sugerido="${esc((c.ops || []).join('|'))}" ${req} placeholder="${esc(c.ph || 'Escribí para buscar…')}">`;
    } else {
      dentro = `<input id="${id}" type="${c.tipo || 'text'}" value="${esc(c.valor ?? '')}"
        ${c.paso ? `step="${c.paso}"` : ''} ${c.ph ? `placeholder="${esc(c.ph)}"` : ''} ${req}>`;
    }
    return `<label class="campo ${c.tipo === 'checkbox' ? 'campo-si' : ''} ${c.ancho || ''}">
      <span>${esc(c.e)}</span>${dentro}${c.ayuda ? `<i class="ayuda">${esc(c.ayuda)}</i>` : ''}</label>`;
  }).join('');
}

/* Lee los valores de un formulario armado con formulario() */
function leerFormulario(campos, ctx) {
  const r = {};
  campos.forEach(c => {
    if (c.tipo === 'titulo') return;
    const e = $('#f-' + c.n, ctx);
    if (!e) return;
    r[c.n] = c.tipo === 'checkbox' ? e.checked
      : (c.tipo === 'number' ? (e.value === '' ? null : +e.value) : e.value.trim());
  });
  return r;
}

/* ---------- Listas de sugerencias propias ----------
   No usamos <datalist>: en el celular no se despliega bien.
   Esta lista se abre hacia arriba si abajo no hay lugar y sigue al campo
   cuando la página se mueve (teclado del celular).                        */
(function listasPropias() {
  let caja, campo, opciones = [], marcado = -1;

  const cerrar = () => { caja?.remove(); caja = null; campo = null; marcado = -1; };

  function ubicar() {
    if (!caja || !campo) return;
    const r = campo.getBoundingClientRect();
    const alto = Math.min(caja.scrollHeight, 240);
    const abajo = window.innerHeight - r.bottom;
    caja.style.left = r.left + 'px';
    caja.style.width = r.width + 'px';
    caja.style.maxHeight = alto + 'px';
    if (abajo < alto + 16 && r.top > alto + 16) caja.style.top = (r.top - alto - 4) + 'px';
    else caja.style.top = (r.bottom + 4) + 'px';
  }

  function pintar() {
    const txt = campo.value.trim();
    const lista = opciones.filter(o => !txt || contiene(o, txt)).slice(0, 60);
    if (!lista.length) return cerrar();
    if (!caja || !caja.isConnected) { caja = document.createElement('div'); caja.className = 'sugeridos'; document.body.appendChild(caja); }
    caja.innerHTML = lista.map((o, i) =>
      `<button type="button" class="${i === marcado ? 'on' : ''}" data-v="${esc(o)}">${esc(o)}</button>`).join('');
    caja.onmousedown = e => {
      const b = e.target.closest('button'); if (!b) return;
      e.preventDefault();
      campo.value = b.dataset.v;
      campo.dispatchEvent(new Event('change', { bubbles: true }));
      cerrar();
    };
    ubicar();
  }

  document.addEventListener('focusin', e => {
    const i = e.target.closest('input[data-sugerido]');
    if (!i) return cerrar();
    campo = i; marcado = -1;
    opciones = (i.dataset.sugerido || '').split('|').filter(Boolean);
    pintar();
  });
  document.addEventListener('input', e => { if (e.target === campo) { marcado = -1; pintar(); } });
  document.addEventListener('focusout', e => { if (e.target === campo) setTimeout(cerrar, 120); });
  document.addEventListener('keydown', e => {
    if (!caja || e.target !== campo) return;
    const bs = $$('button', caja);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      marcado = Math.max(0, Math.min(bs.length - 1, marcado + (e.key === 'ArrowDown' ? 1 : -1)));
      pintar(); bs[marcado]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && marcado >= 0) {
      e.preventDefault(); campo.value = bs[marcado].dataset.v;
      campo.dispatchEvent(new Event('change', { bubbles: true })); cerrar();
    } else if (e.key === 'Escape') cerrar();
  });
  window.addEventListener('scroll', ubicar, true);
  window.addEventListener('resize', ubicar);
})();

/* ===== js/03-store.js ===== */
/* ============================================================
   CAPA DE DATOS  ·  ¡ESTO ES LO ÚNICO QUE SE CAMBIA PARA LA NUBE!
   ------------------------------------------------------------
   La pantalla nunca toca los datos directamente: siempre pasa por acá
   (listar / obtener / crear / editar / borrar). Para conectar Firebase
   se reemplazan estas funciones por las de la base, y la pantalla no
   se toca.

   HOY (demostración): los datos son inventados y viven en el navegador
   de quien abre la página (localStorage). Nada sale de su equipo.
   No se guarda NINGUNA imagen: solo links (ver 28-inspiracion.js).
   ============================================================ */

const Store = {
  CLAVE: CLAVE_DATOS,
  VERSION: 3,
  datos: null,

  /* Colecciones (en la nube, cada una sería una colección de Firestore,
     con un documento por registro — nunca todo junto en un solo documento).
     Las que llevan «bodaId» cuelgan de una boda: las reglas de Firestore
     dejan que los novios lean SOLO las de su boda. */
  COLECCIONES: [
    'bodas', 'clientes', 'proveedores', 'equipo', 'asignaciones', 'movimientos', 'eventos',
    'planes', 'presupuestos',
    /* de cada boda: */
    'items', 'bprov', 'invitados', 'mesas', 'elementos', 'tareas', 'momentos', 'ideas', 'notas',
  ],

  /* ---------- Abrir y guardar ---------- */
  abrir() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.CLAVE) || 'null'); } catch (e) { d = null; }

    // Si no hay nada, quedó de una versión anterior o los ejemplos envejecieron,
    // se vuelven a sembrar: una demo vacía no vende nada.
    const viejo = d && (d.version !== this.VERSION || !d.bodas?.length ||
      Math.abs(diasEntre(d.sembradoEl || '2000-01-01', iso(HOY()))) > 30);
    if (!d || viejo) {
      this.datos = sembrarEjemplos();
      this.datos.version = this.VERSION;
      this.datos.sembradoEl = iso(HOY());
      this.guardar();
    } else {
      this.datos = d;
    }
    this.COLECCIONES.forEach(c => { if (!Array.isArray(this.datos[c])) this.datos[c] = []; });
    this.datos.config = Object.assign({}, CFG_INICIAL, this.datos.config || {});
    return this.datos;
  },

  guardar() {
    try { localStorage.setItem(this.CLAVE, JSON.stringify(this.datos)); }
    catch (e) { console.warn('No se pudo guardar en este navegador', e); }
  },

  /* Vuelve a los datos de ejemplo (botón en Ajustes) */
  reiniciar() { try { localStorage.removeItem(this.CLAVE); } catch (e) { /* nada */ } this.datos = null; this.abrir(); },

  /* ---------- Leer ---------- */
  listar(col, filtro) {
    const l = this.datos[col] || [];
    return filtro ? l.filter(filtro) : l;
  },
  obtener(col, id) { return (this.datos[col] || []).find(x => x.id === id) || null; },
  deBoda(col, bodaId) { return this.listar(col, x => x.bodaId === bodaId); },

  /* ---------- Escribir ---------- */
  crear(col, obj) {
    const nuevo = Object.assign({ id: uid(col.slice(0, 3)), creadoEl: iso(HOY()) }, obj);
    this.datos[col].push(nuevo);
    this.guardar();
    return nuevo;
  },
  editar(col, id, cambios) {
    const x = this.obtener(col, id);
    if (!x) return null;
    Object.assign(x, cambios);
    this.guardar();
    return x;
  },
  borrar(col, id) {
    const i = (this.datos[col] || []).findIndex(x => x.id === id);
    if (i < 0) return false;
    this.datos[col].splice(i, 1);
    this.guardar();
    return true;
  },
  /* Borra una boda con todo lo que cuelga de ella */
  borrarBoda(id) {
    ['items', 'bprov', 'invitados', 'mesas', 'elementos', 'tareas', 'momentos', 'ideas', 'notas', 'asignaciones']
      .forEach(c => { this.datos[c] = this.datos[c].filter(x => x.bodaId !== id); });
    this.datos.eventos.forEach(e => { if (e.bodaId === id) e.bodaId = null; });
    this.datos.movimientos.forEach(m => { if (m.bodaId === id) m.bodaId = null; });
    this.borrar('bodas', id);
  },

  /* ---------- Configuración ---------- */
  cfg() { return this.datos?.config || CFG_INICIAL; },
  guardarCfg(cambios) { Object.assign(this.datos.config, cambios); this.guardar(); },
};


/* ===== js/04-reglas.js ===== */
/* ============================================================
   REGLAS DEL NEGOCIO
   Todo lo que se calcula a partir de los datos: el estado de cada
   boda, su avance, los avisos, las cuentas y los honorarios.
   Las pantallas solo muestran lo que sale de acá.
   ============================================================ */

const Boda = {
  /* Nombre de la pareja: "Camila & Santiago" */
  pareja: b => `${b.novia} & ${b.novio}`,
  /* Con apellidos, para el PDF */
  parejaLarga: b => `${b.novia} ${b.apNovia || ''} & ${b.novio} ${b.apNovio || ''}`.replace(/\s+/g, ' ').trim(),

  dias: b => diasHasta(b.fecha),

  estado(b) {
    const d = diasHasta(b.fecha);
    if (d < 0) return 'Realizada';
    if (d === 0) return '¡Es hoy!';
    if (d <= 60) return 'Recta final';
    if (diasEntre(b.creadoEl || b.fecha, iso(HOY())) <= 45) return 'Recién reservada';
    return 'En organización';
  },

  /* Cuenta regresiva en meses, semanas y días */
  cuenta(b) {
    const d = Math.max(0, diasHasta(b.fecha));
    return { dias: d, semanas: Math.floor(d / 7), meses: Math.floor(d / 30.4) };
  },

  personas(id) {
    const inv = Store.deBoda('invitados', id);
    const vienen = inv.filter(i => i.estado !== 'No viene');
    const conf = inv.filter(i => i.estado === 'Confirmado');
    return {
      familias: inv.length,
      total: suma(vienen, i => i.adultos + i.ninos),
      adultos: suma(vienen, i => i.adultos),
      ninos: suma(vienen, i => i.ninos),
      confirmados: suma(conf, i => i.adultos + i.ninos),
      noVienen: suma(inv.filter(i => i.estado === 'No viene'), i => i.adultos + i.ninos),
      pendientes: suma(inv.filter(i => i.estado === 'Pendiente'), i => i.adultos + i.ninos),
      restricciones: inv.filter(i => i.estado !== 'No viene' && i.restr?.length),
    };
  },

  /* Presupuesto de la boda (lo que pagan los novios), siempre en pesos */
  cuentas(id) {
    const it = Store.deBoda('items', id);
    const total = suma(it, i => aPesos(i.real || i.estimado, i.moneda));
    const estimado = suma(it, i => aPesos(i.estimado, i.moneda));
    const pagado = suma(it, i => aPesos(i.pagado, i.moneda));
    const vencidos = it.filter(i => i.vence && diasHasta(i.vence) < 0 && (i.pagado || 0) < (i.real || i.estimado));
    const proximos = it.filter(i => i.vence && diasHasta(i.vence) >= 0 && diasHasta(i.vence) <= 30 && (i.pagado || 0) < (i.real || i.estimado));
    return { total, estimado, pagado, falta: Math.max(0, total - pagado), vencidos, proximos, items: it };
  },

  avance(b) {
    const t = Store.deBoda('tareas', b.id);
    const p = this.personas(b.id);
    const pr = Store.deBoda('bprov', b.id);
    const c = this.cuentas(b.id);
    const partes = {
      tareas: pct(t.filter(x => x.hecho).length, t.length),
      invitados: pct(p.confirmados, p.total),
      proveedores: pct(pr.filter(x => x.estado !== 'A cotizar').length, pr.length),
      pagos: pct(c.pagado, c.total),
    };
    if (diasHasta(b.fecha) < 0) return { general: 100, ...partes };
    const general = Math.round((partes.tareas * 3 + partes.invitados + partes.proveedores * 2 + partes.pagos * 2) / 8);
    return { general, ...partes };
  },

  /* Avisos que se ven en la tarjeta de la boda y en el inicio */
  alertas(b) {
    const a = [];
    if (diasHasta(b.fecha) < 0) return a;
    const tv = Store.deBoda('tareas', b.id).filter(t => !t.hecho && t.fecha && diasHasta(t.fecha) < 0);
    if (tv.length) a.push({ t: `${tv.length} ${tv.length === 1 ? 'tarea atrasada' : 'tareas atrasadas'}`, nivel: 'mal' });
    const c = this.cuentas(b.id);
    if (c.vencidos.length) a.push({ t: `${c.vencidos.length} ${c.vencidos.length === 1 ? 'pago vencido' : 'pagos vencidos'} a proveedores`, nivel: 'mal' });
    const h = this.honorarios(b);
    if (h.atrasado > 0) a.push({ t: 'Seña o saldo sin cobrar', nivel: 'mal' });
    const p = this.personas(b.id);
    if (diasHasta(b.fecha) <= 45 && p.pendientes > 0) a.push({ t: `Faltan ${p.pendientes} confirmaciones`, nivel: 'pronto' });
    if (diasHasta(b.fecha) <= 30) {
      const sinMesa = Store.deBoda('invitados', b.id).filter(i => i.estado !== 'No viene' && !i.mesaId).length;
      if (sinMesa) a.push({ t: `${sinMesa} ${sinMesa === 1 ? 'familia' : 'familias'} sin mesa`, nivel: 'pronto' });
    }
    return a;
  },

  /* Honorarios de Vanessa en esta boda (en pesos) */
  honorarios(b) {
    const mov = Store.listar('movimientos', m => m.bodaId === b.id && m.tipo === 'ingreso');
    const cobrado = suma(mov.filter(m => m.estado === 'cobrado'), m => aPesos(m.monto, m.moneda));
    const pendientes = mov.filter(m => m.estado === 'pendiente');
    const atrasado = suma(pendientes.filter(m => diasHasta(m.fecha) < 0), m => aPesos(m.monto, m.moneda));
    const total = suma(mov, m => aPesos(m.monto, m.moneda));
    const equipo = suma(Store.listar('asignaciones', x => x.bodaId === b.id), x => aPesos(x.monto, '$'));
    const gastos = suma(Store.listar('movimientos', m => m.bodaId === b.id && m.tipo === 'egreso' && m.cat !== 'Equipo'), m => aPesos(m.monto, m.moneda));
    return { total, cobrado, pendiente: total - cobrado, atrasado, cuotas: mov, equipo, gastos, ganancia: total - equipo - gastos };
  },

  paleta: b => b.paleta?.c || PALETAS[0].c,
};

/* Pone los colores de la boda en la página (variables --b1…--b4) */
function aplicarPaleta(b, el = document.documentElement) {

/* ---------- La seña ----------
   Al contratarla se paga una seña (20 % por defecto) para reservar la
   fecha, y el resto hasta unos días antes del evento (5 por defecto).
   Los dos valores se cambian en Ajustes. */
const Sena = {
  pct: () => +Store.cfg().senaPct || 0,
  dias: () => +Store.cfg().saldoDias || 0,
  monto: total => Math.round(total * Sena.pct() / 100),
  saldo: total => total - Sena.monto(total),
  /* Las dos cuotas de una boda: la seña hoy (o el día que reservó) y el saldo antes del evento */
  cuotas(fechaBoda, total, desde = iso(HOY())) {
    const saldoEl = sumarDias(fechaBoda, -Sena.dias());
    return [
      { fecha: desde, monto: Sena.monto(total), t: 'Seña para reservar la fecha' },
      { fecha: diasEntre(desde, saldoEl) < 0 ? desde : saldoEl, monto: Sena.saldo(total), t: 'Saldo' },
    ];
  },
  /* El texto de la forma de pago (se edita en Ajustes; {sena}, {saldo} y {dias} se completan solos) */
  texto: () => plantilla(Store.cfg().formaPago || CFG_INICIAL.formaPago, { sena: Sena.pct(), saldo: 100 - Sena.pct(), dias: Sena.dias() }),
};

/* ---------- Finanzas de Vanessa (todo en pesos) ---------- */
const Finanzas = {
  delMes(k) {
    const mov = Store.listar('movimientos', m => clave(m.fecha) === k);
    const ing = mov.filter(m => m.tipo === 'ingreso');
    const egr = mov.filter(m => m.tipo === 'egreso');
    const cobrado = suma(ing.filter(m => m.estado === 'cobrado'), m => aPesos(m.monto, m.moneda));
    const pagado = suma(egr.filter(m => m.estado !== 'pendiente'), m => aPesos(m.monto, m.moneda));
    return {
      cobrado, pagado, resultado: cobrado - pagado,
      porCobrar: suma(ing.filter(m => m.estado === 'pendiente'), m => aPesos(m.monto, m.moneda)),
      porPagar: suma(egr.filter(m => m.estado === 'pendiente'), m => aPesos(m.monto, m.moneda)),
      mov,
    };
  },
  porCobrar() { return Store.listar('movimientos', m => m.tipo === 'ingreso' && m.estado === 'pendiente'); },
  ultimosMeses(n = 12) {
    const r = [];
    for (let i = n - 1; i >= 0; i--) {
      const k = clave(sumarMeses(iso(HOY()).slice(0, 8) + '01', -i));
      r.push({ k, ...this.delMes(k) });
    }
    return r;
  },
};

/* ---------- Equipo ---------- */
const Equipo = {
  dePersona(id) {
    const a = Store.listar('asignaciones', x => x.personaId === id);
    return {
      fiestas: a.length,
      pagado: suma(a.filter(x => x.pagado), x => x.monto),
      debe: suma(a.filter(x => !x.pagado && diasHasta(Store.obtener('bodas', x.bodaId)?.fecha || iso(HOY())) < 0), x => x.monto),
      proximas: a.filter(x => diasHasta(Store.obtener('bodas', x.bodaId)?.fecha || '2000-01-01') >= 0).length,
      asign: a,
    };
  },
};

/* ---------- Proveedores: rango de precio para una cantidad de invitados ---------- */
function rangoProveedor(p, personas) {
  const f = p.unidad === 'por persona' ? personas : 1;
  return [p.min * f, p.max * f];
}

    Sena.cuotas(b.fecha, b.honorario, b.creadoEl).forEach(c => add('movimientos', {
      fecha: c.fecha, tipo: 'ingreso', cat: 'Honorarios', detalle: `${c.t} · ${Boda.pareja(b)}`, bodaId: b.id, cuota: c.t === 'Saldo' ? 'saldo' : 'sena',

  // Otros eventos que organizó (no son bodas, pero también le dejan plata)
  [[-380, 'Cumpleaños de 15 de Martina Lemos', 14000], [-300, 'Bodas de plata Sosa–Rivero', 10000], [-235, 'Fiesta de fin de año · Cooperativa Norte', 18000],
    [-170, 'Cumpleaños de 15 de Pilar Duarte', 14000], [-110, 'Baby shower · Familia Alves', 5000], [-48, 'Cumpleaños de 15 de Brenda Cardozo', 14000],

    [-160, 'Bautismo · Familia Gularte', 5000], [-220, 'Cumpleaños de 15 de Luana Ferraz', 14000], [-250, 'Boda civil · Machado–Bentancor (solo recepción)', 5000],

    .forEach(([dias, t, m]) => add('movimientos', { fecha: sumarDias(hoy, dias), tipo: 'ingreso', cat: 'Otros eventos', detalle: t, monto: m, moneda: '$', estado: dias <= 0 ? 'cobrado' : 'pendiente' }));

  // Gastos fijos y variables de los últimos 14 meses
  for (let i = 13; i >= 0; i--) {

/* ===== js/06-entrada.js ===== */
/* ============================================================
   PRESENTACIÓN DE WYDAN · BLOQUEO · TRANSICIÓN A UNA BODA
   Orden: presentación → bloqueo → la página.
   Con ?web=1 entra directo al bloqueo (para la web de Wydan).
   Dos formas de entrar: Vanessa (ve todo) o los novios de una boda
   (ven SOLO su boda y solo las secciones que Vanessa les habilitó).
   ============================================================ */

/* Quién está adentro: { rol: 'vanessa' } o { rol: 'novios', bodaId } */
let Sesion = null;

/* ---------- Vencimiento de la demostración (DEMO_VENCE en 01-config.js) ---------- */
const VENCE = new Date(DEMO_VENCE);
const quedaDemo = () => VENCE - Date.now();
const demoVencida = () => quedaDemo() <= 0;
const venceTexto = () => fechaLarga(DEMO_VENCE.slice(0, 10)).replace(/ de \d{4}$/, '');

/* «9 días 23 h 12 min 05 s» */
function cuentaDemo(corta = false) {
  const ms = Math.max(0, quedaDemo());
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
  if (corta) return `${d} ${d === 1 ? 'día' : 'días'} y ${h} h`;
  return [[d, d === 1 ? 'día' : 'días'], [h, 'h'], [m, 'min'], [String(s).padStart(2, '0'), 's']]
    .map(([n, t]) => `<span class="cd"><b>${n}</b>${t}</span>`).join('');
}

function pintarVence() {
  const bv = $('#bv-vence'), bq = $('#bq-vence');
  if (bv) bv.innerHTML = `<span class="bvv-t">⏳ Demostración disponible hasta el ${venceTexto()}</span><span class="bvv-cuenta">${cuentaDemo()}</span>`;
  if (bq) bq.textContent = `Disponible hasta el ${venceTexto()} · quedan ${cuentaDemo(true)}`;
}

/* Cuando vence, no se puede entrar más: se ve este aviso */
function mostrarVencida() {
  Sesion = null;
  document.body.classList.remove('en-boda', 'novios');
  $('#app').classList.add('hidden');
  $('#bloqueo').classList.add('hidden');
  $('#transicion').classList.add('hidden');
  $$('.modal-fondo').forEach(m => m.remove());
  const bv = $('#bienvenida');
  bv.classList.remove('hidden');
  bv.innerHTML = `<div class="bv-in bv-fin">
    <div class="bv-marca"><img src="${LOGO_WYDAN}" alt="Wydan Solutions"></div>
    <div class="bv-fin-ic">⏳</div>
    <div class="bv-para">Demostración para ${esc(BIENVENIDA.nombre)}</div>
    <h1 class="bv-t">Esta demostración terminó</h1>
    <p class="bv-frase">Estuvo disponible hasta el ${venceTexto()}. Si querés volver a verla o empezar con tu página,
      escribinos y la activamos de nuevo.</p>
    <a class="bv-btn" href="mailto:wydan.solutions@gmail.com?subject=${encodeURIComponent('Demostración Vanessa Camargo')}">Escribir a Wydan <b>→</b></a>
    <div class="bv-pie">Wydan Solutions · páginas de gestión a medida · wydan.solutions@gmail.com</div>
  </div>`;
}

function mostrarBienvenida() {
  if (demoVencida()) return mostrarVencida();
  $('#bv-logo').src = LOGO_WYDAN;
  $('#bv-nombre').textContent = BIENVENIDA.nombre;
  $('#bv-rol').textContent = BIENVENIDA.rol;
  $('#bv-frase').textContent = BIENVENIDA.frase;
  /* Vista previa en miniatura: su panel, con sus colores y bodas de colores */
  const tapas = PALETAS.slice(0, 3).map((p, i) => `<div class="vp-boda">
      <div class="vp-tapa" style="background:linear-gradient(135deg,${p.c[0]},${p.c[1]})">${['C & S', 'V & J', 'A & B'][i]}</div>
      <div class="vp-pie">${p.c.map(c => `<b style="background:${c}"></b>`).join('')}</div></div>`).join('');
  $('#bv-vista').innerHTML = `<div class="vp">
    <div class="vp-lat">${LOGO_VC.mini(46)}<i class="on"></i><i></i><i></i><i></i><i></i></div>
    <div class="vp-cuerpo"><div class="vp-t">Mis bodas</div><div class="vp-bodas">${tapas}</div></div></div>`;
  $('#bienvenida').classList.remove('hidden');
  $('#bloqueo').classList.add('hidden');
  $('#app').classList.add('hidden');
}

let _quien = 'vanessa';
function elegirQuien(q) {
  _quien = q;
  $$('.bq-solapas button').forEach(b => b.classList.toggle('on', b.dataset.quien === q));
  $('.bq-usuario').classList.toggle('hidden', q !== 'novios');
  $('#bq-error').textContent = '';
  const ej = Store.listar('bodas', b => b.acceso?.activo && diasHasta(b.fecha) >= 0)[0];
  $('#bq-ayuda').innerHTML = q === 'novios'
    ? (ej ? `Demostración · probá con <code>${esc(ej.acceso.usuario)}</code> y <code>${esc(ej.acceso.clave)}</code><br>
        <span class="chico">Cada pareja recibe su usuario desde «Acceso de los novios».</span>` : 'Ninguna boda tiene el acceso activado todavía.')
    : 'Demostración · la contraseña es <b>1234</b>';
  setTimeout(() => (q === 'novios' ? $('#bq-usuario') : $('#bq-clave')).focus(), 60);
}

function mostrarBloqueo() {
  if (demoVencida()) return mostrarVencida();
  const h = new Date().getHours();
  $('#bq-logo').innerHTML = LOGO_VC.completo(210);
  $('#bq-saludo').textContent = (h < 12 ? 'Buen día' : (h < 19 ? 'Buenas tardes' : 'Buenas noches'))
    + ' · ' + conMayuscula(`${DIAS[new Date().getDay()]} ${new Date().getDate()} de ${MESES[new Date().getMonth()]}`);
  $('#bq-wydan').src = LOGO_WYDAN;
  /* Fondo: los aros girando muy despacio y algunas hojas que caen */
  let hojas = `<div class="bq-aros">${LOGO_VC.aros(900)}</div>`;
  for (let i = 0; i < 9; i++) {
    const t = 14 + (i * 7) % 18, x = (i * 37 + 7) % 100, dur = 16 + (i * 5) % 12, dl = -(i * 3.3);
    hojas += `<svg class="hoja-suelta" width="${t * 2}" height="${t}" viewBox="0 -8 22 16" style="left:${x}%;animation-duration:${dur}s;animation-delay:${dl}s">
      <path d="M0 0 C5 -7 13 -7.5 21 0 C13 7.5 5 7 0 0Z" fill="${HOJA}" stroke="${HOJA_BORDE}" stroke-width="1"/><path d="M1.5 0 L18 0" stroke="${HOJA_BORDE}" stroke-width=".6"/></svg>`;
  }
  $('#bq-hojas').innerHTML = hojas;
  $('#bienvenida').classList.add('hidden');
  $('#bloqueo').classList.remove('hidden');
  $('#app').classList.add('hidden');
  $('#bq-clave').value = '';
  elegirQuien(_quien);
}

/* Comprobar el ingreso.
   ⚠ En la versión real esto lo hace Firebase Authentication: no hay
   ninguna contraseña escrita en el código, y las reglas de Firestore
   son las que impiden que unos novios vean otra boda. */
function probarClave(e) {
  e?.preventDefault();
  if (demoVencida()) return mostrarVencida();
  const clave = $('#bq-clave').value.trim();
  if (_quien === 'vanessa') {
    if (clave === CLAVE_DEMO) { Sesion = { rol: 'vanessa' }; return entrar(); }
    return rechazar('La contraseña no es correcta.');
  }
  const usuario = sinTildes($('#bq-usuario').value.trim());
  const b = Store.listar('bodas', x => x.acceso?.activo && sinTildes(x.acceso.usuario) === usuario)[0];
  if (b && b.acceso.clave === clave) { Sesion = { rol: 'novios', bodaId: b.id }; return entrar(); }
  rechazar(b ? 'La contraseña no es correcta.' : 'No encontramos ese usuario. Pediselo a Vanessa.');
}

function rechazar(msj) {
  $('#bq-error').textContent = msj;
  const t = $('#bq-tarjeta');
  t.classList.remove('tiembla'); void t.offsetWidth; t.classList.add('tiembla');
  $('#bq-clave').value = '';
  $('#bq-clave').focus();
}

function entrar() {
  $('#bq-clave').value = ''; $('#bq-usuario').value = '';
  $('#bienvenida').classList.add('hidden');
  $('#bloqueo').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#lat-wydan').src = LOGO_WYDAN;
  document.body.classList.toggle('novios', Sesion.rol === 'novios');
  if (Sesion.rol === 'novios') return abrirBoda(Sesion.bodaId, 'portada', true);
  const h = location.hash.replace('#', '');
  if (h.startsWith('boda/')) { const [, id, sec] = h.split('/'); if (Store.obtener('bodas', id)) return abrirBoda(id, sec || 'portada', false); }
  irA(PANTALLAS[h] && !h.startsWith('b-') ? h : 'inicio');
}

function bloquear() {
  Sesion = null;
  Vista.bodaId = null; Vista.comoNovios = false;
  document.body.classList.remove('en-boda', 'novios');
  aplicarPaleta(null);
  history.replaceState(null, '', location.pathname + location.search);
  mostrarBloqueo();
}

/* Pantalla de transición: "Camila & Santiago · sábado 14 de noviembre" con su paleta */
function transicion(b) {
  return new Promise(listo => {
    const tr = $('#transicion');
    aplicarPaleta(b);
    $('#tr-in').innerHTML = `<div class="tr-sobre">${Sesion?.rol === 'novios' ? 'Bienvenidos a su boda' : 'Organización de la boda de'}</div>
      <div class="tr-nombres">${esc(b.novia)}<span>&amp;</span>${esc(b.novio)}</div>
      <div class="tr-adorno"><i></i>${diasHasta(b.fecha) >= 0 ? '♡' : '✦'}<i></i></div>
      <div class="tr-fecha">${conMayuscula(fechaLarga(b.fecha))}</div>
      <div class="tr-lugar">${esc(b.lugar)}${b.ciudad ? ' · ' + esc(b.ciudad) : ''}</div>
      <div class="paleta grande">${Boda.paleta(b).map(c => `<i style="background:${c}"></i>`).join('')}</div>`;
    tr.classList.remove('hidden', 'sale');
    setTimeout(() => { tr.classList.add('sale'); listo(); }, 1650);
    setTimeout(() => tr.classList.add('hidden'), 2300);
  });
}


/* ===== js/07-nav.js ===== */
/* ============================================================
   NAVEGACIÓN
   Dos «mundos»:
   · el PANEL de Vanessa (oro y crema): inicio, bodas, agenda…
   · cada BODA (con su paleta): portada, invitados, salón…
   Cada pantalla se anota en PANTALLAS desde su propio archivo:
     PANTALLAS.inicio = { t: 'Inicio', pintar: hoja => { … } }
   ============================================================ */

const PANTALLAS = {};
const Vista = { sec: 'inicio', bodaId: null, comoNovios: false };

const MENU_PANEL = [
  { id: 'inicio',      t: 'Inicio',                ic: '⌂' },
  { id: 'bodas',       t: 'Mis bodas',             ic: '♡' },
  { id: 'calendario',  t: 'Calendario y agenda',   ic: '◷' },
  { id: 'clientes',    t: 'Clientes',              ic: '☺' },
  { id: 'proveedores', t: 'Proveedores',           ic: '✦' },
  { id: 'planes',      t: 'Planes y presupuestos', ic: '◈' },
  { sep: 'Mi negocio' },
  { id: 'finanzas',    t: 'Finanzas',              ic: '$' },
  { id: 'equipo',      t: 'Equipo',                ic: '✿' },
  { id: 'ajustes',     t: 'Ajustes',               ic: '⚙' },
];

/* ¿Lo está mirando una pareja (o Vanessa en «ver como los novios»)? */
const vistaNovios = () => Sesion?.rol === 'novios' || Vista.comoNovios;
const bodaAbierta = () => Vista.bodaId ? Store.obtener('bodas', Vista.bodaId) : null;

/* Secciones de la boda que se pueden ver ahora */
function seccionesVisibles(b) {
  if (!vistaNovios()) return SECCIONES_BODA;
  const ok = b.acceso?.secciones || [];
  return SECCIONES_BODA.filter(s => !s.privada && (s.id === 'portada' || ok.includes(s.id)));
}

function armarMenu() {
  const b = bodaAbierta();
  const lat = $('#lat-cabeza'), menu = $('#lat-menu');
  if (!b) {
    lat.innerHTML = LOGO_VC.horizontal();
    const proximas = Store.listar('bodas', x => diasHasta(x.fecha) >= 0).length;
    const consultas = Store.listar('clientes', c => c.etapa === 'Consulta').length;
    menu.innerHTML = MENU_PANEL.map(m => m.sep ? `<div class="lm-sep">${m.sep}</div>` :
      `<button data-ir="${m.id}" class="${Vista.sec === m.id ? 'on' : ''}"><span class="ic">${m.ic}</span>${m.t}
        ${m.id === 'bodas' ? `<span class="globo suave">${proximas}</span>` : ''}
        ${m.id === 'clientes' && consultas ? `<span class="globo">${consultas}</span>` : ''}</button>`).join('');
  } else {
    const c = Boda.cuenta(b);
    lat.innerHTML = `<button class="lat-volver" data-ir="bodas">‹ Volver a mis bodas</button>
      <div class="lat-boda"><div class="lb-n">${esc(b.novia)} &amp; ${esc(b.novio)}</div>
        <div class="lb-f">${conMayuscula(fechaMedia(b.fecha))}</div>
        <div class="lb-pie"><span class="lb-d">${diasHasta(b.fecha) >= 0 ? `Faltan ${c.dias} días` : 'Ya se casaron ♡'}</span>
          <span class="paleta">${Boda.paleta(b).map(x => `<i style="background:${x}"></i>`).join('')}</span></div></div>`;
    menu.innerHTML = `<div class="lm-sep">${vistaNovios() ? 'Nuestra boda' : 'Esta boda'}</div>` +
      seccionesVisibles(b).map(s => `<button data-ir="b-${s.id}" class="${Vista.sec === 'b-' + s.id ? 'on' : ''}">
        <span class="ic">${s.ic}</span>${s.t}${s.privada ? '<span class="globo suave" title="Solo lo ves vos">🔒</span>' : ''}</button>`).join('');
  }
  $$('[data-ir]', $('#lateral')).forEach(x => x.onclick = () => {
    cerrarMenuCel();
    const d = x.dataset.ir;
    if (d === 'bodas' && b) return salirDeBoda();
    irA(d);
  });
  armarAbajo();
}

function armarAbajo() {
  const b = bodaAbierta();
  const lista = b
    ? [['b-portada', '♡', 'Portada'], ['b-invitados', '✉', 'Invitados'], ['b-salon', '◎', 'Salón'], ['b-tareas', '✓', 'Tareas']]
      .filter(([id]) => seccionesVisibles(b).some(s => 'b-' + s.id === id))
    : [['inicio', '⌂', 'Inicio'], ['bodas', '♡', 'Bodas'], ['calendario', '◷', 'Agenda'], ['clientes', '☺', 'Clientes']];
  $('#abajo').innerHTML = lista.map(([id, ic, t]) => `<button data-ir="${id}" class="${Vista.sec === id ? 'on' : ''}"><span class="ic">${ic}</span>${t}</button>`).join('')
    + `<button data-mas="1"><span class="ic">☰</span>Más</button>`;
  $$('#abajo [data-ir]').forEach(x => x.onclick = () => irA(x.dataset.ir));
  $('#abajo [data-mas]').onclick = abrirMenuCel;
}

function arriba() {
  const b = bodaAbierta();
  const p = PANTALLAS[Vista.sec];
  $('#titulo-seccion').textContent = p?.t || '';
  $('#arriba-migas').textContent = b ? `${b.novia} & ${b.novio}` : 'Vanessa Camargo';
  const d = new Date();
  let der = `<span class="hoy">${conMayuscula(`${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`)}</span>`;
  if (b && Sesion?.rol === 'vanessa') {
    der = `<button class="btn mini ${Vista.comoNovios ? 'p' : ''}" id="ver-novios" title="Mirá la boda tal cual la ven los novios">
      ${Vista.comoNovios ? '← Volver a mi vista' : '👁 Ver como los novios'}</button>`;
  }
  $('#arriba-der').innerHTML = der;
  const vn = $('#ver-novios');
  if (vn) vn.onclick = () => {
    Vista.comoNovios = !Vista.comoNovios;
    if (Vista.comoNovios && !seccionesVisibles(b).some(s => 'b-' + s.id === Vista.sec)) Vista.sec = 'b-portada';
    aviso(Vista.comoNovios ? 'Así ven la boda los novios' : 'Volviste a tu vista completa');
    pintarActual();
  };
}

/* Ir a una pantalla */
function irA(sec) {
  if (!PANTALLAS[sec]) sec = bodaAbierta() ? 'b-portada' : 'inicio';
  if (sec.startsWith('b-') && !bodaAbierta()) sec = 'inicio';
  Vista.sec = sec;
  const b = bodaAbierta();
  history.replaceState(null, '', b ? `#boda/${b.id}/${sec.slice(2)}` : '#' + sec);
  pintarActual(true);
  window.scrollTo({ top: 0 });
}

/* animar = la hoja aparece suavecito (solo al cambiar de pantalla, no al repintar) */
function pintarActual(animar = false) {
  armarMenu();
  arriba();
  const hoja = $('#hoja');
  hoja.style.animation = 'none';
  if (animar) { void hoja.offsetWidth; hoja.style.animation = ''; }
  try { PANTALLAS[Vista.sec].pintar(hoja); }
  catch (e) { console.error(e); hoja.innerHTML = `<div class="vacio"><b>Algo no salió bien</b>${esc(e.message)}</div>`; }
  prepararTablas(hoja);
}
const repintar = () => pintarActual();

/* Entrar a una boda (con la pantalla de transición) */
async function abrirBoda(id, sec = 'portada', conTransicion = true) {
  const b = Store.obtener('bodas', id);
  if (!b) return;
  Vista.bodaId = id;
  Vista.comoNovios = false;
  document.body.classList.add('en-boda');
  aplicarPaleta(b);
  if (conTransicion) await transicion(b);
  irA('b-' + sec);
}

function salirDeBoda(sec = 'bodas') {
  if (Sesion?.rol === 'novios') return;
  Vista.bodaId = null; Vista.comoNovios = false;
  document.body.classList.remove('en-boda');
  aplicarPaleta(null);
  irA(sec);
}

/* Menú en el celular */
function abrirMenuCel() { $('#lateral').classList.add('abierto'); $('#tapa').classList.add('ver'); }
function cerrarMenuCel() { $('#lateral').classList.remove('abierto'); $('#tapa').classList.remove('ver'); }

/* Barritas de los últimos 12 meses: cobrado vs gastos */
function graficoAnio() {
  const meses = Finanzas.ultimosMeses(12);
  const max = Math.max(...meses.map(m => Math.max(m.cobrado, m.pagado)), 1);
  const total = suma(meses, m => m.resultado);
  return `<div class="mini-graf">${meses.map(m => `<div class="mg-col" title="${mesNombre(m.k)}: cobrado ${pesos(m.cobrado)}, gastos ${pesos(m.pagado)}">
      <div class="mg-barras"><i style="height:${(m.cobrado / max * 100).toFixed(1)}%"></i><i class="g" style="height:${(m.pagado / max * 100).toFixed(1)}%"></i></div>
      <span>${MESES_C[+m.k.slice(5) - 1]}</span></div>`).join('')}</div>
    <div class="mg-pie"><span><i class="mg-c"></i>Cobrado</span><span><i class="mg-c g"></i>Gastos</span>
      <b>Te quedaron ${pesos(total)} en 12 meses</b></div>`;
}

let _filtroBodas = 'proximas', _buscaBodas = '';

PANTALLAS.bodas = {

      <div class="filtros">

          <button data-f="proximas" class="${_filtroBodas === 'proximas' ? 'on' : ''}">Próximas · ${prox.length}</button>

      <div class="bodas-grilla">${lista.map(tarjetaBoda).join('') ||
        vacio('♡', 'No hay bodas acá', _buscaBodas ? 'Probá con otra búsqueda.' : '')}

  return `<button class="boda-tarj ${d < 0 ? 'pasada' : ''}" data-id="${b.id}" style="--c1:${c1};--c2:${c2};--c3:${c3};--c4:${c4}">

      </div>
      <div class="bt-alertas">${al.length ? al.slice(0, 2).map(a => `<span class="chip ${a.nivel}">${esc(a.t)}</span>`).join('')
        : `<span class="chip ${d < 0 ? 'ok' : ''}">${esc(Boda.estado(b))}</span>`}</div>
      <div class="bt-pie"><span class="paleta">${[c1, c2, c3, c4].map(c => `<i style="background:${c}"></i>`).join('')}</span>
